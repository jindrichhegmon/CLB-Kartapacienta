<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<title>Karta pacienta</title>
<style>
  :root{color-scheme:light}

  body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}

</head>

</div>
<script>
/* Aplikace je jen obal: hned otevře živou stránku Můj průkaz (/pacient/) na serveru Karty pacienta. Všechno ostatní
   (párování kódem průkazu, uložení ve vlastním telefonu, synchronizace, videohovor) dělá stránka sama.
   Jiný server = změnit ADRESA a vydat nový build. */
var ADRESA = 'https://kartapacienta.95-216-201-2.sslip.io/pacient/';
