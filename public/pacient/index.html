try { var _v = localStorage.getItem('kp_vzhled'); if (_v === 'tmava') document.documentElement.setAttribute('data-theme', 'dark'); else if (_v && _v !== 'modra' && /^[a-z]+$/.test(_v)) { document.documentElement.setAttribute('data-theme', 'light'); document.documentElement.setAttribute('data-skin', _v); } } catch (e) {}</script>

<body>
<div class="app">
  <header class="top" id="top"></header>
  <div class="rezim rodina" id="rezim">Karta pacienta a rodiny <span class="chip">vlastní telefon pacienta</span></div>
  <main class="content" id="work"></main>
</div>
<div id="tisk"></div>
<div id="modal"></div><div id="toast" class="toast" hidden></div>
<script src="/shared/kp.js"></script>
<script src="/shared/kp-napoveda.js"></script>
<script>
/*
 * Můj průkaz – paliativní průkaz ve vlastním telefonu pacienta.
 *  - data od lékaře (plán, kontakty, tým) přicházejí z centrály a jsou jen ke čtení; deník týmu ani PINy týmu sem nechodí
 *  - vlastní záznamy pacienta (hodnoty a přání, léky, poznámky) jsou JEN v tomto telefonu; týmu odejdou, až když je pacient
 *    sám vybere, uvidí náhled a potvrdí (POST /api/d/sdilet)
 *  - vše je v IndexedDB šifrované dvakrát: klíčem odvozeným z PINu pacienta (PBKDF2) a klíčem telefonu, který nejde vyexportovat;
 *    bez PINu z telefonu nic přečíst nejde – ani token pro spojení se serverem
 */
const APP_VERZE = 'pacient-0.11.13';
const { esc, toast, modal, closeModal, fmtD, fmtDT, CILE } = KP;
const $ = (id) => document.getElementById(id);
let D = null;          // odemčená data: { tenant, token, zarizeniId, telefon, balik, posledniSync, parovano, odpojeno, moje:{…} }
let pinKlic = null;    // klíč z PINu – jen v paměti, po zamčení se zahodí
let tab = 'prehled', syncBezi = false, chybaSync = '', posledniAkce = Date.now(), skryto = 0;
const TABY = [['prehled', 'Průkaz'], ['lekar', 'Od lékaře'], ['prani', 'Přání'], ['leky', 'Léky'], ['poznamky', 'Poznámky'], ['sdilet', 'Sdílet'], ['nouze', 'Nouzové info'], ['nastaveni', 'Nastavení']];
const IKONY = {
  prani: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>',
  leky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="M9.5 8.5l5 7"/></svg>',
  poznamky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4M8 9h8M8 13h5"/></svg>',
  sdilet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
  nouze: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v6M9 11h6"/></svg>',
  nastaveni: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
};
const ikona = (id) => IKONY[id] || KP.ICON[{ prehled: 'karta', lekar: 'plan' }[id]] || KP.ICON.udaje;
const NAZ_TABU = Object.fromEntries(TABY);
KP.napoveda.nastav({ aplikace: 'pacient', auth: () => (D && D.token ? { token: D.token, typ: 'Device' } : null), kapitola: 19,
  obrazovka: () => (!D ? 'Zamčeno / úvod' : NAZ_TABU[tab] || tab) });

/* ---------------- šifrované úložiště ---------------- */
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => { const r = indexedDB.open('kp-pacient', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this.db;
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async clear() { const db = await this.open(); return new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = () => res(); }); },
};
const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
const ITERACE = 310000;
async function klicTelefonu() {
  let k = await IDB.get('klic');
  if (!k) { k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); await IDB.set('klic', k); }
  return k;
}
async function klicZPinu(pin, saltHex, iterace) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: unhex(saltHex), iterations: iterace }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sifruj(klic, data) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, klic, data)); const o = new Uint8Array(12 + ct.length); o.set(iv); o.set(ct, 12); return o; }
async function desifruj(klic, data) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, klic, data.slice(12))); }
async function uloz() {
  if (!D || !pinKlic) return;
  try {
    const vnitrni = await sifruj(pinKlic, new TextEncoder().encode(JSON.stringify(D)));
    await IDB.set('data', await sifruj(await klicTelefonu(), vnitrni));
  } catch (e) { toast('Data se nepodařilo uložit do telefonu'); }
}
async function odemkniUloziste(pin) {
  const z = await IDB.get('zamek'); const data = await IDB.get('data');
  if (!z || !data) return null;
  const k = await klicZPinu(pin, z.salt, z.iterace);
  try {
    const vnitrni = await desifruj(await klicTelefonu(), data);
    const d = JSON.parse(new TextDecoder().decode(await desifruj(k, vnitrni)));
    pinKlic = k; return d;
  } catch { return null; }
}
async function nastavPin(pin) {
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  pinKlic = await klicZPinu(pin, salt, ITERACE);
  await IDB.set('zamek', { salt, iterace: ITERACE });
  await uloz();
}
const pinOk = (p) => /^\d{6,12}$/.test(p) && !/^(\d)\1+$/.test(p) && !'01234567890123'.includes(p) && !'98765432109876'.includes(p);

/* ---------------- zamykání ---------------- */
const ZAMEK_MS = 5 * 60 * 1000;
['pointerdown', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, () => { posledniAkce = Date.now(); }, { passive: true }));
setInterval(() => { if (D && Date.now() - posledniAkce > ZAMEK_MS) zamkni('Průkaz se po 5 minutách zamkl'); }, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') skryto = Date.now();
  else if (D && skryto && Date.now() - skryto > 60000) zamkni();
  else if (D) sync();
});
function zamkni(hlaska) { D = null; pinKlic = null; tab = 'prehled'; closeModal(); start(); if (hlaska) toast(hlaska); }

/* ---------------- synchronizace s centrálou ---------------- */
async function sync({ tichy = true } = {}) {
  if (!D || !D.token || syncBezi) return;
  if (!navigator.onLine) { chybaSync = 'bez připojení'; kresliSyncBar(); return; }
  syncBezi = true; kresliSyncBar();
  try {
    const r = await KP.api('/api/d/sync', { method: 'POST', token: D.token, typ: 'Device', body: { fronta: [], verzePlanu: D.balik && D.balik.plan && D.balik.plan.verze, verzeAplikace: APP_VERZE } });
    if (r.prikaz === 'odpojit' || r.prikaz === 'smazat') {
      D.token = null; D.odpojeno = new Date().toISOString(); await uloz(); kresli();
      modal('<h2>Přístup z tohoto místa skončil</h2><p>Buď jste průkaz propojili znovu jinde (třeba v aplikaci na ploše – ta má vlastní úložiště a platí teď ona), nebo lékař přístup ukončil. Údaje od lékaře se tady už nebudou aktualizovat. Co v telefonu máte, zůstává – i vaše vlastní přání, léky a poznámky. Pokud jde o omyl, požádejte lékaře o nový kód.</p><div class="quick"><button class="btn" data-close>Rozumím</button></div>');
      return;
    }
    const novaVerze = r.balik.plan && D.balik.plan && r.balik.plan.verze !== D.balik.plan.verze;
    D.balik = r.balik; D.posledniSync = new Date().toISOString(); chybaSync = '';
    await uloz();
    if (!tichy) toast('Aktualizováno');
    else if (novaVerze) toast('Lékař aktualizoval plán péče');
  } catch (e) {
    chybaSync = e.status === 401 ? 'telefon už není propojený' : 'server nedostupný';
    if (e.status === 401) { D.token = null; D.odpojeno = D.odpojeno || new Date().toISOString(); await uloz(); }
  } finally { syncBezi = false; if (D) kresli(); }
}

/* ---------------- vykreslení ---------------- */
const textStari = () => {
  if (!D || !D.posledniSync) return 'nikdy';
  const m = Math.round((Date.now() - new Date(D.posledniSync).getTime()) / 60000);
  if (m < 1) return 'právě teď'; if (m < 60) return `před ${m} min`; const h = Math.round(m / 60); if (h < 48) return `před ${h} h`; return `před ${Math.round(h / 24)} dny`;
};
function kresliSyncBar() {
  const el = $('syncbar'); if (!el || !D) return;
  if (D.odpojeno) { el.innerHTML = `<span class="dot warn"></span><span>údaje od lékaře z ${esc(fmtDT(D.posledniSync))} · přístup ukončen</span>`; return; }
  el.innerHTML = `<span class="dot ${chybaSync ? 'warn' : 'ok'}"></span><span>${syncBezi ? 'aktualizuji…' : `údaje od lékaře aktualizovány ${textStari()}${chybaSync ? ' · ' + esc(chybaSync) : ''}`}</span><button class="btn ghost right" id="btnSync" aria-label="Aktualizovat">${KP.ICON.sync}</button>`;
  $('btnSync').onclick = () => sync({ tichy: false });
}
function hlavicka() {
  if (!D) { $('top').innerHTML = `<img src="/icons/icon.svg" width="40" height="40" style="border-radius:12px" alt=""><div class="ttl"><h1>Můj průkaz</h1><div class="meta">paliativní průkaz ve vašem telefonu</div></div>${KP.tlacitkaHlavicky({ vzhled: true })}<span class="verbadge">${APP_VERZE.replace('pacient-', 'v')}</span>`; return; }
  const p = D.balik.pacient;
  $('top').innerHTML = `${tab !== 'prehled' ? `<button class="back" id="btnBack" aria-label="Zpět">${KP.ICON.back}</button>` : '<img src="/icons/icon.svg" width="40" height="40" style="border-radius:12px" alt="">'}
    <div class="ttl"><h1>${esc(p.jmeno)} ${esc(p.prijmeni)}</h1><div class="meta">Můj průkaz · ${esc(p.kod)}</div></div>
    ${KP.tlacitkaHlavicky({ vzhled: true })}<button class="rolebtn" id="btnZamek" style="--c:var(--ok)"><span class="dot"></span>zamknout</button>`;
  if ($('btnBack')) $('btnBack').onclick = () => { tab = 'prehled'; kresli(); };
  $('btnZamek').onclick = () => zamkni();
}
const puvodLekar = (b) => b.plan ? `${esc(b.plan.podepsal)}${b.garant && b.garant.poskytovatel ? ', ' + esc(b.garant.poskytovatel) : ''} · plán verze ${b.plan.verze} ze dne ${esc(fmtD(b.plan.vytvoreno))}` : 'od lékaře';
function kresli() {
  hlavicka();
  if (!D) return;
  const b = D.balik;
  let html = `<div class="syncbar" id="syncbar"></div>`;
  if (D.odpojeno) html += `<div class="banner warn">Lékař ukončil přístup ${esc(fmtD(D.odpojeno))}. Údaje od lékaře se už neaktualizují – pro nový přístup požádejte lékaře o kód.</div>`;
  if (b.pacient.stav === 'UZAVRENY') html += '<div class="banner warn">Průkaz byl uzavřen.</div>';
  html += `<div class="tiles p8">${TABY.map(([id, n]) => `<button class="tile ${tab === id ? 'on' : ''}" data-tab="${id}">${ikona(id)}<span>${n}</span></button>`).join('')}</div>`;
  html += ({ prehled: prehledHTML, lekar: lekarHTML, prani: praniHTML, leky: lekyHTML, poznamky: poznamkyHTML, sdilet: sdiletHTML, nouze: nouzeHTML, nastaveni: nastaveniHTML })[tab](b);
  html += `<div class="footer">Můj průkaz ${APP_VERZE.replace('pacient-', 'v')} · údaje od lékaře jen ke čtení · vaše záznamy jsou jen v tomto telefonu</div>`;
  $('work').innerHTML = html;
  KP.sbalVysvetlivky($('work'), { pred: '.footer' });
  kresliSyncBar();
  bind();
  if (tab === 'prehled') nactiNahledChatu();
}
function prehledHTML(b) {
  const m = D.moje;
  return `<div class="panel"><div class="rolehelp"><b>Váš paliativní průkaz.</b> Nahoře je krizová karta tak, jak ji vede váš lékař. Pod ní si v oddílech <b>Přání</b> a <b>Poznámky</b> vedete své vlastní záznamy a v <b>Lécích</b> zaznamenáváte podání předepsaných léků – zůstává to jen ve vašem telefonu, dokud to sami nepošlete.</div></div>
    <div class="puvod" style="padding:4px 2px 0"><span class="chip lek">od lékaře</span> ${puvodLekar(b)}</div>
    ${KP.kartaHTML({ ...b, denik: [] })}
    ${b.pecedoma && b.pecedoma.chat ? `<div class="panel"><div class="panel-h"><h2>Zprávy pro a od lékaře</h2><span class="chip lek">PéčeDoma</span></div><div style="padding:12px 14px"><div id="pdNahled">${D.zpravy ? KP.chatNahled(D.zpravy, 'OD_PACIENTA', CHAT_NAZVY) : '<div class="muted" style="font-size:13px;padding:0 0 6px">Načítám zprávy…</div>'}</div><div class="quick"><button class="btn primary" id="pdChat">💬 ${D.zpravy && D.zpravy.length ? 'Všechny zprávy a odpověď' : 'Napsat lékaři'}</button></div></div></div><div class="note"><b>Zprávy pro a od lékaře:</b> napište svému lékaři a sestrám, nebo si přečtěte, co vám poslali. Zprávy jsou stejné jako v aplikaci PéčeDoma.</div>` : ''}
    <div class="panel"><div class="panel-h"><h2>Moje záznamy</h2><span class="chip pac">jen v tomto telefonu</span></div><dl class="kv" style="padding:12px 14px">
      <dt>Hodnoty a přání</dt><dd>${m.prani.aktualizovano ? 'aktualizováno ' + esc(fmtDT(m.prani.aktualizovano)) : '<span class="muted">zatím nevyplněno</span>'}</dd>
      <dt>Podání léků</dt><dd>${(m.podani || []).length ? `${(m.podani || []).length} záznamů, poslední ${esc(fmtDT((m.podani || []).map((z) => z.cas).sort().pop()))}` : '<span class="muted">zatím nezaznamenáno</span>'}</dd>
      <dt>Poznámky a otázky</dt><dd>${m.poznamky.length || '<span class="muted">žádné</span>'}</dd>
      <dt>Naposledy sdíleno</dt><dd>${m.sdileno.length ? esc(fmtDT(m.sdileno[m.sdileno.length - 1].cas)) : '<span class="muted">zatím nic</span>'}</dd></dl></div>
    <div class="note">V krizi pomůže tištěná krizová karta a Zdravotní ID na zamčené obrazovce telefonu (oddíl <b>Nouzové info</b>) – do zamčeného telefonu se záchranka nedostane.</div>`;
}
function lekarHTML(b) {
  const lek = '<span class="chip lek">od lékaře</span>';
  if (!b.plan) return '<div class="banner warn">Lékař zatím plán péče nestanovil.</div>' + kontaktyHTML(b);
  const p = b.plan.data, dk = p.doklad || {};
  return `<div class="panel"><div class="panel-h"><h2>Plán péče</h2>${lek}</div><div class="puvod">${puvodLekar(b)}</div><dl class="kv" style="padding:0 14px 12px">
      <dt>Cíl péče</dt><dd>${esc(CILE[p.cil] || '—')}</dd><dt>Limitace</dt><dd>${esc((p.limity || []).join(', ') || 'žádné')}</dd>
      <dt>Doklad</dt><dd>${KP.dokladHTML(dk)}${dk.dvp && dk.original ? '<br>originál: ' + esc(dk.original) : ''}</dd>
      <dt>Diagnózy</dt><dd>${esc(p.dg || '—')}</dd><dt>Funkční stav</dt><dd>${esc(p.funkce || '—')}</dd><dt>Alergie</dt><dd>${esc(p.alergie || '—')}</dd>
      <dt>Platnost</dt><dd>${KP.prosly(b.plan.platnostDo) ? '<span class="chip warn">čeká na revizi lékařem</span>' : 'do ' + fmtD(b.plan.platnostDo)}</dd></dl></div>

  const vybrane = polozkySouhrnu(D.balik).filter((x) => ids.includes(x.id));
  if (!vybrane.length) return toast('Vyberte, co chcete předat');
  const vlastni = vybrane.filter((x) => x.druh);
  modal(`<h2>Náhled</h2>${souhrnHTML(vybrane)}
    <div class="quick" style="margin-top:12px"><button class="btn primary" id="sd_tisk">Vytisknout / PDF</button>
      <button class="btn" id="sd_tym" ${vlastni.length && D.token ? '' : 'disabled'}>Poslat svému týmu${vlastni.length < vybrane.length && vlastni.length ? ' (jen vaše údaje)' : ''}</button>

    ${!D.token ? '<div class="note">Poslat týmu teď nejde – přístup k průkazu je ukončený.</div>' : !vlastni.length ? '<div class="note">Týmu se posílají jen vaše vlastní údaje (přání, léky, poznámky).</div>' : ''}`, () => {

      const t = souhrnText(vybrane);

      try { await navigator.clipboard.writeText(t); toast('Souhrn zkopírován – vložte ho do e-mailu nebo zprávy'); } catch { toast('Sdílení tento prohlížeč neumí – použijte tisk'); }

      const ok = await KP.confirm('Poslat svému týmu', `Do centrální aplikace vašeho týmu odejde: <b>${esc(vlastni.map((x) => x.nazev).join(', '))}</b>. Uvidí to lékaři a sestry, kteří o vás pečují. Po odeslání to už nepůjde vzít zpět – stane se to součástí záznamu týmu.`, 'Poslat');

  modal(`<h2>Načíst QR kód</h2><p class="muted" style="margin:0">Namiřte fotoaparát na QR kód, který vám ukazuje lékař.</p>
    <video id="qr_v" playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:1;object-fit:cover"></video>
    <div class="quick"><button class="btn" id="qr_zpet">Zrušit</button></div>`, (m) => { m.querySelector('#qr_zpet').onclick = () => { stop(); closeModal(); }; });
  const v = $('qr_v'); v.srcObject = stream;
  try { await v.play(); } catch { /* */ }
  const det = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  if (!det) { try { await nactiJsQr(); } catch (e) { stop(); closeModal(); return toast(e.message); } }
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const krok = async () => {
    if (!document.body.contains(v)) return stop();
    let text = '';
    if (v.readyState >= 2 && v.videoWidth) {
      try {
        if (det) { const r = await det.detect(v); text = r[0] ? r[0].rawValue : ''; }
        else { const w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h; ctx.drawImage(v, 0, 0, w, h); const r = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); text = r ? r.data : ''; }
      } catch { /* další snímek */ }
    }
    const h = text.match(/p=([A-Z0-9]{16})\.([A-Z0-9]{8})(?:\.T(\d{9,15}))?/i);
    if (h) { stop(); closeModal(); if (navigator.vibrate) navigator.vibrate(80); propojeniHTML({ tenant: h[1].toUpperCase(), kod: h[2].toUpperCase(), telefon: h[3] ? '+' + h[3] : '' }); return; }
    if (text) toast('To není QR kód průkazu');
    setTimeout(krok, 250);
  };
  krok();
}
async function propojit(tenant, kod, telefon) {
  tenant = String(tenant || '').toUpperCase().trim(); kod = String(kod || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!String(telefon || '').replace(/\D/g, '')) return toast('Zadejte číslo svého telefonu');
  try {
    const r = await KP.api('/api/d/parovat', { method: 'POST', body: { tenant, kod, telefon, rezim: 'PACIENT' } });
    const nove = { tenant, token: r.token, zarizeniId: r.zarizeniId, telefon: r.telefon, balik: r.balik, posledniSync: new Date().toISOString(), parovano: new Date().toISOString(), odpojeno: null,
      moje: { prani: {}, leky: [], poznamky: [], podani: [], sdileno: [] } };
    history.replaceState(null, '', location.pathname);
    // vlastní záznamy z dřívějška se při novém propojení neztratí (stejný telefon, nový kód od lékaře) – jen když je telefon odemčený
    if (D && D.moje) nove.moje = D.moje;
    pinOkno({ titulek: 'Nastavte si PIN', popis: 'Průkaz je propojený. PINem budete Můj průkaz otevírat a jím jsou data v telefonu zašifrovaná.', zrusit: false,
      hotovo: async (pin) => { D = nove; await nastavPin(pin); posledniAkce = Date.now(); tab = 'prehled'; kresli(); toast('Hotovo – Můj průkaz je ve vašem telefonu'); } });
  } catch (e) { toast(e.message); }
}

/* ---------------- start ---------------- */
async function start() {
  let ulozeno = false;
  try { ulozeno = !!(await IDB.get('data')); } catch { /* prohlížeč bez úložiště */ }
  const h = location.hash.match(/p=([A-Z0-9]{16})\.([A-Z0-9]{8})(?:\.T(\d{9,15}))?/i);
  if (h && !ulozeno) return propojeniHTML({ tenant: h[1].toUpperCase(), kod: h[2].toUpperCase(), telefon: h[3] ? '+' + h[3] : '' });
  if (h && ulozeno) {
    await zamekHTML();
    modal('<h2>Telefon už Můj průkaz má</h2><p>Odemkněte ho svým PINem. Pokud vám lékař poslal nový kód (například po ukončení přístupu), otevřete po odemčení odkaz z SMS znovu – vaše záznamy zůstanou.</p><div class="quick"><button class="btn" data-close>Rozumím</button></div>');
    return;
  }
  if (ulozeno) return zamekHTML();
  propojeniHTML();
}
(async function init() {
  await start();
  addEventListener('online', () => sync());
  addEventListener('hashchange', () => { const h = location.hash.match(/p=([A-Z0-9]{16})\.([A-Z0-9]{8})(?:\.T(\d{9,15}))?/i); if (h && D) propojeniHTML({ tenant: h[1].toUpperCase(), kod: h[2].toUpperCase(), telefon: h[3] ? '+' + h[3] : '' }); });
  setInterval(() => { if (D && document.visibilityState === 'visible') sync(); }, 5 * 60 * 1000);
  setInterval(kresliSyncBar, 30000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/pacient/sw.js', { scope: '/pacient/' }).catch(() => {});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { /* */ }
})();
</script>
