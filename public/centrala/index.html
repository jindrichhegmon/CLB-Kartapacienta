<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centrální aplikace · Karta pacienta</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script>/* vzhled zvolený na tomto zařízení – nastaví se před vykreslením, aby stránka neprobleskla jinou barvou */
try { var _v = localStorage.getItem('kp_vzhled'); if (_v === 'tmava') document.documentElement.setAttribute('data-theme', 'dark'); else if (_v && _v !== 'modra' && /^[a-z]+$/.test(_v)) { document.documentElement.setAttribute('data-theme', 'light'); document.documentElement.setAttribute('data-skin', _v); } } catch (e) {}</script>
<link rel="stylesheet" href="/shared/kp.css">
<style>
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 13px;height:34px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--accent-ink)}
  .nav button:hover{background:var(--surface-2)}
  .nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25}
  .anon{white-space:pre-wrap;font-family:var(--mono);font-size:12px;max-height:260px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px}
  .kontrow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;align-items:center}
  @media (max-width:640px){.kontrow{grid-template-columns:1fr 1fr}}
  @media print{ .top,.nav,.tabs,.actions,.noprint,#modal,#toast{display:none!important} .card{box-shadow:none} }
</style>
</head>
<body>
<div class="app wide">
  <header class="top" id="top"></header>
  <main class="content" id="work"></main>
</div>
<div id="modal"></div><div id="toast" class="toast" hidden></div>
<script src="/shared/kp.js"></script>
<script src="/shared/qrcode.js"></script>
<script src="/shared/kp-napoveda.js"></script>
<script>
const { esc, api, toast, modal, closeModal, fmtD, fmtDT, CILE, LIMITY } = KP;
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
if (qs.get('t')) { localStorage.setItem('kp_tenant', qs.get('t').toUpperCase()); history.replaceState(null, '', location.pathname); }
const S = { tenant: localStorage.getItem('kp_tenant') || '', session: sessionStorage.getItem('kp_session') || '', ja: null, view: 'pacienti', pac: null, tab: 'karta', stav: 'AKTIVNI', posk: [], wiz: null };
/* fulltextové hledání v agendách (0.11.15): políčko filtruje řádky tabulek na stránce – všechna slova, bez ohledu na diakritiku a velikost písmen; text se pamatuje pro každou agendu */
S.hledat = {};
/* pacient v domově seniorů (0.11.16): podle pracoviště typu DOMOV v týmu kolem pacienta, jinak podle textu pobytu */
const vDomove = (p, tym) => { const t = (tym || []).find((x) => x.typ === 'DOMOV'); if (t) return t.nazev; if (p && p.domov) return p.domov; return /domov|dps\b|senior|pobytov|ldn\b/i.test(String((p && p.pobyt) || '')) ? '' : null; };
const domovChip = (nazev) => nazev === null ? '' : `<span class="chip dom" title="Pacient je v domově seniorů / pobytové službě">🏠 domov seniorů${nazev ? ' · ' + esc(nazev) : ''}</span>`;
const hledatHTML = (klic, placeholder = 'Hledat…') => `<input class="hledat" id="hl_${klic}" value="${esc(S.hledat[klic] || '')}" placeholder="${esc(placeholder)}" autocomplete="off"><span class="hledat-pocet" id="hlp_${klic}"></span>`;
function bindHledani(klic, radky) {
  const el = $('hl_' + klic); if (!el) return;
  const filtruj = () => {
    const slova = bezDia(el.value).split(/\s+/).filter(Boolean); S.hledat[klic] = el.value;
    let vidim = 0, celkem = 0;
    document.querySelectorAll(radky).forEach((r) => { if (r.dataset.hlSkip) return; celkem++; const t = bezDia(r.textContent); const ok = slova.every((w) => t.includes(w)); r.hidden = !ok; if (ok) vidim++; });
    const p = $('hlp_' + klic); if (p) p.textContent = slova.length ? `${vidim} z ${celkem}` : '';
  };
  el.oninput = filtruj; filtruj();
}
const C = (p, o = {}) => api('/api/c' + p, { ...o, token: S.session }).catch((e) => { if (e.status === 401) { odhlas(); } throw e; });
const jeLekar = () => S.ja && S.ja.role.includes('lekar');
const jeAdmin = () => S.ja && S.ja.role.includes('admin');
const ROLE_NAZ = { admin: 'správce', lekar: 'lékař', sestra: 'sestra', ctenar: 'jen čtení' };
const TYM_NAZ = { GARANT: 'garant', PECE: 'péče', LEKAR: 'lékař', HOST: 'host (čtení)' };

/* nápověda: kapitola a název obrazovky podle toho, co má uživatel otevřené */
const TAB_KAP = { karta: 5, plan: 5, denik: 6, kontakty: 6, tym: 7, telefon: 8, udaje: 9, dok: 9, pristupy: 9 };
const TAB_NAZ = { karta: 'Krizová karta', plan: 'Plán péče', denik: 'Deník', kontakty: 'Důležité kontakty', tym: 'Tým a garance', telefon: 'Telefon a PINy', udaje: 'Detail pacienta', dok: 'Dokumenty', pristupy: 'Přístupy' };
KP.napoveda.nastav({ aplikace: 'centrala', fab: true, auth: () => ({ token: S.session }),
  kapitola: () => (!S.session ? 2 : ({ pacienti: 3, novy: 4, detail: TAB_KAP[S.tab] || 5, lide: 11, sprava: 12, ucet: 2 }[S.view] || 3)),
  obrazovka: () => (!S.session ? 'Přihlášení' : S.view === 'detail' ? 'Detail pacienta, záložka ' + (TAB_NAZ[S.tab] || '') : ({ pacienti: 'Pacienti', novy: 'Nový pacient', lide: 'Lidé a týmy', sprava: 'Správa organizace' + (S.sTab ? ' – ' + S.sTab : ''), ucet: 'Můj účet' }[S.view] || S.view)) });

function odhlas() { S.session = ''; S.ja = null; sessionStorage.removeItem('kp_session'); render(); }

/* ================= hlavička ================= */
function hlavicka() {
  if (!S.ja) { $('top').innerHTML = `<img src="/icons/icon.svg" alt="" width="40" height="40" style="border-radius:12px"><div class="ttl"><h1>Karta pacienta</h1><div class="meta">Centrální aplikace</div></div>${KP.tlacitkaHlavicky()}`; return; }
  $('top').innerHTML = `<img src="/icons/icon.svg" alt="" width="40" height="40" style="border-radius:12px"><div class="ttl"><h1>${esc(S.nazevSite || 'Karta pacienta')}</h1><div class="meta">Centrální aplikace · garant a tým kolem pacienta</div></div>
    <div class="who noprint">${esc(S.ja.jmeno)}<br>${esc(S.ja.poskytovatel)} · ${S.ja.role.map((r) => ROLE_NAZ[r]).join(', ')}</div>
    ${KP.tlacitkaHlavicky()}<span class="verbadge">v${esc(S.verze || '')}</span><button class="btn sm noprint" id="odhl">Odhlásit</button>`;
  $('odhl').onclick = odhlas;
}
function nav() {
  const pol = [['pacienti', 'Pacienti'], ...(jeLekar() ? [['novy', '+ Nový pacient']] : []), ...(S.ja.role.some((r) => r !== 'ctenar') ? [['lide', 'Lidé a týmy']] : []), ...(jeAdmin() ? [['sprava', 'Správa organizace']] : []), ['ucet', 'Můj účet']];
  return `<div class="nav noprint">${pol.map(([k, n]) => `<button data-v="${k}" class="${S.view === k || (k === 'pacienti' && S.view === 'detail') ? 'on' : ''}">${n}</button>`).join('')}</div>`;
}
function bindNav() { document.querySelectorAll('.nav button').forEach((b) => (b.onclick = () => { S.view = b.dataset.v; if (b.dataset.v === 'novy') S.wiz = null; render(); window.scrollTo(0, 0); })); }

/* ================= přihlášení ================= */
async function render() {
  if (!S.session) return renderLogin();
  if (!S.ja) {
    try { const d = await C('/ja'); S.ja = d.ja; S.nazevSite = d.nazevSite; S.smsPacientVychozi = d.smsPacientVychozi || ''; S.verze = d.verze; S.ai = d.ai; S.interval = d.nastaveni.intervalRevize; S.verejna = d.verejnaAdresa; S.pecedoma = d.pecedoma || {}; } catch (e) { return; }
    try { S.posk = (await C('/poskytovatele')).poskytovatele; } catch { S.posk = []; }
  }
  hlavicka();
  if (S.ja.musiZmenitHeslo) return renderUcet(true);
  ({ pacienti: renderPacienti, detail: renderDetail, novy: renderNovy, lide: renderLide, sprava: renderSprava, ucet: () => renderUcet(false) }[S.view] || renderPacienti)();
}

function renderLogin() {
  hlavicka();
  $('work').innerHTML = `<div class="login"><div class="panel">
    <h2>Přihlášení</h2>
    ${S.tenant ? `<div class="note">Organizace: <span class="mono">${esc(S.tenant)}</span> · <a href="#" id="jinaOrg">jiná organizace</a></div>` : `<div class="field"><label>Kód organizace</label><input id="l_t" placeholder="16 znaků z odkazu, který jste dostali" autocapitalize="characters"></div>`}
    <div class="field"><label>Přihlašovací jméno</label><input id="l_l" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label>Heslo</label><input id="l_h" type="password" autocomplete="current-password"></div>
    <button class="btn primary ulozit" id="l_ok">Přihlásit</button>
    <div class="footer">Karta pacienta · data v PeceDomaPlus, přístup podle týmu kolem pacienta</div></div></div>`;
  if ($('jinaOrg')) $('jinaOrg').onclick = (e) => { e.preventDefault(); S.tenant = ''; localStorage.removeItem('kp_tenant'); renderLogin(); };
  const go = async () => {
    const tenant = S.tenant || ($('l_t') && $('l_t').value.trim().toUpperCase());
    try { const d = await api('/api/c/login', { method: 'POST', body: { tenant, login: $('l_l').value, heslo: $('l_h').value } });
      S.tenant = tenant; localStorage.setItem('kp_tenant', tenant); S.session = d.session; sessionStorage.setItem('kp_session', d.session); S.view = 'pacienti'; render();
    } catch (e) { toast(e.message); }
  };
  $('l_ok').onclick = go; $('l_h').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  ($('l_t') || $('l_l')).focus();
}

function renderUcet(povinne) {
  $('work').innerHTML = `${povinne ? '' : nav()}<div class="login" style="margin-top:2vh"><div class="panel">
    <h2>${povinne ? 'Nastavte si vlastní heslo' : 'Můj účet'}</h2>
    ${povinne ? '<div class="banner warn">Přihlásili jste se prvním heslem od správce. Než budete pokračovat, zvolte si vlastní heslo (aspoň 10 znaků).</div>' : `<dl class="kv"><dt>Jméno</dt><dd>${esc(S.ja.jmeno)}</dd><dt>Login</dt><dd>${esc(S.ja.login)}</dd><dt>Pracoviště</dt><dd>${esc(S.ja.poskytovatel)}</dd><dt>Role</dt><dd>${S.ja.role.map((r) => ROLE_NAZ[r]).join(', ')}</dd></dl>`}
    <div class="field"><label>Současné heslo</label><input type="password" id="h_s" autocomplete="current-password"></div>
    <div class="field"><label>Nové heslo</label><input type="password" id="h_n" autocomplete="new-password"></div>
    <div class="field"><label>Nové heslo znovu</label><input type="password" id="h_n2" autocomplete="new-password"></div>
    <button class="btn primary ulozit" id="h_ok">Změnit heslo</button></div></div>`;
  if (!povinne) bindNav();
  $('h_ok').onclick = async () => {
    if ($('h_n').value !== $('h_n2').value) return toast('Nová hesla se neshodují');
    try { await C('/heslo', { method: 'POST', body: { stare: $('h_s').value, nove: $('h_n').value } }); toast('Heslo změněno'); S.ja.musiZmenitHeslo = false; S.view = 'pacienti'; render(); } catch (e) { toast(e.message); }
  };
}

/* ================= přehled pacientů ================= */
async function renderPacienti() {
  $('work').innerHTML = `${nav()}<div class="note">Načítám…</div>`; bindNav();
  let d; try { d = await C('/prehled?stav=' + S.stav); } catch (e) { $('work').innerHTML = `${nav()}<div class="banner crit">${esc(e.message)}</div>`; bindNav(); return; }
  const synch = (p) => !p.telefonu ? '<span class="chip">bez telefonu</span>' : `<span class="dot ${p.sync && (Date.now() - new Date(p.sync.replace(' ', 'T'))) < 12 * 3600e3 ? 'ok' : 'warn'}"></span> <span class="mono" style="font-size:12px">${esc(p.sync ? fmtDT(p.sync) : '—')}</span>${p.baterie != null ? ` <span class="muted" style="font-size:12px">${p.baterie} %</span>` : ''}`;
  $('work').innerHTML = `${nav()}
    ${d.upozorneni.length && S.stav === 'AKTIVNI' ? (() => {
      // panel Upozornění se rozbaluje (0.11.15): nad 3 upozornění je zavřený, stav si pamatuje prohlížeč; zavřený ukáže souhrn podle druhu
      const druhy = new Map(); d.upozorneni.forEach((u) => { const k = String(u.text).split(': ').slice(1).join(': ').replace(/\s+(od|do|\d).*$/, '').trim() || 'ostatní'; druhy.set(k, (druhy.get(k) || 0) + 1); });
      let otevr = localStorage.getItem('kp_upoz'); if (otevr === null) otevr = d.upozorneni.length <= 3 ? '1' : '0';
      return `<details class="panel upoz" id="upoz" ${otevr === '1' ? 'open' : ''}><summary class="panel-h"><span class="sip">▶</span><h2>Upozornění</h2><span class="souhrn">${[...druhy].map(([k, n]) => `${n}× ${esc(k)}`).join(' · ')}</span><span class="chip ${d.upozorneni.some((u) => u.uroven === 'crit') ? 'crit' : 'warn'}">${d.upozorneni.length}</span></summary>
        <div class="alerts" style="padding:10px">${d.upozorneni.slice(0, 60).map((u) => `<div class="alert ${u.uroven}" data-p="${u.pacientId}">${esc(u.text)}</div>`).join('')}</div></details>`; })() : ''}
    <div class="panel"><div class="panel-h"><h2>${S.stav === 'AKTIVNI' ? 'Pacienti s průkazem' : 'Uzavřené průkazy'} (${d.pacienti.length})</h2>${S.stav === 'AKTIVNI' ? '<button class="btn sm" id="p_stitky" title="Samolepky 70 × 37 mm na zadní stranu telefonů – komu telefon patří a kam volat">🏷 Štítky na telefony</button>' : ''}${hledatHTML('pac', 'Hledat pacienta, adresu, garanta…')}
      <div class="seg" style="width:240px"><button data-s="AKTIVNI" class="${S.stav === 'AKTIVNI' ? 'on' : ''}">Aktivní</button><button data-s="UZAVRENY" class="${S.stav === 'UZAVRENY' ? 'on' : ''}">Uzavřené</button></div></div>
      <div class="tblwrap"><table class="tbl hover"><thead><tr><th>Průkaz</th><th>Pacient</th><th>Adresa</th><th>Garant</th><th>Plán</th><th>Telefon</th><th>Poslední zápis</th></tr></thead><tbody>
      ${d.pacienti.map((p) => `<tr data-id="${p.id}" class="${vDomove(p) !== null ? 'vdomove' : ''}"><td class="mono">${esc(p.kod)}</td><td><b>${esc(p.prijmeni)} ${esc(p.jmeno)}</b><div class="lbl">${esc(p.rok || '')}${p.posledniKrize === 'Zhoršení stavu' ? ' · <span class="chip crit">zhoršení</span>' : ''}${p.predavaSe ? ' · <span class="chip vio">předává se</span>' : ''}</div></td>
        <td>${vDomove(p) !== null ? domovChip(vDomove(p)) + '<br>' : ''}${esc(p.adresa || p.pobyt || '—')}${p.adresa && p.pobyt && p.pobyt !== p.adresa ? `<div class="lbl">${esc(p.pobyt)}</div>` : ''}</td><td>${esc(p.garant || '—')}</td>
        <td>${p.platnostDo ? (KP.prosly(p.platnostDo) ? '<span class="chip crit">po platnosti</span>' : 'do ' + fmtD(p.platnostDo)) : '<span class="chip warn">chybí</span>'}<div class="lbl">${esc(CILE[p.cil] ? CILE[p.cil].split(' (')[0] : '')}${p.verze ? ' · v' + p.verze : ''}</div></td>
        <td>${S.stav === 'AKTIVNI' ? synch(p) : esc(fmtDT(p.uzavreno))}</td><td class="mono" style="font-size:12px">${esc(fmtDT(p.posledniZapis))}</td></tr>`).join('') || `<tr><td colspan="7" class="muted">${S.stav === 'AKTIVNI' ? 'Zatím žádný pacient.' + (jeLekar() ? ' Začněte tlačítkem „+ Nový pacient“.' : '') : 'Žádné uzavřené průkazy.'}</td></tr>`}
      </tbody></table></div></div>`;
  bindNav();
  document.querySelectorAll('tr[data-id],.alert[data-p]').forEach((r) => (r.onclick = () => otevri(Number(r.dataset.id || r.dataset.p))));
  document.querySelectorAll('.seg [data-s]').forEach((b) => (b.onclick = () => { S.stav = b.dataset.s; renderPacienti(); }));
  bindHledani('pac', 'tr[data-id]');
  if ($('p_stitky')) $('p_stitky').onclick = () => stitkyOkno(d.pacienti.filter((p) => p.telefonu).map((p) => p.id));
  if ($('upoz')) $('upoz').ontoggle = () => localStorage.setItem('kp_upoz', $('upoz').open ? '1' : '0');
}
function otevri(id, tab) { S.view = 'detail'; S.pacId = id; S.tab = tab || 'karta'; render(); window.scrollTo(0, 0); }

/* ================= detail pacienta ================= */
async function nactiDetail() { const d = await C('/pacient/' + S.pacId); d.denikAsc = [...d.denik].reverse(); S.pac = d; return d; }
async function renderDetail() {
  $('work').innerHTML = `${nav()}<div class="note">Načítám průkaz…</div>`; bindNav();
  let d; try { d = await nactiDetail(); } catch (e) { $('work').innerHTML = `${nav()}<div class="banner crit">${esc(e.message)}</div>`; bindNav(); return; }
  kresliDetail();
}
function balikZDetailu(d) {
  const g = d.garance.find((x) => x.stav === 'PLATNA');
  const gp = g && S.posk.find((p) => p.id === g.poskytovatelId);
  return { pacient: { kod: d.pacient.kod, jmeno: d.pacient.jmeno, prijmeni: d.pacient.prijmeni, rok: d.pacient.rok }, plan: d.plan, garant: g ? { poskytovatel: g.nazev, lekar: g.lekar, telefon24: gp && gp.telefon24 } : null,
    kontakty: d.kontakty.map((k) => ({ ...k, skupina: k.skupina.toLowerCase() })), denik: d.denikAsc, pecedoma: d.pecedoma && d.pecedoma.klientId ? { ...(d.pecedoma.sync || {}), propojeno: true } : null };
}
function kresliDetail() {
  const d = S.pac, p = d.pacient, op = d.op;
  const g = d.garance.find((x) => x.stav === 'PLATNA');
  const navrh = d.garance.find((x) => x.stav === 'NAVRZENO');
  const tabs = [['karta', 'Krizová karta'], ['dg', 'Diagnóza'], ['plan', 'Plán péče'], ['leky', 'Léky'], ['denik', `Deník (${d.denik.filter((e) => !KP.SYSTEM_TYPY.includes(e.typ)).length})`], ['kontakty', 'Důležité kontakty'], ['tym', 'Tým a garance'], ['telefon', 'Telefon a PINy'], ['udaje', 'Detail pacienta'], ['dok', 'Dokumenty'], ...(d.pristupy.length ? [['pristupy', 'Přístupy']] : [])];
  const body = { dg: tabDg, leky: tabLeky, karta: tabKarta, plan: tabPlan, denik: tabDenik, kontakty: tabKontakty, tym: tabTym, telefon: tabTelefon, udaje: tabUdaje, dok: tabDok, pristupy: tabPristupy }[S.tab] || tabKarta;
  $('work').innerHTML = `${nav()}
    <div class="row noprint"><button class="btn sm" id="zpet">${KP.ICON.back} Pacienti</button>
      <div><h2 style="font-size:20px">${esc(p.prijmeni)} ${esc(p.jmeno)}${p.rok ? ', ' + esc(p.rok) : ''}</h2><div class="muted" style="font-size:13px"><span class="mono">${esc(p.kod)}</span> · ${esc(p.pobyt || 'pobyt neuveden')} ${domovChip(vDomove(p, d.tym))}· garant: <b>${esc(g ? g.nazev : '—')}</b>${p.stav === 'UZAVRENY' ? ' · <span class="chip">uzavřeno ' + esc(fmtDT(p.uzavreno)) + '</span>' : ''}</div></div></div>
    ${navrh && op.prijmoutGaranci ? `<div class="banner crit">Bylo vám navrženo převzetí garance (navrhl ${esc(navrh.navrhl || '—')}, ${esc(fmtDT(navrh.navrzeno))}).<button class="btn sm primary" id="prevzit">Převzít garanci</button><button class="btn sm" id="odmitnout">Odmítnout</button></div>` : navrh ? `<div class="banner warn">Předání garance na ${esc(navrh.nazev)} čeká na potvrzení (od ${esc(fmtDT(navrh.navrzeno))}). Do potvrzení zůstává garantem ${esc(g ? g.nazev : '—')}.</div>` : ''}
    ${d.plan && KP.prosly(d.plan.platnostDo) ? `<div class="banner ${op.lekar ? 'crit' : 'warn'}">Plán je po datu platnosti (${fmtD(d.plan.platnostDo)}) a čeká na revizi lékařem.${op.lekar ? '<button class="btn sm primary" id="revize2">Provést revizi</button>' : ''}</div>` : ''}
    <div class="tabs noprint">${tabs.map(([k, n]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div id="tabbody">${body(d)}</div>`;
  KP.sbalVysvetlivky($('tabbody'));
  bindNav();
  $('zpet').onclick = () => { S.view = 'pacienti'; render(); };
  document.querySelectorAll('.tabs [data-t]').forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; kresliDetail(); }));
  if ($('prevzit')) $('prevzit').onclick = () => akce('/prevzit', { prijmout: true }, 'Garance převzata');

function bindTab() {
  const d = S.pac;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('pd_chat', () => chatPd(d));
  if ($('pd_chat')) nactiNahledChatu(d);
  on('pd_sync', async () => { try { toast('Synchronizuji s PéčeDoma…'); await akce('/pecedoma/sync', {}, 'Synchronizováno s PéčeDoma'); } catch (e) { /* hláška v akce() */ } });
  on('pd_odpojit', async () => { if (await KP.confirm('Odpojit od PéčeDoma', 'Léky a návštěvy z PéčeDoma se přestanou přebírat. Plán péče zůstává.', 'Odpojit', true)) akce('/pecedoma', { odpojit: true }, 'Odpojeno'); });
  on('pd_propojit', () => vyberKlientaPd(async (k) => { try { const r = await akce('/pecedoma', { klientId: k.id }, 'Propojeno s PéčeDoma'); if (r && r.chyba) toast('Propojeno, ale synchronizace selhala: ' + r.chyba, 8000); } catch (e) { /* hláška v akce() */ } }));
  on('dg_ok', async () => { const base = (d.plan && d.plan.data) || {}; await akce('/plan', { data: { ...base, dg: $('dg_dg').value, funkce: $('dg_fun').value, alergie: $('dg_al').value }, platnostDo: d.plan ? d.plan.platnostDo : null, typ: 'ZMENA', poznamka: 'úprava diagnózy / funkčního stavu' }, 'Uloženo jako nová verze plánu'); });
  on('lk_ok', async () => { const base = (d.plan && d.plan.data) || {}; const r = (id) => $(id).value.split('\n').map((x) => x.trim()).filter(Boolean); await akce('/plan', { data: { ...base, sos: r('lk_sos'), opioidy: r('lk_opi'), medikace: r('lk_med') }, platnostDo: d.plan ? d.plan.platnostDo : null, typ: 'ZMENA', poznamka: 'úprava léků' }, 'Léky uloženy jako nová verze plánu'); });
  on('lk_novy', () => lekOkno(d));
  if ($('lk_seznam')) nactiLeky(d);
  on('revize', revize);
  on('tisk', () => window.print());
  on('naTelefon', () => { S.tab = 'telefon'; kresliDetail(); });
  on('vypis', vypis);
  on('ulozPlan', async () => { const p = ctiPlan('f', (d.plan && d.plan.data) || {}); await akce('/plan', { ...p, typ: 'ZMENA', poznamka: $('f_poz').value }, 'Plán uložen jako nová verze'); });
  document.querySelectorAll('tr[data-v]').forEach((r) => (r.onclick = async () => {
    try { const v = await C(`/pacient/${S.pacId}/plan/${r.dataset.v}`); modal(`<h2>Plán – verze ${v.verze}</h2><div class="muted">${esc(v.podepsal)} · ${esc(fmtDT(v.vytvoreno))} · platnost do ${fmtD(v.platnostDo)}</div>${planForm(v.data, v.platnostDo, true, 'h')}<div class="quick"><button class="btn" data-close>Zavřít</button></div>`); } catch (e) { toast(e.message); }
  }));
  on('d_ok', () => akce('/denik', { typ: $('d_typ').value, text: $('d_txt').value }, 'Zapsáno'));
  on('k_ok', async () => {
    const e = S.kontEdit ? d.kontakty.find((x) => x.id === S.kontEdit) : null;
    const body = { jmeno: $('k_j').value, tel: $('k_t').value, skupina: $('k_s').value, pozn: $('k_p').value };
    if (e) body.id = e.id; else body.poradi = Math.max(0, ...d.kontakty.map((x) => Number(x.poradi) || 0)) + 10;   // nový na konec
    try { await akce('/kontakt', body, e ? 'Kontakt uložen' : 'Kontakt přidán'); S.kontEdit = null; kresliDetail(); } catch (err) { /* hláška v akce() */ }
  });
  on('k_zrusit', () => { S.kontEdit = null; kresliDetail(); });
  document.querySelectorAll('[data-ked]').forEach((b) => (b.onclick = () => { S.kontEdit = Number(b.dataset.ked); kresliDetail(); if ($('k_j')) $('k_j').focus(); }));
  document.querySelectorAll('[data-kdel]').forEach((b) => (b.onclick = async () => { const k = d.kontakty.find((x) => x.id === Number(b.dataset.kdel)); if (await KP.confirm('Odebrat kontakt', `${esc(k.jmeno)} · ${esc(k.tel)}`, 'Odebrat', true)) { if (S.kontEdit === k.id) S.kontEdit = null; akce('/kontakt', { id: k.id, smazat: true, jmeno: k.jmeno, skupina: k.skupina }, 'Odebráno'); } }));
  document.querySelectorAll('[data-kmv]').forEach((b) => (b.onclick = async () => {
    const [id, smer] = b.dataset.kmv.split('|'); const kont = [...d.kontakty]; const i = kont.findIndex((x) => x.id === Number(id)); const j = i + Number(smer);
    if (i < 0 || j < 0 || j >= kont.length) return;
    [kont[i], kont[j]] = [kont[j], kont[i]];
    try {
      for (let n = 0; n < kont.length; n++) { const p = (n + 1) * 10; if (Number(kont[n].poradi) !== p) await C(`/pacient/${S.pacId}/kontakt`, { method: 'POST', body: { id: kont[n].id, jenPoradi: true, poradi: p } }); }
      await nactiDetail(); kresliDetail();
    } catch (err) { toast(err.message); }
  }));
  document.querySelectorAll('[data-novaposk]').forEach((b) => (b.onclick = () => { S.view = 'sprava'; S.sTab = 'posk'; render(); window.scrollTo(0, 0); }));
  on('t_ok', () => akce('/tym', { poskytovatelId: Number($('t_p').value), role: $('t_r').value }, 'Přidáno do týmu'));
  document.querySelectorAll('[data-todeb]').forEach((b) => (b.onclick = async () => { if (await KP.confirm('Odebrat z týmu', 'Pracoviště ztratí přístup k průkazu a PINy jeho personálu přestanou platit.', 'Odebrat', true)) akce('/tym', { odebratId: Number(b.dataset.todeb) }, 'Odebráno'); }));
  on('g_ok', async () => { const n = $('g_p').selectedOptions[0]; if (!n) return toast('Vyberte pracoviště'); if (await KP.confirm('Předat garanci', `Navrhnout předání garance pracovišti <b>${esc(n.textContent)}</b>? Garance přejde až po potvrzení přebírajícím lékařem.`, 'Navrhnout')) akce('/predat', { poskytovatelId: Number(n.value), poznamka: $('g_poz').value }, 'Předání navrženo'); });
  on('stitek', () => stitkyOkno([S.pacId]));
  on('parovat', () => parovat(false));
  on('pacientovi', () => pacientoviOkno());
  document.querySelectorAll('[data-pukoncit]').forEach((b) => (b.onclick = async () => { if (await KP.confirm('Ukončit přístup pacienta', 'Data od lékaře se v telefonu pacienta přestanou aktualizovat. Co už pacient má, je jeho kopie – smazat ji nelze. Vlastní záznamy pacienta zůstanou v jeho telefonu.', 'Ukončit přístup', true)) akce('/zarizeni', { zarizeniId: Number(b.dataset.pukoncit), akce: 'zablokovat' }, 'Přístup ukončen'); }));
  on('parovatSms', () => parovat(true));
  on('kodLekare', async () => {
    try { const r = await C(`/pacient/${S.pacId}/kod-lekare`); modal(`<h2>Kód lékaře pro dnešní den</h2><div class="secret">${esc(r.kod.slice(0, 3))} ${esc(r.kod.slice(3))}</div><p class="muted">Platí celý dnešní den do půlnoci (${esc(new Date(r.platiDo).toLocaleDateString('cs-CZ'))}), pak se změní. Pro lékaře, který k pacientovi není přiřazený: na telefonu zvolí <b>Lékař bez PINu</b>, zadá kód a své jméno – funguje i bez signálu. Stejný kód najde lékař i v PéčeDoma v Datech klienta. Zobrazení kódu je zapsáno v deníku přístupů.</p><div class="quick"><button class="btn" data-close>Zavřít</button></div>`); } catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-zblok]').forEach((b) => (b.onclick = async () => { if (await KP.confirm('Zablokovat telefon', 'Telefon se při příštím připojení vymaže a přestane fungovat. Použijte při ztrátě nebo výměně.', 'Zablokovat', true)) akce('/zarizeni', { zarizeniId: Number(b.dataset.zblok), akce: 'zablokovat' }, 'Telefon zablokován'); }));
  document.querySelectorAll('[data-zvrat]').forEach((b) => (b.onclick = () => akce('/zarizeni', { zarizeniId: Number(b.dataset.zvrat), akce: 'vratit' }, 'Označeno jako vrácené')));
  on('pin_ok', async () => {
    try { const r = await C(`/pacient/${S.pacId}/pin`, { method: 'POST', body: { jmeno: $('pin_j').value, role: $('pin_r').value, poskytovatelId: Number($('pin_p').value) || null } });
      await nactiDetail(); kresliDetail();
      modal(`<h2>PIN vydán</h2><div class="secret">${esc(r.pin)}</div><p class="muted">PIN se zobrazuje jen teď. Předejte ho držiteli. Do telefonu se dostane při nejbližší synchronizaci.</p><div class="quick"><button class="btn" data-close>Hotovo</button></div>`);
    } catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-pzrus]').forEach((b) => (b.onclick = () => akce('/pin', { zrusitId: Number(b.dataset.pzrus) }, 'PIN zrušen')));
  on('tl_ok', async () => { const sel = $('tl_sel'); if (!sel || !sel.value) return toast('Vyberte tým'); try { const r = await akce('/tym-lidi', { pridatTymId: Number(sel.value) }, 'Tým přiřazen'); if (r && r.pracovistePridano) toast('Pracoviště členů týmu byla přidána do týmu kolem pacienta s rolí péče', 7000); } catch (e) { /* hláška v akce() */ } });
  document.querySelectorAll('[data-tlodeb]').forEach((b) => (b.onclick = async () => { if (await KP.confirm('Odebrat tým', 'Členové týmu už kartu tohoto pacienta neodemknou (při nejbližší synchronizaci telefonu).', 'Odebrat', true)) akce('/tym-lidi', { odebratTymId: Number(b.dataset.tlodeb) }, 'Tým odebrán'); }));
  document.querySelectorAll('[data-tlcl]').forEach((b) => (b.onclick = () => { const [tymId, osobaId, akt] = b.dataset.tlcl.split('|').map(Number); akce('/tym-lidi', { tymId, osobaId, aktivni: !!akt }, akt ? 'Člen aktivován' : 'Člen deaktivován u pacienta'); }));
  document.querySelectorAll('[data-lodeb]').forEach((b) => (b.onclick = async () => { if (await KP.confirm('Odebrat přístup', 'Tento člověk už kartu tohoto pacienta neodemkne (při nejbližší synchronizaci telefonu).', 'Odebrat', true)) akce('/lide', { odebrat: [Number(b.dataset.lodeb)] }, 'Odebráno'); }));
  on('u_ok', () => akce('/udaje', ctiUdaje('u'), 'Údaje uloženy'));
  on('souhlas', () => akce('/souhlas', {}, 'Potvrzeno'));
  on('uzavrit', () => modal(`<h2>Uzavřít průkaz</h2><p>Průkaz se uzavře, telefon se při příštím připojení vymaže, PINy přestanou platit. Před uzavřením si pořiďte výpis do dokumentace.</p>
    <div class="field"><label>Důvod</label><select id="uz_d"><option>úmrtí</option><option>předání mimo síť</option><option>hospitalizace, průkaz ukončen</option><option>na přání pacienta / zástupce</option><option>jiný</option></select></div>
    <div class="quick"><button class="btn" id="uz_v">Pořídit výpis</button><button class="btn crit" id="uz_ok">Uzavřít</button><button class="btn" data-close>Zpět</button></div>`, () => {
    $('uz_v').onclick = vypis; $('uz_ok').onclick = () => { const du = $('uz_d').value; closeModal(); akce('/uzavrit', { duvod: du }, 'Průkaz uzavřen'); };
  }));
  document.querySelectorAll('[data-dok]').forEach((b) => (b.onclick = async () => {
    const r = await fetch(`/api/c/pacient/${S.pacId}/dokument/${b.dataset.dok}`, { headers: { authorization: 'Bearer ' + S.session } });
    if (!r.ok) return toast('Dokument se nepodařilo otevřít');
    window.open(URL.createObjectURL(await r.blob()), '_blank');
  }));
  on('dk_ok', async () => {
    const f = $('dk_f').files[0];
    let data = null; if (f) { if (f.size > 8 * 1024 * 1024) return toast('Soubor je větší než 8 MB'); data = await new Promise((res) => { const rd = new FileReader(); rd.onload = () => res(String(rd.result).split(',')[1]); rd.readAsDataURL(f); }); }
    akce('/dokument', { typ: $('dk_t').value, nazev: $('dk_n').value || (f && f.name) || 'dokument', kdeOriginal: $('dk_k').value, datum: $('dk_d').value, pracoviste: $('dk_pr').value, mime: f && f.type, data }, 'Dokument vložen');
  });
}

/* vlastní telefon pacienta – kód jen pro jeho číslo; SMS s odkazem, nebo QR kód v ordinaci */
function pacientoviOkno(tel = '') {
  modal(`<h2>Zpřístupnit průkaz v telefonu pacienta</h2>
    <p class="muted" style="margin:0">Pacient si otevře aplikaci <b>Můj průkaz</b> (${esc(S.verejna)}/pacient/) ve svém telefonu. Uvidí plán, kontakty a tým a bude si vést vlastní přání a léky. Kód půjde použít jen s tímto číslem a platí 3 dny.</p>
    <div class="field"><label>Mobil pacienta</label><input id="pz_t" type="tel" value="${esc(tel)}" placeholder="+420 777 123 456"></div>
    <div class="field"><label>Text SMS pro pacienta</label><textarea id="pz_txt" style="min-height:96px">${esc(localStorage.getItem('kp_sms_pacient') || S.smsPacientVychozi || 'Můj průkaz: lékař vám zpřístupnil váš paliativní průkaz. Otevřete odkaz v tomto telefonu: {odkaz} (platí 3 dny)')}</textarea><span class="hint"><b>{odkaz}</b> se nahradí odkazem pro telefon pacienta (když ho smažete, přidá se na konec). <span id="pz_len"></span> <button type="button" class="btn sm" id="pz_vychozi" style="height:26px;min-height:26px;font-size:12px;margin-left:6px">Původní text</button></span></div>
    <div class="quick"><button class="btn primary" id="pz_sms"${S.pac.smsDostupne ? '' : ' disabled'}>Poslat SMS</button><button class="btn" id="pz_qr">Zobrazit QR kód (v ordinaci)</button><button class="btn" data-close>Zpět</button></div>
    ${S.pac.smsDostupne ? '' : '<div class="note">SMS teď nejde odeslat – použijte QR kód.</div>'}`, () => {
    $('pz_t').focus();
    const delka = () => { const t = $('pz_txt').value.replace('{odkaz}', 'x'.repeat(70)); const n = t.length, dia = /[^\x00-\x7F]/.test(t); const na = dia ? 70 : 160, na2 = dia ? 67 : 153; $('pz_len').textContent = `${n} znaků s odkazem ≈ ${n <= na ? 1 : Math.ceil(n / na2)} SMS`; };
    $('pz_txt').oninput = delka; delka();
    $('pz_vychozi').onclick = () => { $('pz_txt').value = S.smsPacientVychozi; localStorage.removeItem('kp_sms_pacient'); delka(); };
    const go = async (sms) => {
      const telefon = $('pz_t').value, textSms = $('pz_txt').value.trim();
      if (sms) { if (textSms && textSms !== S.smsPacientVychozi) localStorage.setItem('kp_sms_pacient', textSms); else localStorage.removeItem('kp_sms_pacient'); }
      try {
        const r = await C(`/pacient/${S.pacId}/pacientovi`, { method: 'POST', body: { telefon, sms, text: sms ? textSms : undefined } });
        const smsOk = r.sms && r.sms.ok;
        const qr = qrcode(0, 'M'); qr.addData(r.odkaz); qr.make();
        modal(`<h2>Průkaz pro telefon pacienta</h2>
          <div class="banner ${smsOk ? 'ok' : 'warn'}" style="margin-bottom:10px">${smsOk ? `Odkaz byl odeslán SMS na <b>${esc(r.telefon)}</b>. Pacient ho otevře ve svém telefonu, potvrdí číslo a nastaví si vlastní PIN.${r.sms.text ? `<div class="lbl" style="margin-top:6px;white-space:pre-wrap">Odesláno: ${esc(r.sms.text)}</div>` : ''}` : `Kód půjde použít jen s číslem <b>${esc(r.telefon)}</b>.`}</div>
          ${r.sms && !r.sms.ok ? `<div class="banner crit" style="margin-bottom:10px">${esc(r.sms.chyba)}</div>` : ''}
          <div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div>
          <p>Pacient QR kód načte fotoaparátem telefonu, nebo otevře <b>${esc(S.verejna)}/pacient/</b> a zadá:</p>
          <div class="frow"><div class="field"><label>Kód organizace</label><div class="secret" style="font-size:15px">${esc(r.tenant)}</div></div><div class="field"><label>Kód od lékaře</label><div class="secret">${esc(r.kod.slice(0, 4))} ${esc(r.kod.slice(4))}</div></div></div>
          <p class="muted">Platí do ${esc(new Date(r.platnost).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }))} ; ve stejném telefonu ho jde během platnosti použít znovu (třeba po přidání aplikace na plochu). Na novém telefonu vydejte nový kód – předchozí telefon pacienta tím přestane dostávat data.</p>
          <div class="quick"><button class="btn" id="pz_hot">Hotovo</button></div>`, () => { $('pz_hot').onclick = async () => { closeModal(); await nactiDetail(); kresliDetail(); }; });
      } catch (e) { toast(e.message); }
    };
    $('pz_sms').onclick = () => go(true);
    $('pz_qr').onclick = () => go(false);
  });
}
async function parovat(sms) {
  try {
    const r = await C(`/pacient/${S.pacId}/parovat`, { method: 'POST', body: { sms: !!sms } });
    const smsOk = r.sms && r.sms.ok;
    const qr = qrcode(0, 'M'); qr.addData(r.odkaz); qr.make();
    modal(`<h2>Spárovat telefon u pacienta</h2>
      <div class="banner ${smsOk ? 'ok' : 'warn'}" style="margin-bottom:10px">${smsOk ? `Odkaz na spárování byl odeslán SMS na <b>${esc(r.telefonKarty)}</b>. Na tom telefonu ho otevřete a potvrďte číslo.` : `Karta jde nahrát jen do telefonu s číslem <b>${esc(r.telefonKarty)}</b> – telefon při spárování zadá své číslo.`}</div>
      ${r.sms && !r.sms.ok ? `<div class="banner crit" style="margin-bottom:10px">${esc(r.sms.chyba)}</div>` : ''}
      ${(r.dalsiNaTelefonu || []).length ? `<div class="banner ok" style="margin-bottom:10px">Na tomto čísle už je průkaz: <b>${r.dalsiNaTelefonu.map(esc).join(', ')}</b>. Nový průkaz se v telefonu přidá vedle, po spuštění se vybírá pacient (jeden telefon pro více pacientů, např. v domově).</div>` : ''}
      <div class="quick" style="margin-bottom:8px"><button class="btn ${smsOk ? '' : 'primary'}" id="pr_sms"${r.smsDostupne ? '' : ' disabled'}>${smsOk ? 'Poslat SMS znovu' : 'Poslat odkaz SMS na ' + esc(r.telefonKarty)}</button>${r.smsDostupne ? '' : `<span class="muted" style="font-size:13px">SMS teď nejde – ${esc(r.smsDuvod || 'není nastavená')}</span>`}</div>
      <div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div>
      <p>Na telefonu u pacienta otevřete odkaz z SMS nebo naskenujte QR kód fotoaparátem, případně otevřete <b>${esc(S.verejna)}/karta/</b> a zadejte:</p>
      <div class="frow"><div class="field"><label>Kód organizace</label><div class="secret" style="font-size:15px">${esc(r.tenant)}</div></div><div class="field"><label>Párovací kód</label><div class="secret">${esc(r.kod.slice(0, 4))} ${esc(r.kod.slice(4))}</div></div></div>
      <p class="muted">Kód platí 30 minut (do ${esc(new Date(r.platnost).toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }))}); ve stejném telefonu ho jde během platnosti použít znovu (třeba po přidání aplikace na plochu iPhonu). Po spárování se případný předchozí telefon tohoto pacienta zablokuje; průkazy jiných pacientů v témže telefonu zůstávají.</p>
      <div class="quick"><button class="btn" id="pr_hot">Hotovo</button></div>`, () => { $('pr_hot').onclick = async () => { closeModal(); await nactiDetail(); kresliDetail(); }; $('pr_sms').onclick = () => { closeModal(); parovat(true); }; });
  } catch (e) { toast(e.message); }
}

async function vypis() {
  const d = S.pac, p = d.pacient, pl = (d.plan && d.plan.data) || {}, lk = KP.leky(balikZDetailu(d));
  try { await C(`/pacient/${S.pacId}/vypis`, { method: 'POST', body: {} }); } catch (e) { return toast(e.message); }
  const txt = `VÝPIS Z KRIZOVÉHO PLÁNU PÉČE – ${p.prijmeni} ${p.jmeno}, ${p.rok || ''} (${p.kod})
Pořídil: ${S.ja.jmeno}, ${S.ja.poskytovatel}, ${KP.casLokalni()}

Garant: ${(d.garance.find((g) => g.stav === 'PLATNA') || {}).nazev || '—'}
Plán péče: verze ${d.plan ? d.plan.verze : '—'}, stanovil ${d.plan ? d.plan.podepsal : '—'}, platnost do ${d.plan ? fmtD(d.plan.platnostDo) : '—'}
Cíl péče: ${CILE[pl.cil] || '—'}
Limitace: ${(pl.limity || []).join(', ') || 'žádné'}
Doklad: ${dokladText(pl.doklad)}
Diagnózy: ${pl.dg || '—'}
Alergie: ${pl.alergie || '—'}
Funkční stav: ${pl.funkce || '—'}
SOS medikace${lk.zdroj === 'pecedoma' ? ' (PéčeDoma, stav ' + fmtDT(lk.aktualizovano) + ')' : ''}:
${lk.sos.map((s) => ' - ' + s).join('\n') || ' - žádná'}
Opioidy:
${lk.opioidy.map((s) => ' - ' + s).join('\n') || ' - žádné'}
Pravidelná medikace:
${lk.medikace.map((s) => ' - ' + s).join('\n') || ' - neuvedena'}

KONTAKTY:

/* ================= nový pacient (průvodce) ================= */
function dokladText(dk) {
  dk = dk || {};
  if (!dk.dvp) return 'rozhodnutí lékaře – ' + (dk.zprava || '');
  return 'dříve vyslovené přání z ' + fmtD(dk.datum) + (dk.prijeti ? `, sepsané při přijetí u ${dk.prijeti} (platí jen u tohoto poskytovatele)` : dk.pouceni && dk.overenyPodpis ? ', s písemným poučením lékařem a úředně ověřeným podpisem' : ', poučení / ověření podpisu neuvedeno')
    + (dk.original ? ' (originál: ' + dk.original + ')' : '');
}
/* soubor z portálu PéčeDoma (Data klienta → Export pro Kartu pacienta): { format: 'CLB-Kartapacienta/pacient', pacient, plan, kontakty, doplnit, puvod }
   → data průvodce; cíl péče a limitace PéčeDoma nemá – zůstanou výchozí a potvrzuje je lékař */
function zPeceDoma(j) {
  if (!j || j.format !== 'CLB-Kartapacienta/pacient' || !j.pacient) throw new Error('Toto není soubor z PéčeDoma (Data klienta → Export pro Kartu pacienta)');
  const p = j.pacient, pl = j.plan || {}, dk = pl.doklad || {};
  const t = (v, n = 500) => String(v == null ? '' : v).trim().slice(0, n);
  const seznam = (v) => (Array.isArray(v) ? v.map((x) => t(x)).filter(Boolean) : []);
  const limity = seznam(pl.limity).filter((l) => LIMITY.includes(l));
  return {
    d: {
      pacient: { jmeno: t(p.jmeno, 80), prijmeni: t(p.prijmeni, 80), rc: t(p.rc, 11), datumNarozeni: /^\d{4}-\d{2}-\d{2}$/.test(p.datumNarozeni || '') ? p.datumNarozeni : '', rok: p.rok || '',
        pohlavi: p.pohlavi === 'žena' ? 'žena' : 'muž', pojistovna: t(p.pojistovna, 3), adresa: t(p.adresa, 300), pobyt: t(p.pobyt, 200), telefonKarty: t(p.telefonKarty || p.telefon, 20), email: t(p.email, 150) },
      plan: { cil: CILE[pl.cil] ? pl.cil : 'symptom', limity: limity.length ? limity : ['KPR'], doklad: { dvp: !!dk.dvp, datum: t(dk.datum, 10), original: t(dk.original, 200), zprava: t(dk.zprava, 200), pouceni: !!dk.pouceni, overenyPodpis: !!dk.overenyPodpis, prijeti: t(dk.prijeti, 200) },
        dg: t(pl.dg, 2000), funkce: t(pl.funkce, 1000), alergie: t(pl.alergie, 300), sos: seznam(pl.sos), opioidy: seznam(pl.opioidy), medikace: seznam(pl.medikace) },
      kontakty: (Array.isArray(j.kontakty) ? j.kontakty : []).slice(0, 30).map((k) => ({ jmeno: [t(k.jmeno, 100), t(k.pozn, 60)].filter(Boolean).join(' – '), tel: t(k.tel, 40),
        skupina: ['ROZHODUJE', 'INFORMOVAT', 'PECUJE'].includes(k.skupina) ? k.skupina : 'INFORMOVAT', pozn: '' })).filter((k) => k.jmeno),
    },
    info: { zdroj: t(j.zdroj, 40) || 'PéčeDoma', vytvoreno: t(j.vytvoreno, 30), doplnit: seznam(j.doplnit), prevzato: seznam((j.puvod || {}).prevzato), cilVychozi: !CILE[pl.cil] },
  };
}

const pdStitky = (k) => PD_SKUPINY.filter(([kl]) => k[kl]).map(([, , st, b]) => ` <span class="chip ${b}" style="font-size:11px">${st}</span>`).join('');

      : w.import ? `<div class="ai"><h3>Načteno z ${esc(w.import.zdroj)}${w.import.vytvoreno ? ' · ' + esc(fmtDT(w.import.vytvoreno.replace('T', ' ').slice(0, 16))) : ''}</h3>
        <div><b style="font-size:13.5px">Zkontrolovat a doplnit:</b><ul class="missing" style="margin:6px 0 0;padding-left:18px;font-size:13.5px">${['číslo telefonu s kartou (předvyplněný je telefon klienta z PéčeDoma)'].concat(w.import.cilVychozi ? ['cíl péče a limitace – předvyplněné výchozí hodnoty, potvrďte nebo upravte'] : [], w.import.doplnit.filter((x) => !(w.import.cilVychozi && /^(cíl péče|limitace)/i.test(x)))).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>

  $('n_kplus').onclick = () => { ulozVse(); w.d.kontakty.push({ jmeno: '', tel: '', skupina: 'INFORMOVAT' }); renderNovy(); };
  document.querySelectorAll('[data-kx]').forEach((b) => (b.onclick = () => { ulozVse(); w.d.kontakty.splice(Number(b.dataset.kx), 1); renderNovy(); }));
  $('n_zpet').onclick = () => { ulozVse(); w.krok = 1; renderNovy(); };
  $('n_ok').onclick = async () => {
    ulozVse();
    $('n_ok').disabled = true;
    try {
      const r = await C('/pacient', { method: 'POST', body: { pacient: w.d.pacient, plan: w.d.plan, platnostDo: w.d.platnostDo, kontakty: w.d.kontakty, pecedoma: w.pecedoma || null, garantPoskytovatelId: Number($('n_g').value), tym: [...$('n_t').selectedOptions].map((o) => Number(o.value)), aiPouzito: !!w.ai } });
      toast(`Průkaz ${r.kod} založen`); S.wiz = null; otevri(r.id, 'telefon');
    } catch (e) { toast(e.message); $('n_ok').disabled = false; }
  };
}
const kontRow = (k, i) => `<div class="kontrow"><input data-k="j" value="${esc(k.jmeno)}" placeholder="jméno, vztah"><input data-k="t" value="${esc(k.tel)}" placeholder="telefon"><select data-k="s">${['ROZHODUJE', 'INFORMOVAT', 'PECUJE'].map((s) => `<option value="${s}" ${k.skupina === s ? 'selected' : ''}>${s.toLowerCase()}</option>`).join('')}</select><button class="btn sm" data-kx="${i}" aria-label="Odebrat">×</button></div>`;

async function ocr(f) {
  if (!f) return;
  const st = $('w_ocr'); st.textContent = 'Načítám rozpoznávání textu (poprvé ~10 s)…';
  try {
    if (!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const r = await Tesseract.recognize(f, 'ces', { logger: (m) => { if (m.status === 'recognizing text') st.textContent = `Rozpoznávám text v prohlížeči… ${Math.round(m.progress * 100)} %`; } });
    $('w_t').value = r.data.text; st.textContent = 'Text rozpoznán – zkontrolujte ho a spusťte rozbor.';
  } catch (e) { st.textContent = 'Rozpoznání se nezdařilo – vložte text ručně.'; }
}

/* ================= lidé a týmy pracovišť ================= */
// lidé se zapíší jednou (ručně, CSV, PéčeDoma) a k pacientovi se jen přiřazují; osobní PIN platí u všech jejich pacientů
const ROLE_OS = { LEKAR: 'lékař', PL: 'praktický lékař', HOSPIC: 'hospic', SESTRA: 'sestra DPS' };
const bezDia = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const smiLidi = (psId) => jeAdmin() || (psId === S.ja.poskytovatelId && S.ja.role.some((r) => r !== 'ctenar'));
/** role z textu (CSV, PéčeDoma) podle typu pracoviště – stejná pravidla jako server (src/kp.js roleOsoby) */
function roleZTextu(v, typ) {
  const kod = String(v || '').trim(); if (/^[A-Z]+$/.test(kod) && ROLE_OS[kod]) return kod;
  const t = bezDia(v);
  if (/prakt|\bpl\b/.test(t)) return 'PL';
  if (/lekar|doktor|mudr|doctor/.test(t)) return typ === 'PL' ? 'PL' : 'LEKAR';
  if (/dps|domov/.test(t)) return 'SESTRA';
  if (/sestr|pecovat|pecuj|casemanager|nurse|hospic|zdravot/.test(t)) return typ === 'DOMOV' ? 'SESTRA' : 'HOSPIC';
  return '';
}
const tymNazev = (t) => t;   // od 0.10.0 se tým jmenuje tak, jak je založený
const seskup = (pole, klic) => pole.reduce((m, x) => { const k = klic(x); (m.get(k) || m.set(k, []).get(k)).push(x); return m; }, new Map());

async function renderLide() {
  $('work').innerHTML = `${nav()}<div class="note">Načítám…</div>`; bindNav();
  let d; try { d = await C('/lide'); } catch (e) { $('work').innerHTML = `${nav()}<div class="banner crit">${esc(e.message)}</div>`; bindNav(); return; }
  S.lide = d.lide; S.tymy = d.tymy || []; S.clenstvi = d.clenstvi || []; S.smsLide = d.smsDostupne;
  const spravuji = S.posk.filter((p) => p.aktivni && smiLidi(p.id));
  if (S.lideFiltr === undefined) S.lideFiltr = jeAdmin() ? '' : String(S.ja.poskytovatelId);
  const vidim = d.lide.filter((o) => (!S.lideFiltr || String(o.poskytovatelId) === S.lideFiltr) && (S.lideNeaktivni || o.aktivni));
  const skupiny = seskup(vidim, (o) => o.poskytovatel);
  $('work').innerHTML = `${nav()}
    <div class="row"><select id="lf" style="max-width:320px"><option value="">Všechna pracoviště</option>${S.posk.map((p) => `<option value="${p.id}" ${String(p.id) === S.lideFiltr ? 'selected' : ''}>${esc(p.nazev)}</option>`).join('')}</select>
      ${spravuji.length ? `<button class="btn primary" id="l_tym">+ Tým</button><button class="btn primary" id="l_new">+ Člen týmu</button><label class="btn">Načíst CSV<input type="file" id="l_csv" accept=".csv,text/csv,.txt" hidden></label><button class="btn" id="l_pd">Načíst z PéčeDoma</button><button class="btn" id="l_pd_akt" title="Telefony a jména podle uživatelů portálu PéčeDoma; PINy zůstávají">Aktualizovat z PéčeDoma</button><button class="btn ghost" id="l_vzor">Vzor CSV</button>` : ''}
      ${hledatHTML('lide', 'Hledat člověka, tým, telefon…')}
      <label class="row" style="font-size:13px;gap:6px"><input type="checkbox" id="l_neakt" ${S.lideNeaktivni ? 'checked' : ''}> i vyřazení</label></div>
    <div class="note">Každé pracoviště – garant i partneři (domov, praktický lékař…) – si své lidi zapíše <b>jednou</b> a rozdělí do týmů. Každý dostane <b>osobní PIN</b>, kterým odemkne kartu na telefonu u všech pacientů, u kterých je vybraný jeho <b>tým</b> (detail pacienta → Tým a garance → Týmy u pacienta; tam jde člena nejvýš deaktivovat). Role určuje, co na kartě smí. Rodina má PIN u konkrétního pacienta, záchranná služba žádný – jméno zapíše až u výjezdu.</div>
    ${tymyBlok(vidim)}
    ${[...skupiny].map(([nazev, os]) => `<div class="panel"><div class="panel-h"><h2>${esc(nazev)}</h2><span class="chip">${os.filter((o) => o.aktivni).length} lidí</span></div><div class="tblwrap"><table class="tbl hover"><thead><tr><th>Jméno</th><th>Role</th><th>Týmy</th><th>Telefon</th><th>Osobní PIN</th><th>Pacientů</th></tr></thead><tbody>
        ${os.map((o) => `<tr data-oid="${o.id}" style="${smiLidi(o.poskytovatelId) ? 'cursor:pointer' : ''}"><td><b>${esc(o.jmeno)}</b>${o.aktivni ? '' : ' <span class="chip">vyřazen</span>'}${o.zdroj !== 'RUCNE' ? ` <span class="chip">${o.zdroj === 'PECEDOMA' ? 'PéčeDoma' : 'CSV'}</span>` : ''}</td><td>${esc(ROLE_OS[o.role] || o.role)}</td><td>${tymyOsoby(o.id).map((t) => `<span class="chip acc">${esc(t.nazev)}</span>`).join(' ') || '<span class="muted">—</span>'}</td><td class="mono">${esc(o.telefon || '')}</td><td>${o.maPin ? `vydán ${esc(fmtD(o.pinVydan))}` : '<span class="chip warn">chybí</span>'}</td><td>${o.pacientu}</td></tr>`).join('')}
    </tbody></table></div></div>`).join('') || '<div class="note">Zatím tu nikdo není. Přidejte lidi tlačítkem + Člověk, načtěte je ze souboru CSV nebo z PéčeDoma.</div>'}`;
  bindNav();
  $('lf').onchange = () => { S.lideFiltr = $('lf').value; renderLide(); };
  $('l_neakt').onchange = () => { S.lideNeaktivni = $('l_neakt').checked; renderLide(); };
  bindHledani('lide', 'tr[data-oid],tr[data-trow]');
  if ($('l_new')) $('l_new').onclick = () => osobaOkno({ poskytovatelId: Number(S.lideFiltr) || (spravuji.find((p) => p.id === S.ja.poskytovatelId) || spravuji[0]).id });
  if ($('l_tym')) $('l_tym').onclick = () => tymOkno({ poskytovatelId: Number(S.lideFiltr) || (spravuji.find((p) => p.id === S.ja.poskytovatelId) || spravuji[0]).id });
  document.querySelectorAll('[data-tid]').forEach((b) => (b.onclick = () => { const t = S.tymy.find((x) => x.id === Number(b.dataset.tid)); if (t && smiLidi(t.poskytovatelId)) tymOkno(t); }));
  if ($('l_csv')) $('l_csv').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const r = ctiCsv(await textSouboru(f)); if (!r.length) return toast('V souboru nejsou žádní lidé'); importOkno(r, 'CSV'); } catch (err) { toast(err.message); } };
  if ($('l_pd')) $('l_pd').onclick = async () => { try { const r = await C('/lide/pecedoma'); if (!r.lide.length) return toast('V PéčeDoma pro tuto organizaci nikdo není'); importOkno(r.lide, 'PECEDOMA'); } catch (e) { toast(e.message); } };
  if ($('l_pd_akt')) $('l_pd_akt').onclick = () => aktualizovatZPd({ poskytovatelId: Number(S.lideFiltr) || (spravuji.find((p) => p.id === S.ja.poskytovatelId) || spravuji[0]).id });
  if ($('l_vzor')) $('l_vzor').onclick = () => {
    const a = document.createElement('a'); a.download = 'lide-vzor.csv';
    a.href = URL.createObjectURL(new Blob(['﻿jméno;role;telefon;e-mail;tým\nMUDr. Jana Nová;lékař;777 123 456;jana.nova@example.cz;Tým Zlín\nBc. Petra Malá;sestra;777 234 567;;Tým Zlín\nIvana Dlouhá;pečovatelka;777 345 678;;Tým Otrokovice\n'], { type: 'text/csv' }));
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.querySelectorAll('tr[data-oid]').forEach((r) => (r.onclick = () => { const o = S.lide.find((x) => x.id === Number(r.dataset.oid)); if (o && smiLidi(o.poskytovatelId)) osobaOkno(o); }));
}

function osobaOkno(o) {
  const spravuji = S.posk.filter((p) => p.aktivni && smiLidi(p.id));
  modal(`<h2>${o.id ? 'Upravit – člen týmu' : 'Nový člen týmu'}</h2><div class="form">
    <div class="frow"><div class="field"><label>Pracoviště</label><select id="os_p">${spravuji.map((p) => `<option value="${p.id}" ${p.id === o.poskytovatelId ? 'selected' : ''}>${esc(p.nazev)}</option>`).join('')}</select></div>
      <div class="field"><label>Týmy</label><div style="padding:8px 0;font-size:13.5px">${o.id ? tymyOsoby(o.id).map((t) => `<span class="chip acc">${esc(t.nazev)}</span>`).join(' ') || '<span class="muted">zatím v žádném týmu</span>' : '<span class="muted">do týmu ho zařadíte v okně týmu (tlačítko Upravit u týmu)</span>'}</div></div></div>
    <div class="frow"><div class="field"><label>Jméno a příjmení</label><input id="os_j" value="${esc(o.jmeno || '')}"></div>
      <div class="field"><label>Role na kartě</label><select id="os_r">${Object.entries(ROLE_OS).map(([k, n]) => `<option value="${k}" ${o.role === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    <div class="frow"><div class="field"><label>Telefon</label><input id="os_tel" type="tel" value="${esc(o.telefon || '')}"></div><div class="field"><label>E-mail</label><input id="os_e" type="email" value="${esc(o.email || '')}"></div></div>
    <div class="field"><label>Poznámka</label><input id="os_poz" value="${esc(o.pozn || '')}"></div>
    ${o.id ? `<label class="row"><input type="checkbox" id="os_a" ${o.aktivni ? 'checked' : ''}> aktivní (vyřazený člověk kartu neodemkne u žádného pacienta)</label>` : ''}
    ${S.smsLide ? `<label class="row"><input type="checkbox" id="os_sms"> ${o.id ? 'nový PIN poslat SMS' : 'poslat osobní PIN SMS'} na jeho telefon</label>` : ''}
    <div class="quick"><button class="btn primary ulozit" id="os_ok">Uložit</button>${o.id ? '<button class="btn" id="os_zpin" title="Znovu ukáže platný osobní PIN (zapíše se do logu přístupů)">Zobrazit PIN</button><button class="btn" id="os_pin">Nový PIN</button><button class="btn" id="os_pd" title="Telefon a jméno podle uživatele portálu PéčeDoma">Aktualizovat z PéčeDoma</button>' : ''}<button class="btn" data-close>Zrušit</button></div>
    <div class="note">Role určuje, co člověk na kartě uvidí a zapíše: lékař a praktický lékař vše včetně návštěv lékaře, hospic a sestra DPS stav, SOS léky a zhoršení. ${o.id ? '' : 'Po uložení se zobrazí osobní PIN – jen jednou.'}</div></div>`, () => {
    const telo = () => ({ id: o.id, poskytovatelId: Number($('os_p').value), jmeno: $('os_j').value, role: $('os_r').value, telefon: $('os_tel').value, email: $('os_e').value, pozn: $('os_poz').value,
      aktivni: $('os_a') ? $('os_a').checked : true, sms: !!($('os_sms') && $('os_sms').checked) });
    $('os_ok').onclick = async () => {
      const b = telo();
      try { const r = await C('/osoba', { method: 'POST', body: b }); closeModal(); toast('Uloženo');
        await renderLide(); if (r.pin) pinyOkno([{ ...b, pin: r.pin, sms: r.sms }]); } catch (e) { toast(e.message); }
    };
    if ($('os_pd')) $('os_pd').onclick = () => { closeModal(); aktualizovatZPd({ osobaId: o.id }); };
    if ($('os_zpin')) $('os_zpin').onclick = async () => {
      try { const sms = !!($('os_sms') && $('os_sms').checked); const r = await C(`/osoba/${o.id}/pin/zobrazit`, { method: 'POST', body: { sms } }); pinyOkno([{ ...o, pin: r.pin, sms: r.sms }]); }
      catch (e) { if (e.status === 409 && await KP.confirm('PIN nejde zobrazit', `${esc(e.message)}<br><br>Vydat ${esc(o.jmeno)} nový PIN teď?`, 'Vydat nový PIN')) $('os_pin').click(); else if (e.status !== 409) toast(e.message); }
    };
    if ($('os_pin')) $('os_pin').onclick = async () => {
      if (!(await KP.confirm('Nový osobní PIN', `Dosavadní PIN ${esc(o.jmeno)} přestane platit na všech telefonech (při jejich synchronizaci).`, 'Vydat nový PIN'))) return;
      try { const sms = !!($('os_sms') && $('os_sms').checked); const r = await C(`/osoba/${o.id}/pin`, { method: 'POST', body: { sms } }); await renderLide(); pinyOkno([{ ...o, pin: r.pin, sms: r.sms }]); } catch (e) { toast(e.message); }
    };
  });
}

/** vydané osobní PINy – zobrazí se jen jednou; tisk kartiček pro předání */
/* aktualizace lidí z PéčeDoma (0.11.3): telefon a propojení podle uživatelů portálu; e-mail PéčeDoma nevede – vyplňuje se u člověka ručně */
async function aktualizovatZPd(telo) {
  try {
    const r = await C('/lide/pecedoma/aktualizovat', { method: 'POST', body: telo });
    await renderLide();
    modal(`<h2>Aktualizace z PéčeDoma</h2>
      ${r.zmeny.length ? `<div class="banner ok">Změněno: ${r.zmeny.length}</div><ul style="margin:0;padding-left:20px">${r.zmeny.map((z) => `<li><b>${esc(z.jmeno)}</b> – ${esc(z.co)}</li>`).join('')}</ul>` : `<div class="banner">Nic ke změně – telefony odpovídají PéčeDoma (${r.celkem} lidí).</div>`}
      ${r.bezTelefonu.length ? `<div class="note"><b>V PéčeDoma nemají telefon:</b> ${r.bezTelefonu.map(esc).join(', ')}. Doplňte ho v portálu PéčeDoma (Uživatelé) a spusťte aktualizaci znovu, nebo přímo tady u člověka.</div>` : ''}
      ${r.neparovani.length ? `<div class="note"><b>V PéčeDoma nenalezeni</b> (jiné jméno, nebo nejsou uživateli portálu): ${r.neparovani.map(esc).join(', ')}.</div>` : ''}
      ${r.zdroj === 'db' ? '<div class="banner warn">Propojení s PéčeDoma není nastavené (Správa organizace → Nastavení), použila se jen kopie tabulky uživatelů bez telefonů.</div>' : ''}
      <div class="note">PéčeDoma vede jméno, roli a telefon; e-mail ne – ten vyplníte u člověka ručně. Osobní PIN se aktualizací nemění, platí dál u všech pacientů, kde je člověk v týmu.</div>
      <div class="quick"><button class="btn" data-close>Zavřít</button></div>`);

/* ---- import: CSV (Excel uloží UTF-8 nebo Windows-1250, oddělovač ; nebo ,) a tým z PéčeDoma ---- */
async function textSouboru(f) {
  const buf = await f.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); } catch { return new TextDecoder('windows-1250').decode(buf); }
}
function ctiCsv(t) {
  const radky = String(t).split(/\r?\n/).filter((l) => l.trim());
  if (!radky.length) return [];
  const odd = [';', '\t', ','].sort((a, b) => radky[0].split(b).length - radky[0].split(a).length)[0];
  const deleni = (l) => { const o = []; let c = '', uv = false; for (let i = 0; i < l.length; i++) { const z = l[i]; if (z === '"') { if (uv && l[i + 1] === '"') { c += '"'; i++; } else uv = !uv; } else if (z === odd && !uv) { o.push(c.trim()); c = ''; } else c += z; } o.push(c.trim()); return o; };
  const NAZVY = { jmeno: /^(jmeno|jmeno a prijmeni|cele jmeno|prijmeni a jmeno|name|osoba)$/, role: /^(role|funkce|pozice|profese)$/, telefon: /^(telefon|tel|mobil|phone|tel\.)$/, email: /^(e-?mail|mail)$/, tym: /^(tym|team|skupina|usek)$/ };
  const hlava = deleni(radky[0]).map((h) => Object.keys(NAZVY).find((k) => NAZVY[k].test(bezDia(h))) || null);
  const maHlavu = hlava.includes('jmeno');
  const sloupce = maHlavu ? hlava : ['jmeno', 'role', 'telefon', 'email', 'tym'];
  return (maHlavu ? radky.slice(1) : radky).map((l) => { const v = deleni(l); const o = {}; sloupce.forEach((k, i) => { if (k) o[k] = v[i] || ''; }); return o; }).filter((o) => o.jmeno && o.jmeno.length >= 3);
}

        const vyber = [...document.querySelectorAll('[data-im]:checked')].map((c) => Number(c.dataset.im));
        const vychozi = $('im_t').value.trim();
        const data = vyber.map((i) => ({ jmeno: radky[i].jmeno, role: document.querySelector(`[data-imr="${i}"]`).value, tym: document.querySelector(`[data-imt="${i}"]`).value.trim() || vychozi, telefon: radky[i].telefon || '', email: radky[i].email || '', externiId: radky[i].externiId || '' }));
        if (!data.length) return toast('Vyberte aspoň jednoho člověka');
        const bezRole = data.find((x) => !x.role); if (bezRole) return toast(`${bezRole.jmeno}: vyberte roli na kartě`);
        $('im_ok').disabled = true; $('im_ok').textContent = 'Načítám…';
        try { const r = await C('/lide/import', { method: 'POST', body: { poskytovatelId: ps.id, zdroj, radky: data, sms: !!($('im_sms') && $('im_sms').checked) } });

        } catch (e) { toast(e.message); $('im_ok').disabled = false; $('im_ok').textContent = 'Načíst vybrané'; }
      };
    });
  };
  kresli();
}

/* ---- u pacienta: kdo odemkne kartu (lidé z týmů pracovišť v týmu kolem pacienta) ---- */
const smiPriradit = (d, psId) => d.op.garant || d.op.lekar || (d.op.zapis && psId === S.ja.poskytovatelId);
/* týmy lidí u pacienta (0.10.0): tým se vybírá z agendy Lidé a týmy, u pacienta jde člena jen deaktivovat */
function tymyPanel(d) {
  const tymy = d.tymyLidi || [], nabidka = (d.tymyNabidka || []).filter((t) => smiPriradit(d, t.poskytovatelId));
  const skupina = (t) => { const akt = t.clenove.filter((c) => c.aktivni).length, smi = d.op.aktivni && smiPriradit(d, t.poskytovatelId);
    return `<section class="lkskup acc"><div class="lkskup-h"><span>${esc(t.nazev)} · ${esc(t.poskytovatel)}</span><span class="row" style="gap:6px;text-transform:none;letter-spacing:0"><span class="chip">${akt} / ${t.clenove.length}</span>${smi ? `<button class="btn sm" data-tlodeb="${t.tymId}">Odebrat tým</button>` : ''}</span></div>
      ${t.clenove.length ? `<table class="tbl"><tbody>${t.clenove.map((c) => `<tr style="${c.aktivni ? '' : 'opacity:.6'}"><td><b>${esc(c.jmeno)}</b><div class="lbl">${esc(ROLE_OS[c.role] || c.role)}${c.poskytovatel ? ' · ' + esc(c.poskytovatel) : ''}${c.maPin ? '' : ' · <span style="color:var(--warn)">nemá PIN</span>'}</div></td>
        <td><span class="chip ${c.aktivni ? 'ok' : ''}">${c.aktivni ? 'aktivní' : 'deaktivován u pacienta'}</span></td>
        <td style="text-align:right">${smi ? `<button class="btn sm" data-tlcl="${t.tymId}|${c.osobaId}|${c.aktivni ? 0 : 1}">${c.aktivni ? 'Deaktivovat' : 'Aktivovat'}</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="lkskup-p">tým zatím nemá členy – doplňte je v agendě Lidé a týmy</div>'}</section>`; };
  return `<div class="panel"><div class="panel-h"><h2>Týmy u pacienta</h2><span class="chip ${tymy.length ? 'ok' : 'warn'}">${tymy.length}</span></div>
    ${tymy.map(skupina).join('') || '<div class="note" style="margin:12px 14px">Zatím žádný tým. Vyberte tým z agendy Lidé a týmy – jeho členové odemknou kartu svým osobním PINem.</div>'}
    ${d.op.aktivni && nabidka.length ? `<div class="form" style="padding:12px 14px"><div class="field"><label>Přidat tým (z agendy Lidé a týmy)</label><select id="tl_sel">${nabidka.map((t) => `<option value="${t.id}">${esc(t.nazev)} · ${esc(t.poskytovatel)} (${t.clenu} ${t.clenu === 1 ? 'člen' : t.clenu < 5 ? 'členové' : 'členů'})${(t.mimoTym || []).length ? ' – do týmu kolem pacienta se přidá: ' + esc(t.mimoTym.join(', ')) : ''}</option>`).join('')}</select></div><button class="btn primary" id="tl_ok">Přidat tým</button></div>` : ''}
    <div class="note">Týmy definuje garant v agendě <b>Lidé a týmy</b> (mohou v nich být i lidé jiných pracovišť – sestra domova, praktik). Tady tým vyberete; kdo z něj u tohoto pacienta kartu odemykat nemá, toho <b>deaktivujete</b>. Kdo do týmu přibude, dostane přístup sám. Telefon změny převezme při nejbližší synchronizaci.</div></div>`;
}
function lidePanel(d) {
  const zTymu = (d.tymyLidi || []).flatMap((t) => t.clenove.filter((c) => c.aktivni).map((c) => ({ ...c, tym: t.nazev, poskytovatel: t.poskytovatel })));

  const radek = (o, akce) => `<tr><td><b>${esc(o.jmeno)}</b><div class="lbl">${esc(ROLE_OS[o.role] || o.role)} · ${esc(o.tym || o.poskytovatel)}${o.maPin ? '' : ' · <span style="color:var(--warn)">nemá PIN</span>'}</div></td><td style="text-align:right">${akce}</td></tr>`;
  return `<div class="panel"><div class="panel-h"><h2>Lidé, kteří odemknou kartu</h2><span class="chip ${zTymu.length + jednotlive.length ? 'ok' : 'warn'}">${zTymu.length + jednotlive.length}</span></div>
    ${zTymu.length || jednotlive.length ? `<div class="tblwrap"><table class="tbl"><tbody>${zTymu.map((o) => radek(o, '')).join('')}
      ${jednotlive.length ? `<tr><td colspan="2" style="background:var(--surface-2);font-weight:600;font-size:13px">Přiřazení jednotlivě (před zavedením týmů)</td></tr>${jednotlive.map((o) => radek(o, smiPriradit(d, o.poskytovatelId) ? `<button class="btn sm" data-lodeb="${o.osobaId}">Odebrat</button>` : '')).join('')}` : ''}</tbody></table></div>` : '<div class="note" style="margin:12px 14px">Zatím nikdo. Přidejte tým v záložce Tým a garance.</div>'}
    <div class="note">Lidé se přiřazují po týmech v záložce <b>Tým a garance → Týmy u pacienta</b>; lidi samotné spravuje agenda Lidé a týmy.</div></div>`;
}

    <div class="note">Co se přebírá z PéčeDoma: při založení pacienta údaje, diagnózy, léky, funkční stav a kontakty (výběr klienta v průvodci Nový pacient); u propojeného pacienta pak průběžně <b>aktivní léky</b> a <b>nejbližší plánovaná návštěva</b> (kalendář FK). Plán péče se tím nemění – léky lékař převezme do nové verze plánu v záložce Plán péče.</div></div></div>`; })()}`;
  $('ns_ok').onclick = async () => { try { await C('/nastaveni', { method: 'POST', body: { nazevSite: $('ns_n').value, intervalRevize: $('ns_i').value } }); S.nazevSite = $('ns_n').value; S.interval = Number($('ns_i').value); hlavicka(); toast('Uloženo'); } catch (e) { toast(e.message); } };
  $('pd_ok').onclick = async () => {
    try {
      await C('/nastaveni', { method: 'POST', body: { pdOdkaz: $('pd_o').value, pdApi: $('pd_a').value, pdToken: $('pd_t').value, pdSync: $('pd_s').checked } });
      const d = await C('/ja'); S.pecedoma = d.pecedoma || {}; toast('Propojení uloženo'); spravaNast();
    } catch (e) { toast(e.message); }
  };
}

render();
</script>
</body>
