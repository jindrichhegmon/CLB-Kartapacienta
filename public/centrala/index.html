<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centrální aplikace · Karta pacienta</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/shared/kp.css">
<style>
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer}
  .nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25}
  .anon{white-space:pre-wrap;font-family:var(--mono);font-size:12px;max-height:260px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px}
  .kontrow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;align-items:center}
  .kontrow input,.kontrow select{border:1px solid var(--line);border-radius:9px;padding:8px 9px;min-width:0;background:var(--surface)}
  @media (max-width:640px){.kontrow{grid-template-columns:1fr 1fr}}
  @media print{ .top,.nav,.tabs,.actions,.noprint,#modal,#toast{display:none!important} .card{box-shadow:none} }
</style>
</head>
<body>
<div class="app wide">
  <header class="top" id="top"></header>
  <main class="content" id="work"></main>
</div>
<div id="modal"></div><div id="toast" class="toast" hidden></div>
<script src="/shared/kp.js"></script>
<script src="/shared/qrcode.js"></script>
<script>
const { esc, api, toast, modal, closeModal, fmtD, fmtDT, CILE, LIMITY } = KP;
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
if (qs.get('t')) { localStorage.setItem('kp_tenant', qs.get('t').toUpperCase()); history.replaceState(null, '', location.pathname); }
const S = { tenant: localStorage.getItem('kp_tenant') || '', session: sessionStorage.getItem('kp_session') || '', ja: null, view: 'pacienti', pac: null, tab: 'karta', stav: 'AKTIVNI', posk: [], wiz: null };
const C = (p, o = {}) => api('/api/c' + p, { ...o, token: S.session }).catch((e) => { if (e.status === 401) { odhlas(); } throw e; });
const jeLekar = () => S.ja && S.ja.role.includes('lekar');
const jeAdmin = () => S.ja && S.ja.role.includes('admin');
const ROLE_NAZ = { admin: 'správce', lekar: 'lékař', sestra: 'sestra', ctenar: 'jen čtení' };
const TYM_NAZ = { GARANT: 'garant', PECE: 'péče', LEKAR: 'lékař', HOST: 'host (čtení)' };

function odhlas() { S.session = ''; S.ja = null; sessionStorage.removeItem('kp_session'); render(); }

/* ================= hlavička ================= */
function hlavicka() {
  if (!S.ja) { $('top').innerHTML = `<img src="/icons/icon.svg" alt="" width="40" height="40" style="border-radius:12px"><div class="ttl"><h1>Karta pacienta</h1><div class="meta">Centrální aplikace</div></div>`; return; }
  $('top').innerHTML = `<img src="/icons/icon.svg" alt="" width="40" height="40" style="border-radius:12px"><div class="ttl"><h1>${esc(S.nazevSite || 'Karta pacienta')}</h1><div class="meta">Centrální aplikace · garant a tým kolem pacienta</div></div>
    <div class="who noprint">${esc(S.ja.jmeno)}<br>${esc(S.ja.poskytovatel)} · ${S.ja.role.map((r) => ROLE_NAZ[r]).join(', ')}</div>
    <span class="verbadge">v${esc(S.verze || '')}</span><button class="btn sm noprint" id="odhl">Odhlásit</button>`;
  $('odhl').onclick = odhlas;
}
function nav() {
  const pol = [['pacienti', 'Pacienti'], ...(jeLekar() ? [['novy', '+ Nový pacient']] : []), ...(jeAdmin() ? [['sprava', 'Správa organizace']] : []), ['ucet', 'Můj účet']];
  return `<div class="nav noprint">${pol.map(([k, n]) => `<button data-v="${k}" class="${S.view === k || (k === 'pacienti' && S.view === 'detail') ? 'on' : ''}">${n}</button>`).join('')}</div>`;
}
function bindNav() { document.querySelectorAll('.nav button').forEach((b) => (b.onclick = () => { S.view = b.dataset.v; if (b.dataset.v === 'novy') S.wiz = null; render(); window.scrollTo(0, 0); })); }

/* ================= přihlášení ================= */
async function render() {
  if (!S.session) return renderLogin();
  if (!S.ja) {
    try { const d = await C('/ja'); S.ja = d.ja; S.nazevSite = d.nazevSite; S.verze = d.verze; S.ai = d.ai; S.interval = d.nastaveni.intervalRevize; S.verejna = d.verejnaAdresa; } catch (e) { return; }
    try { S.posk = (await C('/poskytovatele')).poskytovatele; } catch { S.posk = []; }
  }
  hlavicka();
  if (S.ja.musiZmenitHeslo) return renderUcet(true);
  ({ pacienti: renderPacienti, detail: renderDetail, novy: renderNovy, sprava: renderSprava, ucet: () => renderUcet(false) }[S.view] || renderPacienti)();
}

function renderLogin() {
  hlavicka();
  $('work').innerHTML = `<div class="login"><div class="panel">
    <h2>Přihlášení</h2>
    ${S.tenant ? `<div class="note">Organizace: <span class="mono">${esc(S.tenant)}</span> · <a href="#" id="jinaOrg">jiná organizace</a></div>` : `<div class="field"><label>Kód organizace</label><input id="l_t" placeholder="16 znaků z odkazu, který jste dostali" autocapitalize="characters"></div>`}
    <div class="field"><label>Přihlašovací jméno</label><input id="l_l" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label>Heslo</label><input id="l_h" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="l_ok">Přihlásit</button>
    <div class="footer">Karta pacienta · data v PeceDomaPlus, přístup podle týmu kolem pacienta</div></div></div>`;
  if ($('jinaOrg')) $('jinaOrg').onclick = (e) => { e.preventDefault(); S.tenant = ''; localStorage.removeItem('kp_tenant'); renderLogin(); };
  const go = async () => {
    const tenant = S.tenant || ($('l_t') && $('l_t').value.trim().toUpperCase());
    try { const d = await api('/api/c/login', { method: 'POST', body: { tenant, login: $('l_l').value, heslo: $('l_h').value } });
      S.tenant = tenant; localStorage.setItem('kp_tenant', tenant); S.session = d.session; sessionStorage.setItem('kp_session', d.session); S.view = 'pacienti'; render();
    } catch (e) { toast(e.message); }
  };
  $('l_ok').onclick = go; $('l_h').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  ($('l_t') || $('l_l')).focus();
}

function renderUcet(povinne) {
  $('work').innerHTML = `${povinne ? '' : nav()}<div class="login" style="margin-top:2vh"><div class="panel">
    <h2>${povinne ? 'Nastavte si vlastní heslo' : 'Můj účet'}</h2>
    ${povinne ? '<div class="banner warn">Přihlásili jste se prvním heslem od správce. Než budete pokračovat, zvolte si vlastní heslo (aspoň 10 znaků).</div>' : `<dl class="kv"><dt>Jméno</dt><dd>${esc(S.ja.jmeno)}</dd><dt>Login</dt><dd>${esc(S.ja.login)}</dd><dt>Pracoviště</dt><dd>${esc(S.ja.poskytovatel)}</dd><dt>Role</dt><dd>${S.ja.role.map((r) => ROLE_NAZ[r]).join(', ')}</dd></dl>`}
    <div class="field"><label>Současné heslo</label><input type="password" id="h_s" autocomplete="current-password"></div>
    <div class="field"><label>Nové heslo</label><input type="password" id="h_n" autocomplete="new-password"></div>
    <div class="field"><label>Nové heslo znovu</label><input type="password" id="h_n2" autocomplete="new-password"></div>
    <button class="btn primary" id="h_ok">Změnit heslo</button></div></div>`;
  if (!povinne) bindNav();
  $('h_ok').onclick = async () => {
    if ($('h_n').value !== $('h_n2').value) return toast('Nová hesla se neshodují');
    try { await C('/heslo', { method: 'POST', body: { stare: $('h_s').value, nove: $('h_n').value } }); toast('Heslo změněno'); S.ja.musiZmenitHeslo = false; S.view = 'pacienti'; render(); } catch (e) { toast(e.message); }
  };
}

/* ================= přehled pacientů ================= */
async function renderPacienti() {
  $('work').innerHTML = `${nav()}<div class="note">Načítám…</div>`; bindNav();
  let d; try { d = await C('/prehled?stav=' + S.stav); } catch (e) { $('work').innerHTML = `${nav()}<div class="banner crit">${esc(e.message)}</div>`; bindNav(); return; }
  const synch = (p) => !p.telefonu ? '<span class="chip">bez telefonu</span>' : `<span class="dot ${p.sync && (Date.now() - new Date(p.sync.replace(' ', 'T'))) < 12 * 3600e3 ? 'ok' : 'warn'}"></span> <span class="mono" style="font-size:12px">${esc(p.sync ? fmtDT(p.sync) : '—')}</span>${p.baterie != null ? ` <span class="muted" style="font-size:12px">${p.baterie} %</span>` : ''}`;
  $('work').innerHTML = `${nav()}
    ${d.upozorneni.length && S.stav === 'AKTIVNI' ? `<div class="panel"><div class="panel-h"><h2>Upozornění</h2><span class="chip ${d.upozorneni.some((u) => u.uroven === 'crit') ? 'crit' : 'warn'}">${d.upozorneni.length}</span></div><div class="alerts" style="padding:10px">${d.upozorneni.slice(0, 30).map((u) => `<div class="alert ${u.uroven}" data-p="${u.pacientId}">${esc(u.text)}</div>`).join('')}</div></div>` : ''}
    <div class="panel"><div class="panel-h"><h2>${S.stav === 'AKTIVNI' ? 'Pacienti s průkazem' : 'Uzavřené průkazy'} (${d.pacienti.length})</h2>
      <div class="seg" style="width:240px"><button data-s="AKTIVNI" class="${S.stav === 'AKTIVNI' ? 'on' : ''}">Aktivní</button><button data-s="UZAVRENY" class="${S.stav === 'UZAVRENY' ? 'on' : ''}">Uzavřené</button></div></div>
      <div class="tblwrap"><table class="tbl hover"><thead><tr><th>Průkaz</th><th>Pacient</th><th>Pobyt</th><th>Garant</th><th>Plán</th><th>Telefon</th><th>Poslední zápis</th></tr></thead><tbody>
      ${d.pacienti.map((p) => `<tr data-id="${p.id}"><td class="mono">${esc(p.kod)}</td><td><b>${esc(p.prijmeni)} ${esc(p.jmeno)}</b><div class="lbl">${esc(p.rok || '')}${p.posledniKrize === 'Zhoršení stavu' ? ' · <span class="chip crit">zhoršení</span>' : ''}${p.predavaSe ? ' · <span class="chip vio">předává se</span>' : ''}</div></td>
        <td>${esc(p.pobyt || '—')}</td><td>${esc(p.garant || '—')}</td>
        <td>${p.platnostDo ? (KP.prosly(p.platnostDo) ? '<span class="chip crit">po platnosti</span>' : 'do ' + fmtD(p.platnostDo)) : '<span class="chip warn">chybí</span>'}<div class="lbl">${esc(CILE[p.cil] ? CILE[p.cil].split(' (')[0] : '')}${p.verze ? ' · v' + p.verze : ''}</div></td>
        <td>${S.stav === 'AKTIVNI' ? synch(p) : esc(fmtDT(p.uzavreno))}</td><td class="mono" style="font-size:12px">${esc(fmtDT(p.posledniZapis))}</td></tr>`).join('') || `<tr><td colspan="7" class="muted">${S.stav === 'AKTIVNI' ? 'Zatím žádný pacient.' + (jeLekar() ? ' Začněte tlačítkem „+ Nový pacient“.' : '') : 'Žádné uzavřené průkazy.'}</td></tr>`}
      </tbody></table></div></div>`;
  bindNav();
  document.querySelectorAll('tr[data-id],.alert[data-p]').forEach((r) => (r.onclick = () => otevri(Number(r.dataset.id || r.dataset.p))));
  document.querySelectorAll('.seg [data-s]').forEach((b) => (b.onclick = () => { S.stav = b.dataset.s; renderPacienti(); }));
}
function otevri(id, tab) { S.view = 'detail'; S.pacId = id; S.tab = tab || 'karta'; render(); window.scrollTo(0, 0); }

/* ================= detail pacienta ================= */
async function nactiDetail() { const d = await C('/pacient/' + S.pacId); d.denikAsc = [...d.denik].reverse(); S.pac = d; return d; }
async function renderDetail() {
  $('work').innerHTML = `${nav()}<div class="note">Načítám průkaz…</div>`; bindNav();
  let d; try { d = await nactiDetail(); } catch (e) { $('work').innerHTML = `${nav()}<div class="banner crit">${esc(e.message)}</div>`; bindNav(); return; }
  kresliDetail();
}
function balikZDetailu(d) {
  const g = d.garance.find((x) => x.stav === 'PLATNA');
  const gp = g && S.posk.find((p) => p.id === g.poskytovatelId);
  return { pacient: { kod: d.pacient.kod, jmeno: d.pacient.jmeno, prijmeni: d.pacient.prijmeni, rok: d.pacient.rok }, plan: d.plan, garant: g ? { poskytovatel: g.nazev, lekar: g.lekar, telefon24: gp && gp.telefon24 } : null,
    kontakty: d.kontakty.map((k) => ({ ...k, skupina: k.skupina.toLowerCase() })), denik: d.denikAsc };
}
function kresliDetail() {
  const d = S.pac, p = d.pacient, op = d.op;
  const g = d.garance.find((x) => x.stav === 'PLATNA');
  const navrh = d.garance.find((x) => x.stav === 'NAVRZENO');
  const tabs = [['karta', 'Krizová karta'], ['plan', 'Plán péče'], ['denik', `Deník (${d.denik.length})`], ['kontakty', 'Kontakty'], ['tym', 'Tým a garance'], ['telefon', 'Telefon a PINy'], ['udaje', 'Údaje'], ['dok', 'Dokumenty'], ...(d.pristupy.length ? [['pristupy', 'Přístupy']] : [])];
  const body = { karta: tabKarta, plan: tabPlan, denik: tabDenik, kontakty: tabKontakty, tym: tabTym, telefon: tabTelefon, udaje: tabUdaje, dok: tabDok, pristupy: tabPristupy }[S.tab] || tabKarta;
  $('work').innerHTML = `${nav()}
    <div class="row noprint"><button class="btn sm" id="zpet">${KP.ICON.back} Pacienti</button>
      <div><h2 style="font-size:20px">${esc(p.prijmeni)} ${esc(p.jmeno)}${p.rok ? ', ' + esc(p.rok) : ''}</h2><div class="muted" style="font-size:13px"><span class="mono">${esc(p.kod)}</span> · ${esc(p.pobyt || 'pobyt neuveden')} · garant: <b>${esc(g ? g.nazev : '—')}</b>${p.stav === 'UZAVRENY' ? ' · <span class="chip">uzavřeno ' + esc(fmtDT(p.uzavreno)) + '</span>' : ''}</div></div></div>
    ${navrh && op.prijmoutGaranci ? `<div class="banner crit">Bylo vám navrženo převzetí garance (navrhl ${esc(navrh.navrhl || '—')}, ${esc(fmtDT(navrh.navrzeno))}).<button class="btn sm primary" id="prevzit">Převzít garanci</button><button class="btn sm" id="odmitnout">Odmítnout</button></div>` : navrh ? `<div class="banner warn">Předání garance na ${esc(navrh.nazev)} čeká na potvrzení (od ${esc(fmtDT(navrh.navrzeno))}). Do potvrzení zůstává garantem ${esc(g ? g.nazev : '—')}.</div>` : ''}
    ${d.plan && KP.prosly(d.plan.platnostDo) ? `<div class="banner ${op.lekar ? 'crit' : 'warn'}">Plán je po datu platnosti (${fmtD(d.plan.platnostDo)}) a čeká na revizi lékařem.${op.lekar ? '<button class="btn sm primary" id="revize2">Provést revizi</button>' : ''}</div>` : ''}
    <div class="tabs noprint">${tabs.map(([k, n]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div id="tabbody">${body(d)}</div>`;
  bindNav();
  $('zpet').onclick = () => { S.view = 'pacienti'; render(); };
  document.querySelectorAll('.tabs [data-t]').forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; kresliDetail(); }));
  if ($('prevzit')) $('prevzit').onclick = () => akce('/prevzit', { prijmout: true }, 'Garance převzata');
  if ($('odmitnout')) $('odmitnout').onclick = () => modal(`<h2>Odmítnout převzetí garance</h2><div class="field"><label>Důvod</label><input id="od_d"></div><div class="quick"><button class="btn crit" id="od_ok">Odmítnout</button><button class="btn" data-close>Zpět</button></div>`, () => { $('od_ok').onclick = () => { closeModal(); akce('/prevzit', { prijmout: false, duvod: $('od_d').value }, 'Odmítnuto'); }; });
  if ($('revize2')) $('revize2').onclick = revize;
  bindTab();
}
async function akce(cesta, body, hlaska, tab) {
  try { const r = await C(`/pacient/${S.pacId}${cesta}`, { method: 'POST', body }); if (hlaska) toast(hlaska); await nactiDetail(); if (tab) S.tab = tab; kresliDetail(); return r; } catch (e) { toast(e.message); throw e; }
}

/* ---- karta ---- */
function tabKarta(d) {
  return `<div class="grid2 l"><div>${KP.kartaHTML(balikZDetailu(d))}</div>
    <div style="display:grid;gap:12px;align-content:start">
      <div class="actions noprint">${d.op.lekar ? '<button class="btn sm" id="revize">Potvrdit revizi plánu</button>' : ''}${jeLekar() ? '<button class="btn sm" id="vypis">Výpis do dokumentace</button>' : ''}<button class="btn sm" id="tisk">Tisk karty</button></div>
      <div class="note"><b>Toto vidí posádka ZZS bez přihlášení</b> na telefonu u pacienta. Limitace je pro posádku závazná jen s doloženým dříve vysloveným přáním nebo rozhodnutím lékaře – karta proto vždy uvádí doklad a telefon na lékaře.</div>
      ${d.plan ? `<div class="panel"><div class="panel-h"><h2>Plán péče</h2><span class="chip acc">verze ${d.plan.verze}</span></div><dl class="kv" style="padding:12px 14px"><dt>Stanovil</dt><dd>${esc(d.plan.podepsal)}, ${esc(fmtDT(d.plan.vytvoreno))}</dd><dt>Platnost</dt><dd>${fmtD(d.plan.platnostDo)}</dd><dt>Diagnózy</dt><dd>${esc(d.plan.data.dg || '—')}</dd><dt>Funkční stav</dt><dd>${esc(d.plan.data.funkce || '—')}</dd></dl></div>` : ''}
      ${d.zarizeni.filter((z) => z.stav === 'SPAROVANO').map((z) => `<div class="panel"><div class="panel-h"><h2>Telefon u pacienta</h2><span class="chip ${z.verzePlanu === (d.plan && d.plan.verze) ? 'ok' : 'warn'}">${z.verzePlanu === (d.plan && d.plan.verze) ? 'plán aktuální' : 'čeká na synchronizaci'}</span></div><div class="rolehelp">Poslední spojení ${esc(fmtDT(z.sync))}${z.baterie != null ? ` · baterie ${z.baterie} %` : ''}${z.fronta ? ` · ${z.fronta} zápisů čeká` : ''}</div></div>`).join('') || '<div class="banner warn">Průkaz zatím není v telefonu u pacienta.<button class="btn sm" id="naTelefon">Spárovat telefon</button></div>'}
    </div></div>`;
}
/* ---- plán ---- */
function planForm(data, platnost, ro, pref = 'f') {
  data = data || {}; const dk = data.doklad || {};
  return `<div class="form ${ro ? 'locked' : ''}">
    <div class="field"><label>Cíl péče</label><select id="${pref}_cil">${Object.entries(CILE).map(([k, v]) => `<option value="${k}" ${data.cil === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>Limitace (co se neprovádí)</label><div class="checks">${LIMITY.map((l) => `<label><input type="checkbox" name="${pref}_lim" value="${esc(l)}" ${(data.limity || []).includes(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div></div>
    <div class="frow"><div class="field"><label>Dříve vyslovené přání</label><select id="${pref}_dvp"><option value="1" ${dk.dvp ? 'selected' : ''}>sepsáno</option><option value="0" ${!dk.dvp ? 'selected' : ''}>nesepsáno</option></select></div><div class="field"><label>Datum DVP</label><input type="date" id="${pref}_dvpd" value="${esc(dk.datum || '')}"></div></div>
    <div class="frow"><div class="field"><label>Kde je originál DVP</label><input id="${pref}_orig" value="${esc(dk.original || '')}"></div><div class="field"><label>Lékařská zpráva / zápis o rozhovoru</label><input id="${pref}_zpr" value="${esc(dk.zprava || '')}"></div></div>
    <div class="field"><label>Diagnózy</label><textarea id="${pref}_dg" style="font-family:var(--font);min-height:60px">${esc(data.dg || '')}</textarea></div>
    <div class="field"><label>Obvyklý funkční stav</label><textarea id="${pref}_fun" style="font-family:var(--font);min-height:60px">${esc(data.funkce || '')}</textarea></div>
    <div class="frow"><div class="field"><label>Alergie</label><input id="${pref}_al" value="${esc(data.alergie || '')}"></div><div class="field"><label>Platnost plánu do</label><input type="date" id="${pref}_plat" value="${esc(platnost || '')}"></div></div>
    <div class="field"><label>SOS medikace (řádek = lék)</label><textarea id="${pref}_sos" style="font-family:var(--font);min-height:80px">${esc((data.sos || []).join('\n'))}</textarea></div>
    <div class="field"><label>Pravidelná medikace (řádek = lék)</label><textarea id="${pref}_med" style="font-family:var(--font);min-height:90px">${esc((data.medikace || []).join('\n'))}</textarea></div>
  </div>`;
}
function ctiPlan(pref = 'f') {
  const v = (id) => ($(`${pref}_${id}`) || {}).value || '';
  return { data: { cil: v('cil'), limity: [...document.querySelectorAll(`input[name=${pref}_lim]:checked`)].map((i) => i.value), doklad: { dvp: v('dvp') === '1', datum: v('dvpd'), original: v('orig'), zprava: v('zpr') },
    dg: v('dg'), funkce: v('fun'), alergie: v('al'), sos: v('sos').split('\n').map((x) => x.trim()).filter(Boolean), medikace: v('med').split('\n').map((x) => x.trim()).filter(Boolean) }, platnostDo: v('plat') };
}
function tabPlan(d) {
  const ro = !d.op.lekar;

    $('rv_ok').onclick = async () => { closeModal(); await akce('/plan', { typ: 'REVIZE', platnostDo: $('rv_d').value, poznamka: $('rv_p').value }, 'Revize potvrzena'); };

function tabTelefon(d) {

        ${d.op.garant || d.op.lekar ? `<div class="form" style="padding:12px 14px"><div class="frow"><div class="field"><label>Jméno držitele</label><input id="pin_j" placeholder="např. Jana Nováková (dcera)"></div><div class="field"><label>Role</label><select id="pin_r"><option value="RODINA">rodina</option><option value="SESTRA">sestra (domov)</option><option value="HOSPIC">hospic</option><option value="PL">praktický lékař</option></select></div></div>

function bindTab() {
  const d = S.pac;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('revize', revize);
  on('tisk', () => window.print());
  on('naTelefon', () => { S.tab = 'telefon'; kresliDetail(); });
  on('vypis', vypis);
  on('ulozPlan', async () => { const p = ctiPlan('f'); await akce('/plan', { ...p, typ: 'ZMENA', poznamka: $('f_poz').value }, 'Plán uložen jako nová verze'); });
  document.querySelectorAll('tr[data-v]').forEach((r) => (r.onclick = async () => {
    try { const v = await C(`/pacient/${S.pacId}/plan/${r.dataset.v}`); modal(`<h2>Plán – verze ${v.verze}</h2><div class="muted">${esc(v.podepsal)} · ${esc(fmtDT(v.vytvoreno))} · platnost do ${fmtD(v.platnostDo)}</div>${planForm(v.data, v.platnostDo, true, 'h')}<div class="quick"><button class="btn" data-close>Zavřít</button></div>`); } catch (e) { toast(e.message); }
  }));
  on('d_ok', () => akce('/denik', { typ: $('d_typ').value, text: $('d_txt').value }, 'Zapsáno'));
  on('k_ok', () => akce('/kontakt', { jmeno: $('k_j').value, tel: $('k_t').value, skupina: $('k_s').value, pozn: $('k_p').value, poradi: $('k_o').value }, 'Kontakt přidán'));
  document.querySelectorAll('[data-kdel]').forEach((b) => (b.onclick = async () => { const k = d.kontakty.find((x) => x.id === Number(b.dataset.kdel)); if (await KP.confirm('Odebrat kontakt', `${esc(k.jmeno)} · ${esc(k.tel)}`, 'Odebrat', true)) akce('/kontakt', { id: k.id, smazat: true, jmeno: k.jmeno, skupina: k.skupina }, 'Odebráno'); }));
  document.querySelectorAll('[data-ked]').forEach((b) => (b.onclick = () => {

/* ================= nový pacient (průvodce) ================= */
/* soubor z portálu PéčeDoma (Data klienta → Export pro Kartu pacienta): { format: 'CLB-Kartapacienta/pacient', pacient, plan, kontakty, doplnit, puvod }
   → data průvodce; cíl péče a limitace PéčeDoma nemá – zůstanou výchozí a potvrzuje je lékař */
function zPeceDoma(j) {
  if (!j || j.format !== 'CLB-Kartapacienta/pacient' || !j.pacient) throw new Error('Toto není soubor z PéčeDoma (Data klienta → Export pro Kartu pacienta)');
  const p = j.pacient, pl = j.plan || {}, dk = pl.doklad || {};
  const t = (v, n = 500) => String(v == null ? '' : v).trim().slice(0, n);
  const seznam = (v) => (Array.isArray(v) ? v.map((x) => t(x)).filter(Boolean) : []);
  const limity = seznam(pl.limity).filter((l) => LIMITY.includes(l));
  return {
    d: {
      pacient: { jmeno: t(p.jmeno, 80), prijmeni: t(p.prijmeni, 80), rc: t(p.rc, 11), datumNarozeni: /^\d{4}-\d{2}-\d{2}$/.test(p.datumNarozeni || '') ? p.datumNarozeni : '', rok: p.rok || '',
        pohlavi: p.pohlavi === 'žena' ? 'žena' : 'muž', pojistovna: t(p.pojistovna, 3), adresa: t(p.adresa, 300), pobyt: t(p.pobyt, 200), telefonKarty: t(p.telefonKarty || p.telefon, 20) },
      plan: { cil: CILE[pl.cil] ? pl.cil : 'symptom', limity: limity.length ? limity : ['KPR'], doklad: { dvp: !!dk.dvp, datum: t(dk.datum, 10), original: t(dk.original, 200), zprava: t(dk.zprava, 200) },
        dg: t(pl.dg, 2000), funkce: t(pl.funkce, 1000), alergie: t(pl.alergie, 300), sos: seznam(pl.sos), medikace: seznam(pl.medikace) },
      kontakty: (Array.isArray(j.kontakty) ? j.kontakty : []).slice(0, 30).map((k) => ({ jmeno: [t(k.jmeno, 100), t(k.pozn, 60)].filter(Boolean).join(' – '), tel: t(k.tel, 40),
        skupina: ['ROZHODUJE', 'INFORMOVAT', 'PECUJE'].includes(k.skupina) ? k.skupina : 'INFORMOVAT', pozn: '' })).filter((k) => k.jmeno),
    },
    info: { zdroj: t(j.zdroj, 40) || 'PéčeDoma', vytvoreno: t(j.vytvoreno, 30), doplnit: seznam(j.doplnit), prevzato: seznam((j.puvod || {}).prevzato), cilVychozi: !CILE[pl.cil] },
  };
}

        <details><summary class="muted" style="cursor:pointer;font-size:13px">Co přesně odešlo k AI (anonymizovaný text)</summary><div class="anon" style="margin-top:8px">${esc(w.ai.anonymniText)}</div></details></div>`
      : w.import ? `<div class="ai"><h3>Načteno z ${esc(w.import.zdroj)}${w.import.vytvoreno ? ' · ' + esc(fmtDT(w.import.vytvoreno.replace('T', ' ').slice(0, 16))) : ''}</h3>
        <div><b style="font-size:13.5px">Zkontrolovat a doplnit:</b><ul class="missing" style="margin:6px 0 0;padding-left:18px;font-size:13.5px">${['číslo telefonu s kartou (předvyplněný je telefon klienta z PéčeDoma)'].concat(w.import.cilVychozi ? ['cíl péče a limitace – předvyplněné výchozí hodnoty, potvrďte nebo upravte'] : [], w.import.doplnit.filter((x) => !(w.import.cilVychozi && /^(cíl péče|limitace)/i.test(x)))).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
        ${w.import.prevzato.length ? `<div class="muted" style="font-size:13px;margin-top:6px">Převzato z vyšetření PM103: ${esc(w.import.prevzato.join('; '))}</div>` : ''}</div>`
      : '<div class="note">Vyplňte údaje ručně podle rozhovoru o cílech péče.</div>'}
      <div class="note">Po založení průkaz spárujte s telefonem u pacienta (záložka Telefon a PINy) a vydejte PINy rodině a sestrám.</div>
    </div></div>`;
  bindNav();
  const ulozKont = () => { w.d.kontakty = [...document.querySelectorAll('#n_kont .kontrow')].map((r) => ({ jmeno: r.querySelector('[data-k=j]').value, tel: r.querySelector('[data-k=t]').value, skupina: r.querySelector('[data-k=s]').value, pozn: '' })); };
  const ulozVse = () => { w.d.pacient = ctiUdaje('n'); const p = ctiPlan('f'); w.d.plan = p.data; w.d.platnostDo = p.platnostDo; ulozKont(); };
  $('n_kplus').onclick = () => { ulozVse(); w.d.kontakty.push({ jmeno: '', tel: '', skupina: 'INFORMOVAT' }); renderNovy(); };
  document.querySelectorAll('[data-kx]').forEach((b) => (b.onclick = () => { ulozVse(); w.d.kontakty.splice(Number(b.dataset.kx), 1); renderNovy(); }));
  $('n_zpet').onclick = () => { ulozVse(); w.krok = 1; renderNovy(); };
  $('n_ok').onclick = async () => {
    ulozVse();
    $('n_ok').disabled = true;
    try {
      const r = await C('/pacient', { method: 'POST', body: { pacient: w.d.pacient, plan: w.d.plan, platnostDo: w.d.platnostDo, kontakty: w.d.kontakty, garantPoskytovatelId: Number($('n_g').value), tym: [...$('n_t').selectedOptions].map((o) => Number(o.value)), aiPouzito: !!w.ai } });
      toast(`Průkaz ${r.kod} založen`); S.wiz = null; otevri(r.id, 'telefon');
    } catch (e) { toast(e.message); $('n_ok').disabled = false; }
  };
}
const kontRow = (k, i) => `<div class="kontrow"><input data-k="j" value="${esc(k.jmeno)}" placeholder="jméno, vztah"><input data-k="t" value="${esc(k.tel)}" placeholder="telefon"><select data-k="s">${['ROZHODUJE', 'INFORMOVAT', 'PECUJE'].map((s) => `<option value="${s}" ${k.skupina === s ? 'selected' : ''}>${s.toLowerCase()}</option>`).join('')}</select><button class="btn sm" data-kx="${i}" aria-label="Odebrat">×</button></div>`;

async function ocr(f) {
  if (!f) return;
  const st = $('w_ocr'); st.textContent = 'Načítám rozpoznávání textu (poprvé ~10 s)…';
  try {
    if (!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const r = await Tesseract.recognize(f, 'ces', { logger: (m) => { if (m.status === 'recognizing text') st.textContent = `Rozpoznávám text v prohlížeči… ${Math.round(m.progress * 100)} %`; } });
    $('w_t').value = r.data.text; st.textContent = 'Text rozpoznán – zkontrolujte ho a spusťte rozbor.';
  } catch (e) { st.textContent = 'Rozpoznání se nezdařilo – vložte text ručně.'; }
}

/* ================= správa organizace ================= */
async function renderSprava() {
  S.sTab = S.sTab || 'posk';
  const tabs = [['posk', 'Pracoviště'], ['uziv', 'Uživatelé'], ['zar', 'Telefony'], ['audit', 'Log přístupů a AI'], ['nast', 'Nastavení']];
  $('work').innerHTML = `${nav()}<div class="tabs">${tabs.map(([k, n]) => `<button data-st="${k}" class="${S.sTab === k ? 'on' : ''}">${n}</button>`).join('')}</div><div id="sbody"><div class="note">Načítám…</div></div>`;
  bindNav();
  document.querySelectorAll('[data-st]').forEach((b) => (b.onclick = () => { S.sTab = b.dataset.st; renderSprava(); }));
  try { await ({ posk: spravaPosk, uziv: spravaUziv, zar: spravaZar, audit: spravaAudit, nast: spravaNast }[S.sTab])(); } catch (e) { $('sbody').innerHTML = `<div class="banner crit">${esc(e.message)}</div>`; }
}
async function spravaPosk() {
  S.posk = (await C('/poskytovatele')).poskytovatele;
  $('sbody').innerHTML = `<div class="row"><button class="btn primary" id="p_new">+ Pracoviště</button><span class="muted" style="font-size:13px">Pracoviště = nemocnice, hospic, ambulance, praktický lékař, domov… Garantem může být jen nemocnice, hospic, ambulance nebo PL.</span></div>
    <div class="panel"><div class="tblwrap"><table class="tbl hover"><thead><tr><th>Název</th><th>Typ</th><th>IČO / IČP</th><th>Telefon 24/7</th><th>Garant</th><th></th></tr></thead><tbody>${S.posk.map((p) => `<tr data-id="${p.id}"><td><b>${esc(p.nazev)}</b><div class="lbl">${esc(p.adresa || '')}</div></td><td>${esc(p.typ)}</td><td>${esc(p.ico || '')} ${p.icp ? '/ ' + esc(p.icp) : ''}</td><td class="mono">${esc(p.telefon24 || '')}</td><td>${p.smiBytGarant ? '<span class="chip ok">ano</span>' : '<span class="chip">ne</span>'}</td><td>${p.aktivni ? '' : '<span class="chip">neaktivní</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  const form = (p = {}) => modal(`<h2>${p.id ? 'Upravit' : 'Nové'} pracoviště</h2><div class="form">
    <div class="field"><label>Název</label><input id="pp_n" value="${esc(p.nazev || '')}"></div>
    <div class="frow"><div class="field"><label>Typ</label><select id="pp_t">${['NEMOCNICE', 'HOSPIC', 'AMBULANCE', 'PL', 'DOMOV', 'ZZS', 'JINY'].map((t) => `<option ${p.typ === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div class="field"><label>Telefon 24/7</label><input id="pp_tel" value="${esc(p.telefon24 || '')}"></div></div>
    <div class="frow"><div class="field"><label>IČO</label><input id="pp_ico" value="${esc(p.ico || '')}"></div><div class="field"><label>IČP</label><input id="pp_icp" value="${esc(p.icp || '')}"></div></div>
    <div class="field"><label>Adresa</label><input id="pp_a" value="${esc(p.adresa || '')}"></div>
    <label class="row"><input type="checkbox" id="pp_ak" ${p.aktivni === false ? '' : 'checked'}> aktivní</label>
    <div class="quick"><button class="btn primary" id="pp_ok">Uložit</button><button class="btn" data-close>Zrušit</button></div></div>`, () => {
    $('pp_ok').onclick = async () => { try { await C('/poskytovatel', { method: 'POST', body: { id: p.id, nazev: $('pp_n').value, typ: $('pp_t').value, telefon24: $('pp_tel').value, ico: $('pp_ico').value, icp: $('pp_icp').value, adresa: $('pp_a').value, aktivni: $('pp_ak').checked } }); closeModal(); toast('Uloženo'); renderSprava(); } catch (e) { toast(e.message); } };
  });
  $('p_new').onclick = () => form();
  document.querySelectorAll('#sbody tr[data-id]').forEach((r) => (r.onclick = () => form(S.posk.find((p) => p.id === Number(r.dataset.id)))));
}
async function spravaUziv() {
  const { uzivatele } = await C('/uzivatele');
  $('sbody').innerHTML = `<div class="row"><button class="btn primary" id="u_new">+ Uživatel</button><span class="muted" style="font-size:13px">Lékař zakládá pacienty a mění plán péče; sestra zapisuje do deníku a kontaktů; správce spravuje pracoviště a uživatele.</span></div>
    <div class="panel"><div class="tblwrap"><table class="tbl hover"><thead><tr><th>Jméno</th><th>Login</th><th>Pracoviště</th><th>Role</th><th>Poslední přihlášení</th></tr></thead><tbody>${uzivatele.map((u) => `<tr data-id="${u.id}"><td><b>${esc(u.jmeno)}</b>${u.aktivni ? '' : ' <span class="chip">neaktivní</span>'}${u.prvniHeslo ? `<div class="lbl">první heslo: <span class="mono">${esc(u.prvniHeslo)}</span></div>` : ''}</td><td class="mono">${esc(u.login)}</td><td>${esc(u.poskytovatel)}</td><td>${u.role.map((r) => `<span class="chip">${ROLE_NAZ[r]}</span>`).join(' ')}</td><td class="mono" style="font-size:12px">${esc(fmtDT(u.posledni))}</td></tr>`).join('')}</tbody></table></div></div>`;
  const form = (u = {}) => modal(`<h2>${u.id ? 'Upravit' : 'Nový'} uživatel</h2><div class="form">
    <div class="frow"><div class="field"><label>Jméno a příjmení</label><input id="uu_j" value="${esc(u.jmeno || '')}"></div><div class="field"><label>Login</label><input id="uu_l" value="${esc(u.login || '')}" autocapitalize="off"></div></div>
    <div class="frow"><div class="field"><label>E-mail</label><input id="uu_e" value="${esc(u.email || '')}"></div><div class="field"><label>Telefon</label><input id="uu_t" value="${esc(u.telefon || '')}"></div></div>
    <div class="frow"><div class="field"><label>Pracoviště</label><select id="uu_p">${S.posk.filter((p) => p.aktivni).map((p) => `<option value="${p.id}" ${u.poskytovatelId === p.id ? 'selected' : ''}>${esc(p.nazev)}</option>`).join('')}</select></div><div class="field"><label>Číslo ČLK (lékař)</label><input id="uu_c" value="${esc(u.clk || '')}"></div></div>
    <div class="field"><label>Role</label><div class="checks">${Object.entries(ROLE_NAZ).map(([k, n]) => `<label style="color:inherit"><input type="checkbox" name="uu_r" value="${k}" ${(u.role || ['sestra']).includes(k) ? 'checked' : ''} style="accent-color:var(--accent)">${n}</label>`).join('')}</div></div>
    <label class="row"><input type="checkbox" id="uu_a" ${u.aktivni === false ? '' : 'checked'}> aktivní</label>
    ${u.id ? '<label class="row"><input type="checkbox" id="uu_h"> vygenerovat nové heslo</label>' : ''}
    <div class="quick"><button class="btn primary" id="uu_ok">Uložit</button><button class="btn" data-close>Zrušit</button></div></div>`, () => {
    $('uu_j').oninput = () => { if (!u.id && !$('uu_l').dataset.r) $('uu_l').value = $('uu_j').value.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\b(mudr|ing|mgr|bc|phdr)\.?\s*/g, '').trim().replace(/\s+/g, '.').replace(/[^a-z0-9.]/g, ''); };
    $('uu_l').oninput = () => ($('uu_l').dataset.r = 1);
    $('uu_ok').onclick = async () => {
      try { const r = await C('/uzivatel', { method: 'POST', body: { id: u.id, jmeno: $('uu_j').value, login: $('uu_l').value, email: $('uu_e').value, telefon: $('uu_t').value, poskytovatelId: Number($('uu_p').value), clk: $('uu_c').value, role: [...document.querySelectorAll('input[name=uu_r]:checked')].map((i) => i.value), aktivni: $('uu_a').checked, noveHeslo: $('uu_h') && $('uu_h').checked } });
        if (r.heslo) modal(`<h2>Přístup pro ${esc($('uu_j') ? $('uu_j').value : '')}</h2><dl class="kv"><dt>Odkaz</dt><dd>${esc(location.origin)}/centrala/?t=${esc(S.tenant)}</dd><dt>Login</dt><dd class="mono">${esc($('uu_l').value)}</dd></dl><div class="secret">${esc(r.heslo)}</div><p class="muted">Heslo předejte uživateli; po prvním přihlášení si ho změní.</p><div class="quick"><button class="btn" data-close>Hotovo</button></div>`);
        else closeModal();
        toast('Uloženo'); spravaUziv();
      } catch (e) { toast(e.message); }
    };
  });
  $('u_new').onclick = () => form();
  document.querySelectorAll('#sbody tr[data-id]').forEach((r) => (r.onclick = () => form(uzivatele.find((u) => u.id === Number(r.dataset.id)))));
}
async function spravaZar() {
  const { zarizeni } = await C('/zarizeni');
  $('sbody').innerHTML = `<div class="panel"><div class="panel-h"><h2>Telefony</h2><span class="chip">${zarizeni.filter((z) => z.stav === 'SPAROVANO').length} u pacientů</span></div><div class="tblwrap"><table class="tbl hover"><thead><tr><th>Telefon</th><th>Pacient</th><th>Stav</th><th>Poslední spojení</th><th>Baterie</th><th>Verze plánu</th><th>Fronta</th></tr></thead><tbody>${zarizeni.map((z) => `<tr data-p="${z.pacientId || ''}"><td>${esc(z.stitek || '#' + z.id)}<div class="lbl">${esc(z.verze || '')}</div></td><td class="mono">${esc(z.kod || '—')}</td><td><span class="chip ${z.stav === 'SPAROVANO' ? 'ok' : z.stav === 'ZABLOKOVANO' ? 'crit' : ''}">${esc(z.stav.toLowerCase())}</span></td><td class="mono" style="font-size:12px">${esc(fmtDT(z.sync))}</td><td>${z.baterie != null ? z.baterie + ' %' : '—'}</td><td>${z.verzePlanu ? 'v' + z.verzePlanu : '—'}</td><td>${z.fronta || 0}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Žádné telefony.</td></tr>'}</tbody></table></div></div>`;
  document.querySelectorAll('#sbody tr[data-p]').forEach((r) => { if (r.dataset.p) r.onclick = () => otevri(Number(r.dataset.p), 'telefon'); });
}
async function spravaAudit() {
  const { audit, ai } = await C('/audit');
  $('sbody').innerHTML = `<div class="grid2 l"><div class="panel"><div class="panel-h"><h2>Log přístupů</h2></div><div class="tblwrap"><table class="tbl"><tbody>${audit.map((a) => `<tr><td class="mono" style="font-size:12px;white-space:nowrap">${esc(a.cas)}</td><td>${esc(a.kdo || '')}</td><td class="mono">${esc(a.pacient || '')}</td><td>${esc(a.akce)}${a.detail ? `<div class="lbl">${esc(a.detail)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel" style="align-self:start"><div class="panel-h"><h2>Dotazy na AI (bez obsahu)</h2></div><div class="tblwrap"><table class="tbl"><tbody>${ai.map((a) => `<tr><td class="mono" style="font-size:12px">${esc(a.cas)}</td><td>${esc(a.ucel)}<div class="lbl">${a.delka} znaků · ${a.nahrad} údajů anonymizováno${a.model ? ' · ' + esc(a.model) : ''}</div></td><td><span class="chip ${a.vysledek === 'BLOK' ? 'crit' : 'ok'}">${esc(a.vysledek || '')}</span></td></tr>`).join('') || '<tr><td class="muted">Zatím žádné.</td></tr>'}</tbody></table></div></div></div>`;
}
async function spravaNast() {
  $('sbody').innerHTML = `<div class="panel" style="max-width:560px"><div class="form" style="padding:14px">
    <div class="field"><label>Název sítě (hlavička aplikace)</label><input id="ns_n" value="${esc(S.nazevSite || '')}"></div>
    <div class="field"><label>Výchozí interval revize plánu (měsíce)</label><input id="ns_i" type="number" min="1" max="12" value="${esc(S.interval || 3)}"></div>
    <div class="field"><label>Odkaz pro přihlášení uživatelů</label><div class="secret" style="font-size:13px;letter-spacing:0">${esc(location.origin)}/centrala/?t=${esc(S.tenant)}</div></div>
    <button class="btn primary" id="ns_ok">Uložit</button></div></div>`;
  $('ns_ok').onclick = async () => { try { await C('/nastaveni', { method: 'POST', body: { nazevSite: $('ns_n').value, intervalRevize: $('ns_i').value } }); S.nazevSite = $('ns_n').value; S.interval = Number($('ns_i').value); hlavicka(); toast('Uloženo'); } catch (e) { toast(e.message); } };
}

render();
</script>
