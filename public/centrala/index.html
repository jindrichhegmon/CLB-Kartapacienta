<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KARTA PACIENTA ON-LINE · centrální aplikace</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script>
/* ikona oka je vložené SVG (ne emotikona přes ikony.js) – spolehlivě i v Safari */
const OKO_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', OKO_SVG_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
function hesloOko(btn){ const i = btn.parentNode.querySelector('input'); const uk = i.type === 'password'; i.type = uk ? 'text' : 'password'; btn.innerHTML = uk ? OKO_SVG_OFF : OKO_SVG; btn.title = uk ? 'Skrýt heslo' : 'Zobrazit heslo'; btn.setAttribute('aria-label', btn.title); i.focus(); }
/* vzhled zvolený na tomto zařízení – nastaví se před vykreslením, aby stránka neprobleskla jinou barvou */
try { var _v = localStorage.getItem('kp_vzhled'); if (_v === 'tmava') document.documentElement.setAttribute('data-theme', 'dark'); else if (_v && _v !== 'modra' && /^[a-z]+$/.test(_v)) { document.documentElement.setAttribute('data-theme', 'light'); document.documentElement.setAttribute('data-skin', _v); } } catch (e) {}</script>
<link rel="stylesheet" href="/shared/kp.css">
<style>
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 13px;height:34px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
  .nav button .ik{width:17px;height:17px}
  .nav button:hover{background:var(--surface-2)}
  .nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25}
  .anon{white-space:pre-wrap;font-family:var(--mono);font-size:12px;max-height:260px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px}
  .kontrow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;align-items:center}
  @media (max-width:640px){.kontrow{grid-template-columns:1fr 1fr}}
  .telchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border:1.5px solid var(--accent);border-radius:999px;background:var(--surface);color:var(--accent-ink);font-family:var(--mono);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;vertical-align:middle}
  .telchip svg{width:14px;height:14px;color:var(--accent)}
  .telchip:active{background:var(--accent-soft)}
  /* 0.11.47: zvonící / probíhající videohovory v každé agendě (pod hlavičkou) */
  #vidglobal{display:grid;gap:6px;padding:0 max(16px,env(safe-area-inset-left,0px))}#vidglobal:not(:empty){padding-top:10px}
  #vidglobal .banner{margin:0}
  /* 0.11.68: hlavička jako PéčeDoma (stejný přechod barev, logo, Made with, verze, štítek, uživatel a role vpravo) */
  .top{gap:12px;min-height:52px;padding-block:8px}
  .top .logo{font-size:18px;font-weight:700;white-space:nowrap;color:#fff}.top .logo span{color:rgba(255,255,255,.78)}
  .top .madefor{display:flex;flex-direction:column;justify-content:center;gap:1px;height:34px;font-size:11px;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;min-width:60px;flex-shrink:1;line-height:1.2}
  .top .madefor b{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.72)}
  .top .ver{background:rgba(255,255,255,.22);color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 8px;height:34px;display:inline-flex;align-items:center;white-space:nowrap}
  .top .live{background:var(--surface);color:var(--accent-ink);font-size:10.5px;font-weight:700;border-radius:5px;padding:0 8px;height:34px;display:inline-flex;align-items:center;white-space:nowrap}
  .top .topmeta{font-size:12px;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top .rolebox{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
  .top .rolebox .uziv{background:rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:0 9px;height:34px;display:inline-flex;align-items:center;font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .top .rolebox .rolesel{background:var(--surface);color:var(--fg);border-radius:6px;padding:0 10px;height:34px;display:inline-flex;align-items:center;font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .top .rolebox .btn{background:var(--surface);color:var(--accent-ink);border-color:var(--surface);font-weight:700}
  @media (max-width:1200px){.top .live,.top .topmeta{display:none}.top .madefor{max-width:240px}.top .rolebox .uziv{max-width:170px}}
  @media (max-width:900px){.top .madefor{display:none}}
  /* 0.11.46: centrála na mobilu – kompaktní hlavička, záložky ve dvou řadách, záhlaví panelů a akce se zalamují */
  @media (max-width:640px){
    .top .ver,.top .rolebox .rolesel{display:none}
    .top .logo{font-size:16px}
    .top .rolebox{gap:5px;flex-wrap:wrap;justify-content:flex-end;min-width:0;max-width:100%}
    .nav button{height:32px;padding:0 10px;font-size:12px}
    .tabs{flex-wrap:wrap;gap:3px;border-bottom:0}
    .tabs button{padding:7px 10px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
    .tabs button.on{border-color:var(--accent);border-bottom:1px solid var(--accent)}
    .panel-h{flex-wrap:wrap;row-gap:6px}
    .actions{flex-wrap:wrap;overflow:visible}
    .actions .btn{flex:1 1 auto}
    .row>h2{font-size:18px!important}
    .modal .box{max-height:92vh}
    .tbl td,.tbl th{padding:6px 7px}
    /* 0.11.58: tabulky na mobilu – každý řádek je karta pod sebou, buňky s popiskem sloupce (data-l doplní oznacTabulky), tlačítka se zalamují;
       nic nepřetéká přes okraj a není třeba posouvat do strany */
    .tblwrap{overflow:visible}
    .tbl{display:block;width:100%}
    .tbl thead{display:none}
    .tbl tbody,.tbl tr{display:block;width:100%}
    .tbl tr{border-bottom:1px solid var(--line);padding:8px 10px}
    .tbl tr:last-child{border-bottom:0}
    .tbl tr>td,.lkskup .tbl td{display:block;width:100%;box-sizing:border-box;border:0;padding:2px 0;white-space:normal!important;text-align:left!important}
    .tbl tr>td:empty{display:none}
    .tbl tr>td[data-l]:not(:first-child):not([data-l=""])::before{content:attr(data-l) ': ';color:var(--muted);font-size:12px}
    .tbl tr>td .btn{margin:4px 6px 0 0;white-space:normal}
    .tbl tr>td .btn.sm{min-height:34px}
    .tbl tr>td[colspan]{padding:6px 0 2px}
    /* 0.11.49: agendy na celou šířku obrazovky */
    .content{padding-left:4px;padding-right:4px;gap:8px}
    #vidglobal{padding-left:4px;padding-right:4px}
    .top{padding-left:10px;padding-right:10px}
    .panel,.card{border-radius:6px}
    .modal .box{max-width:none}
    .grid2{gap:8px}
  }
  @media print{ .top,.nav,.tabs,.actions,.noprint,#modal,#toast{display:none!important} .card{box-shadow:none} }

/* zobrazit / skrýt heslo (👁) u polí s heslem – od 0.11.74 */
.oko-obal{position:relative}.oko-obal input{width:100%;padding-right:42px;box-sizing:border-box}.oko{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:30px;width:34px;border:0;background:transparent;color:#2E86D9;cursor:pointer;font-size:16px;padding:0;margin:0;line-height:1;display:inline-flex;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none;box-shadow:none}
</style>
</head>
<body>
<div class="app wide">
  <header class="top" id="top"></header>
  <div id="vidglobal" class="noprint"></div>
  <main class="content" id="work"></main>
</div>
<div id="modal"></div><div id="toast" class="toast" hidden></div>
<script src="/shared/kp.js"></script>
<script src="/shared/kp-ikony.js"></script>
<script src="/shared/qrcode.js"></script>
<script src="/shared/kp-napoveda.js"></script>
<script>
const { esc, api, toast, modal, closeModal, fmtD, fmtDT, CILE, LIMITY } = KP;
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
if (qs.get('t')) { localStorage.setItem('kp_tenant', qs.get('t').toUpperCase()); history.replaceState(null, '', location.pathname); }
const S = { tenant: localStorage.getItem('kp_tenant') || '', session: sessionStorage.getItem('kp_session') || '', ja: null, view: 'pacienti', pac: null, tab: 'karta', stav: 'AKTIVNI', posk: [], wiz: null };
/* fulltextové hledání v agendách (0.11.15): políčko filtruje řádky tabulek na stránce – všechna slova, bez ohledu na diakritiku a velikost písmen; text se pamatuje pro každou agendu */
S.hledat = {};
/* pacient v domově seniorů (0.11.16): podle pracoviště typu DOMOV v týmu kolem pacienta, jinak podle textu pobytu */
const vDomove = (p, tym) => { const t = (tym || []).find((x) => x.typ === 'DOMOV'); if (t) return t.nazev; if (p && p.domov) return p.domov; return /domov|dps\b|senior|pobytov|ldn\b/i.test(String((p && p.pobyt) || '')) ? '' : null; };
const domovChip = (nazev) => nazev === null ? '' : `<span class="chip dom" title="Pacient je v domově seniorů / pobytové službě">🏠 domov seniorů${nazev ? ' · ' + esc(nazev) : ''}</span>`;
const hledatHTML = (klic, placeholder = 'Hledat…') => `<input class="hledat" id="hl_${klic}" value="${esc(S.hledat[klic] || '')}" placeholder="${esc(placeholder)}" autocomplete="off"><span class="hledat-pocet" id="hlp_${klic}"></span>`;
function bindHledani(klic, radky) {
  const el = $('hl_' + klic); if (!el) return;
  const filtruj = () => {
    const slova = bezDia(el.value).split(/\s+/).filter(Boolean); S.hledat[klic] = el.value;
    let vidim = 0, celkem = 0;
    document.querySelectorAll(radky).forEach((r) => { if (r.dataset.hlSkip) return; celkem++; const t = bezDia(r.textContent); const ok = slova.every((w) => t.includes(w)); r.hidden = !ok; if (ok) vidim++; });
    const p = $('hlp_' + klic); if (p) p.textContent = slova.length ? `${vidim} z ${celkem}` : '';
  };
  el.oninput = filtruj; filtruj();
}
const C = (p, o = {}) => api('/api/c' + p, { ...o, token: S.session }).catch((e) => { if (e.status === 401) { odhlas(); } throw e; });
const jeLekar = () => S.ja && S.ja.role.includes('lekar');
const jeAdmin = () => S.ja && S.ja.role.includes('admin');
const ROLE_NAZ = { admin: 'správce', lekar: 'lékař', sestra: 'sestra', ctenar: 'jen čtení' };
const TYM_NAZ = { GARANT: 'garant', PECE: 'péče', LEKAR: 'lékař', HOST: 'host (čtení)' };

/* nápověda: kapitola a název obrazovky podle toho, co má uživatel otevřené */
const TAB_KAP = { karta: 5, plan: 5, denik: 6, kontakty: 6, tym: 7, telefon: 8, udaje: 9, dok: 9, pristupy: 9 };
const TAB_NAZ = { karta: 'Krizová karta', plan: 'Plán péče', denik: 'Deník', kontakty: 'Důležité kontakty', tym: 'Tým a garance', telefon: 'Telefon a PINy', udaje: 'Detail pacienta', dok: 'Dokumenty', pristupy: 'Přístupy' };
KP.napoveda.nastav({ aplikace: 'centrala', fab: true, auth: () => ({ token: S.session }),
  kapitola: () => (!S.session ? 2 : ({ pacienti: 3, novy: 4, detail: TAB_KAP[S.tab] || 5, lide: 11, sprava: 12, ucet: 2 }[S.view] || 3)),
  obrazovka: () => (!S.session ? 'Přihlášení' : S.view === 'detail' ? 'Detail pacienta, záložka ' + (TAB_NAZ[S.tab] || '') : ({ pacienti: 'Pacienti', novy: 'Nový pacient', lide: 'Lidé a týmy', sprava: 'Správa organizace' + (S.sTab ? ' – ' + S.sTab : ''), ucet: 'Můj účet' }[S.view] || S.view)) });

function odhlas() { S.session = ''; S.ja = null; sessionStorage.removeItem('kp_session'); render(); }

/* ================= hlavička ================= */
function hlavicka() {
  if (!S.ja) { $('top').innerHTML = `<img src="/icons/icon.svg" alt="" width="40" height="40" style="border-radius:12px"><div class="ttl"><h1>Karta pacienta</h1><div class="meta">Centrální aplikace</div></div>${KP.tlacitkaHlavicky()}`; return; }
  // 0.11.68: hlavička ve stylu portálu PéčeDoma – logo, Made with, verze, štítek, popis, vpravo uživatel, role, ikony, Odhlásit
  $('top').innerHTML = `<div class="logo" title="Karta pacienta on-line">Karta<span>Pacienta</span></div>
    <div class="madefor"><b>Made with</b><span>CLB Zlín${S.nazevSite ? ' · ' + esc(S.nazevSite) : ''}</span></div>
    <span class="ver" title="Verze aplikace">v ${esc(S.verze || '')}</span>
    <span class="live">ON-LINE · centrální aplikace</span>
    <div class="topmeta noprint">garant a tým kolem pacienta</div>
    <div class="rolebox noprint"><span class="uziv" title="${esc(S.ja.poskytovatel)}">👤 ${esc(S.ja.jmeno)}</span><span class="rolesel" title="${esc(S.ja.poskytovatel)}">${S.ja.role.map((r) => ROLE_NAZ[r]).join(', ')}</span>${KP.tlacitkaHlavicky()}<button class="btn sm" id="odhl">Odhlásit</button></div>`;
  $('odhl').onclick = odhlas;
}
function nav() {
  // 0.11.52: ikony agend (emotikona je značka, kp-ikony.js ji vykreslí jako SVG – stejně jako v PéčeDoma)
  const pol = [['pacienti', '🪪 Pacienti'], ...(jeLekar() ? [['novy', '➕ Nový pacient']] : []), ...(S.ja.role.some((r) => r !== 'ctenar') ? [['lide', '👥 Lidé a týmy']] : []), ...(jeAdmin() ? [['sprava', '⚙️ Správa organizace']] : []), ['ucet', '👤 Můj účet']];
  return `<div class="nav noprint">${pol.map(([k, n]) => `<button data-v="${k}" class="${S.view === k || (k === 'pacienti' && S.view === 'detail') ? 'on' : ''}">${n}</button>`).join('')}</div>`;
}
function bindNav() { document.querySelectorAll('.nav button').forEach((b) => (b.onclick = () => { if ($('np_panel')) $('np_panel').remove(); S.view = b.dataset.v; if (b.dataset.v === 'pacienti') S.pacView = 'dash';   /* 0.11.90: menu Pacienti = přehled */ if (b.dataset.v === 'novy') S.wiz = null; render(); window.scrollTo(0, 0); })); }

/* 0.11.58: popisky sloupců pro mobil – buňkám doplní data-l z hlavičky tabulky (CSS je ukáže jen do 640 px); běží po každém překreslení */
function oznacTabulky() {
  document.querySelectorAll('table.tbl:not([data-l-ok])').forEach((t) => {
    t.dataset.lOk = '1';
    const hl = t.tHead ? [...t.tHead.rows[0].cells].map((c) => c.textContent.trim().replace(/\s+/g, ' ')) : [];
    if (!hl.length) return;
    [...t.tBodies].forEach((tb) => [...tb.rows].forEach((r) => [...r.cells].forEach((c, i) => { if (!c.hasAttribute('colspan') && hl[i] != null) c.dataset.l = hl[i].length > 28 ? '' : hl[i]; })));
  });
}
new MutationObserver(() => oznacTabulky()).observe(document.documentElement, { childList: true, subtree: true });

/* ================= přihlášení ================= */
async function render() {
  if (!S.session) return renderLogin();
  if (!S.ja) {
    try { const d = await C('/ja'); S.ja = d.ja; S.nazevSite = d.nazevSite; S.smsPacientVychozi = d.smsPacientVychozi || ''; S.verze = d.verze; S.ai = d.ai; S.interval = d.nastaveni.intervalRevize; S.verejna = d.verejnaAdresa; S.pecedoma = d.pecedoma || {}; } catch (e) { return; }
    try { S.posk = (await C('/poskytovatele')).poskytovatele; } catch { S.posk = []; }
  }
  hlavicka();
  videoGlobalPoll();
  if (S.ja.musiZmenitHeslo) return renderUcet(true);
  ({ pacienti: renderPacienti, detail: renderDetail, novy: renderNovy, lide: renderLide, sprava: renderSprava, ucet: () => renderUcet(false) }[S.view] || renderPacienti)();
}

function renderLogin() {
  hlavicka();
  $('work').innerHTML = `<div class="login"><div class="panel">
    <h2>Přihlášení</h2>
    ${S.tenant ? `<div class="note">Organizace: <span class="mono">${esc(S.tenant)}</span> · <a href="#" id="jinaOrg">jiná organizace</a></div>` : `<div class="field"><label>Kód organizace</label><input id="l_t" placeholder="16 znaků z odkazu, který jste dostali" autocapitalize="characters"></div>`}
    <div class="field"><label>Přihlašovací jméno</label><input id="l_l" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label>Heslo</label><div class="oko-obal"><input id="l_h" type="password" autocomplete="current-password"><button type="button" class="oko" onclick="hesloOko(this)" title="Zobrazit heslo" aria-label="Zobrazit heslo" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <button class="btn primary ulozit" id="l_ok">Přihlásit</button>
    <div class="footer">Karta pacienta · data v PeceDomaPlus, přístup podle týmu kolem pacienta</div></div></div>`;
  if ($('jinaOrg')) $('jinaOrg').onclick = (e) => { e.preventDefault(); S.tenant = ''; localStorage.removeItem('kp_tenant'); renderLogin(); };
  const go = async () => {
    const tenant = S.tenant || ($('l_t') && $('l_t').value.trim().toUpperCase());
    try { const d = await api('/api/c/login', { method: 'POST', body: { tenant, login: $('l_l').value, heslo: $('l_h').value } });
      S.tenant = tenant; localStorage.setItem('kp_tenant', tenant); S.session = d.session; sessionStorage.setItem('kp_session', d.session); S.view = 'pacienti'; render();
    } catch (e) { toast(e.message); }
  };
  $('l_ok').onclick = go; $('l_h').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  ($('l_t') || $('l_l')).focus();
}

function renderUcet(povinne) {
  $('work').innerHTML = `${povinne ? '' : nav()}<div class="login" style="margin-top:2vh"><div class="panel">
    <h2>${povinne ? 'Nastavte si vlastní heslo' : 'Můj účet'}</h2>
    ${povinne ? '<div class="banner warn">Přihlásili jste se prvním heslem od správce. Než budete pokračovat, zvolte si vlastní heslo (aspoň 10 znaků).</div>' : `<dl class="kv"><dt>Jméno</dt><dd>${esc(S.ja.jmeno)}</dd><dt>Login</dt><dd>${esc(S.ja.login)}</dd><dt>Pracoviště</dt><dd>${esc(S.ja.poskytovatel)}</dd><dt>Role</dt><dd>${S.ja.role.map((r) => ROLE_NAZ[r]).join(', ')}</dd></dl>`}
    <div class="field"><label>Současné heslo</label><div class="oko-obal"><input type="password" id="h_s" autocomplete="current-password"><button type="button" class="oko" onclick="hesloOko(this)" title="Zobrazit heslo" aria-label="Zobrazit heslo" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <div class="field"><label>Nové heslo</label><div class="oko-obal"><input type="password" id="h_n" autocomplete="new-password"><button type="button" class="oko" onclick="hesloOko(this)" title="Zobrazit heslo" aria-label="Zobrazit heslo" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>

/* ---- globální signalizace (0.11.47): každých 15 s seznam zvonících a probíhajících hovorů, pruh pod hlavičkou v každé agendě, zvonění ---- */
const VIDG = { hovory: [], klic: '', zvonek: null, zvoniOd: 0, okno: null };
function vidTon() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(); const g = ac.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.2; o.connect(g); g.connect(ac.destination); o.start(); o.frequency.setValueAtTime(660, ac.currentTime + 0.3); o.stop(ac.currentTime + 0.6); o.onended = () => ac.close(); } catch { /* bez zvuku */ }
}
function vidZvonit(zap) {
  if (!zap) { if (VIDG.zvonek) { clearInterval(VIDG.zvonek); VIDG.zvonek = null; } return; }
  if (VIDG.zvonek) return;
  VIDG.zvoniOd = Date.now(); vidTon();
  VIDG.zvonek = setInterval(() => { if (Date.now() - VIDG.zvoniOd > 3 * 60e3) vidZvonit(false); else vidTon(); }, 3000);
}

async function videoGlobalPoll() {
  if (!S.session || !S.ja || document.visibilityState !== 'visible') return;
  try {
    const r = await C('/video/aktivni');
    if (!r.server) { if (VIDG.hovory.length) { VIDG.hovory = []; kresliVidGlobal(); } return; }
    const klic = JSON.stringify(r.hovory.map((h) => [h.id, h.stav]));
    const zvoniZTelefonu = r.hovory.some((h) => h.stav === 'ZVONI' && h.zahajil === 'TELEFON');
    const nove = r.hovory.some((h) => h.stav === 'ZVONI' && h.zahajil === 'TELEFON' && !VIDG.hovory.some((x) => x.id === h.id));
    VIDG.hovory = r.hovory;
    // druhá strana hovor ukončila → zavřít okno
    if (VIDG.okno && !r.hovory.some((h) => h.id === VIDG.okno.id)) { zavriOknoHovoruC(); toast('Videohovor byl ukončen'); }
    if (klic !== VIDG.klic) { VIDG.klic = klic; kresliVidGlobal(); }
    if (nove) vidZvonit(true); else if (!zvoniZTelefonu) vidZvonit(false);
  } catch { /* bez připojení */ }
}
setInterval(videoGlobalPoll, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') videoGlobalPoll(); });

/* ---- Linka paliativní podpory (od 0.11.71): registrace čísel karty k lince ambulance – vede PéčeDoma (CLB1 A_MSPPP_LPP) ---- */
async function linkaNacti() {
  const el = $('linkaPanel'); if (!el) return;
  const hlava = (chip) => `<div class="panel-h"><h2>📞 Linka paliativní podpory</h2>${chip}</div>`;
  let r;
  try { r = await C(`/pacient/${S.pacId}/linka`); } catch (e) { el.innerHTML = hlava('<span class="chip warn">nedostupná</span>') + `<div class="note" style="margin:10px 14px">${esc(e.message)}</div>`; return; }
  if (!$('linkaPanel')) return;
  const reg = (r.telefony || []).filter((t) => t.registrovan).length;
  const radky = (r.telefony || []).map((t) => `<tr><td><span class="mono"><b>${esc(t.hezky)}</b></span><div class="lbl">${esc(t.popis)}${t.registrovan && t.datum ? ' · registrováno ' + esc(fmtD(t.datum)) : ''}${t.registrovan && t.typ === 'PECEDOMA' ? ' · z PéčeDoma' : ''}</div></td>
    <td>${!r.dostupne ? '<span class="chip">?</span>' : t.registrovan ? '<span class="chip ok">registrován k lince ✓</span>' : '<span class="chip">neregistrován</span>'}</td>
    <td style="white-space:nowrap;text-align:right">${r.dostupne && r.smi ? (t.registrovan ? `<button class="btn sm" data-linka="${esc(t.telefon)}" data-akt="0">Deaktivovat</button>` : `<button class="btn sm primary" data-linka="${esc(t.telefon)}" data-akt="1">Aktivovat</button>`) : ''}</td></tr>`).join('');
  el.innerHTML = hlava(r.dostupne ? `<span class="chip ${reg ? 'ok' : ''}">${reg} z ${(r.telefony || []).length} registrováno</span>` : '<span class="chip warn">nedostupná</span>') +
    `<div class="tblwrap"><table class="tbl"><tbody>${radky || '<tr><td class="muted">Karta zatím nemá žádné číslo telefonu.</td></tr>'}</tbody></table></div>` +
    `<div class="rolehelp">Registrované číslo se dovolá na linku ambulance (Linka paliativní podpory); po deaktivaci se nedovolá. Registrace se zapisuje do PéčeDoma – stejný seznam jako filtr 📞 Linka v Klientech. ${r.dostupne ? (r.smi ? '' : 'Registraci mění lékař nebo garant.') : esc(r.duvod || '')}</div>`;
  el.querySelectorAll('[data-linka]').forEach((b) => (b.onclick = async () => {
    const akt = b.dataset.akt === '1', t = (r.telefony || []).find((x) => x.telefon === b.dataset.linka) || {};
    if (!(await KP.confirm(akt ? 'Registrovat k lince' : 'Zrušit registraci k lince', akt ? `Číslo <b>${esc(t.hezky)}</b> (${esc(t.popis)}) se zaregistruje k Lince paliativní podpory a dovolá se na linku ambulance.` : `Číslo <b>${esc(t.hezky)}</b> se z linky odregistruje a na linku ambulance se už nedovolá.`, akt ? 'Aktivovat' : 'Deaktivovat', !akt))) return;
    b.disabled = true;
    try { await C(`/pacient/${S.pacId}/linka`, { method: 'POST', body: { telefon: t.telefon, aktivni: akt } }); toast(akt ? 'Telefon registrován k lince' : 'Registrace k lince zrušena'); } catch (e) { toast(e.message); }
    linkaNacti();
  }));
}

/* vlastní telefon pacienta – kód jen pro jeho číslo; SMS s odkazem, nebo QR kód v ordinaci */
function pacientoviOkno(tel = '', stitek = '') {
  modal(`<h2>Zpřístupnit průkaz v telefonu pacienta nebo rodiny</h2>
    <p class="muted" style="margin:0">Aplikace <b>Můj průkaz</b> (${esc(S.verejna)}/pacient/) ukáže plán, kontakty, tým a předepsané léky se záznamem podání. Průkaz jde zpřístupnit ve více telefonech – pacientovi i blízkým, každému zvlášť. Kód půjde použít jen s tímto číslem a platí 3 dny.</p>
    <div class="frow"><div class="field"><label>Mobil</label><input id="pz_t" type="tel" value="${esc(tel)}" placeholder="+420 777 123 456"></div><div class="field"><label>Komu (ukáže se v přehledu)</label><input id="pz_s" value="${esc(stitek || 'telefon pacienta')}" placeholder="např. dcera Jana" maxlength="60"></div></div>
    <div class="field"><label>Text SMS pro pacienta</label><textarea id="pz_txt" style="min-height:96px">${esc(localStorage.getItem('kp_sms_pacient') || S.smsPacientVychozi || 'Můj průkaz: lékař vám zpřístupnil váš paliativní průkaz. Otevřete odkaz v tomto telefonu: {odkaz} (platí 3 dny)')}</textarea><span class="hint"><b>{odkaz}</b> se nahradí odkazem pro telefon pacienta (když ho smažete, přidá se na konec). <span id="pz_len"></span> <button type="button" class="btn sm" id="pz_vychozi" style="height:26px;min-height:26px;font-size:12px;margin-left:6px">Původní text</button></span></div>
    <div class="quick"><button class="btn primary" id="pz_sms"${S.pac.smsDostupne ? '' : ' disabled'}>Poslat SMS</button><button class="btn" id="pz_qr">Zobrazit QR kód (v ordinaci)</button><button class="btn" data-close>Zpět</button></div>
    ${S.pac.smsDostupne ? '' : '<div class="note">SMS teď nejde odeslat – použijte QR kód.</div>'}`, () => {
    $('pz_t').focus();
    const delka = () => { const t = $('pz_txt').value.replace('{odkaz}', 'x'.repeat(70)); const n = t.length, dia = /[^\x00-\x7F]/.test(t); const na = dia ? 70 : 160, na2 = dia ? 67 : 153; $('pz_len').textContent = `${n} znaků s odkazem ≈ ${n <= na ? 1 : Math.ceil(n / na2)} SMS`; };
    $('pz_txt').oninput = delka; delka();
    $('pz_vychozi').onclick = () => { $('pz_txt').value = S.smsPacientVychozi; localStorage.removeItem('kp_sms_pacient'); delka(); };
    const go = async (sms) => {
      const telefon = $('pz_t').value, textSms = $('pz_txt').value.trim();
      if (sms) { if (textSms && textSms !== S.smsPacientVychozi) localStorage.setItem('kp_sms_pacient', textSms); else localStorage.removeItem('kp_sms_pacient'); }
      try {
        const r = await C(`/pacient/${S.pacId}/pacientovi`, { method: 'POST', body: { telefon, sms, text: sms ? textSms : undefined, stitek: $('pz_s').value.trim() } });
        const smsOk = r.sms && r.sms.ok;
        const qr = qrcode(0, 'M'); qr.addData(r.odkaz); qr.make();
        modal(`<h2>Průkaz pro telefon pacienta</h2>
          <div class="banner ${smsOk ? 'ok' : 'warn'}" style="margin-bottom:10px">${smsOk ? `Odkaz byl odeslán SMS na <b>${esc(r.telefon)}</b> (${esc(r.stitek || 'telefon pacienta')}). Příjemce ho otevře ve svém telefonu, potvrdí číslo a nastaví si vlastní PIN.${r.sms.text ? `<div class="lbl" style="margin-top:6px;white-space:pre-wrap">Odesláno: ${esc(r.sms.text)}</div>` : ''}` : `Kód půjde použít jen s číslem <b>${esc(r.telefon)}</b>.`}</div>
          ${r.sms && !r.sms.ok ? `<div class="banner crit" style="margin-bottom:10px">${esc(r.sms.chyba)}</div>` : ''}
          <div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div>
          <p>Pacient QR kód načte fotoaparátem telefonu, nebo otevře <b>${esc(S.verejna)}/pacient/</b> a zadá:</p>
          <div class="frow"><div class="field"><label>Kód organizace</label><div class="secret" style="font-size:15px">${esc(r.tenant)}</div></div><div class="field"><label>Kód od lékaře</label><div class="secret">${esc(r.kod.slice(0, 4))} ${esc(r.kod.slice(4))}</div></div></div>
          <p class="muted">Platí do ${esc(new Date(r.platnost).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }))} ; ve stejném telefonu ho jde během platnosti použít znovu (třeba po přidání aplikace na plochu). Na novém telefonu vydejte nový kód – předchozí telefon pacienta tím přestane dostávat data.</p>
          <div class="quick"><button class="btn" id="pz_hot">Hotovo</button></div>`, () => { $('pz_hot').onclick = async () => { closeModal(); await nactiDetail(); kresliDetail(); }; });
      } catch (e) { toast(e.message); }
    };
    $('pz_sms').onclick = () => go(true);
    $('pz_qr').onclick = () => go(false);
  });
}

    const smsOk = r.sms && r.sms.ok;
    const qr = qrcode(0, 'M'); qr.addData(r.odkaz); qr.make();
    modal(`<h2>Spárovat telefon u pacienta</h2>
      <div class="banner ${smsOk ? 'ok' : 'warn'}" style="margin-bottom:10px">${smsOk ? `Odkaz na spárování byl odeslán SMS na <b>${esc(r.telefonKarty)}</b>. Na tom telefonu ho otevřete a potvrďte číslo.` : `Karta jde nahrát jen do telefonu s číslem <b>${esc(r.telefonKarty)}</b> – telefon při spárování zadá své číslo.`}</div>
      ${r.sms && !r.sms.ok ? `<div class="banner crit" style="margin-bottom:10px">${esc(r.sms.chyba)}</div>` : ''}

      <div class="quick" style="margin-bottom:8px"><button class="btn ${smsOk ? '' : 'primary'}" id="pr_sms"${r.smsDostupne ? '' : ' disabled'}>${smsOk ? 'Poslat SMS znovu' : 'Poslat odkaz SMS na ' + esc(r.telefonKarty)}</button>${r.smsDostupne ? '' : `<span class="muted" style="font-size:13px">SMS teď nejde – ${esc(r.smsDuvod || 'není nastavená')}</span>`}</div>
      <div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div>

      <div class="frow"><div class="field"><label>Kód organizace</label><div class="secret" style="font-size:15px">${esc(r.tenant)}</div></div><div class="field"><label>Párovací kód</label><div class="secret">${esc(r.kod.slice(0, 4))} ${esc(r.kod.slice(4))}</div></div></div>

      <p class="muted">Kód platí do ${esc(new Date(r.platnost).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }))}; pro tisk do terénu zvolte delší platnost (kód pak platí, dokud ho sestra u pacienta nepoužije). Ve stejném telefonu ho jde během platnosti použít znovu (třeba po přidání aplikace na plochu iPhonu). Po spárování se případný předchozí telefon tohoto pacienta zablokuje; průkazy jiných pacientů v témže telefonu zůstávají.</p>
      <div class="quick"><button class="btn" id="pr_hot">Hotovo</button></div>`, () => { $('pr_hot').onclick = async () => { closeModal(); await nactiDetail(); kresliDetail(); }; $('pr_sms').onclick = () => { const h = Number($('pr_plat').value); closeModal(); parovat(true, h); };

const kontRow = (k, i) => `<div class="kontrow"><input data-k="j" value="${esc(k.jmeno)}" placeholder="jméno, vztah"><input data-k="t" value="${esc(k.tel)}" placeholder="telefon"><select data-k="s">${['ROZHODUJE', 'INFORMOVAT', 'PECUJE'].map((s) => `<option value="${s}" ${k.skupina === s ? 'selected' : ''}>${s.toLowerCase()}</option>`).join('')}</select><button class="btn sm" data-kx="${i}" aria-label="Odebrat">×</button></div>`;

async function ocr(f) {
  if (!f) return;
  const st = $('w_ocr'); st.textContent = 'Načítám rozpoznávání textu (poprvé ~10 s)…';
  try {
    if (!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const r = await Tesseract.recognize(f, 'ces', { logger: (m) => { if (m.status === 'recognizing text') st.textContent = `Rozpoznávám text v prohlížeči… ${Math.round(m.progress * 100)} %`; } });
    $('w_t').value = r.data.text; st.textContent = 'Text rozpoznán – zkontrolujte ho a spusťte rozbor.';
  } catch (e) { st.textContent = 'Rozpoznání se nezdařilo – vložte text ručně.'; }
}

/* ================= lidé a týmy pracovišť ================= */
// lidé se zapíší jednou (ručně, CSV, PéčeDoma) a k pacientovi se jen přiřazují; osobní PIN platí u všech jejich pacientů
const ROLE_OS = { LEKAR: 'lékař', PL: 'praktický lékař', HOSPIC: 'hospic', SESTRA: 'sestra DPS' };
const bezDia = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const smiLidi = (psId) => jeAdmin() || (psId === S.ja.poskytovatelId && S.ja.role.some((r) => r !== 'ctenar'));
/** role z textu (CSV, PéčeDoma) podle typu pracoviště – stejná pravidla jako server (src/kp.js roleOsoby) */
function roleZTextu(v, typ) {
  const kod = String(v || '').trim(); if (/^[A-Z]+$/.test(kod) && ROLE_OS[kod]) return kod;
  const t = bezDia(v);
  if (/prakt|\bpl\b/.test(t)) return 'PL';
  if (/lekar|doktor|mudr|doctor/.test(t)) return typ === 'PL' ? 'PL' : 'LEKAR';
  if (/dps|domov/.test(t)) return 'SESTRA';
  if (/sestr|pecovat|pecuj|casemanager|nurse|hospic|zdravot/.test(t)) return typ === 'DOMOV' ? 'SESTRA' : 'HOSPIC';
  return '';
}
const tymNazev = (t) => t;   // od 0.10.0 se tým jmenuje tak, jak je založený
const seskup = (pole, klic) => pole.reduce((m, x) => { const k = klic(x); (m.get(k) || m.set(k, []).get(k)).push(x); return m; }, new Map());

    <div class="note">Role určuje, co člověk na kartě uvidí a zapíše: lékař a praktický lékař vše včetně návštěv lékaře, hospic a sestra DPS stav, SOS léky a zhoršení. ${o.id ? '' : 'Po uložení se zobrazí osobní PIN – jen jednou.'}</div></div>`, () => {

    $('os_ok').onclick = async () => {
      const b = telo();
      try { const r = await C('/osoba', { method: 'POST', body: b }); closeModal(); toast('Uloženo');
        await renderLide(); if (r.pin) pinyOkno([{ ...b, pin: r.pin, sms: r.sms }]); } catch (e) { toast(e.message); }
    };
    if ($('os_pd')) $('os_pd').onclick = () => { closeModal(); aktualizovatZPd({ osobaId: o.id }); };
    if ($('os_zpin')) $('os_zpin').onclick = async () => {
      try { const sms = !!($('os_sms') && $('os_sms').checked); const r = await C(`/osoba/${o.id}/pin/zobrazit`, { method: 'POST', body: { sms } }); pinyOkno([{ ...o, pin: r.pin, sms: r.sms }]); }
      catch (e) { if (e.status === 409 && await KP.confirm('PIN nejde zobrazit', `${esc(e.message)}<br><br>Vydat ${esc(o.jmeno)} nový PIN teď?`, 'Vydat nový PIN')) $('os_pin').click(); else if (e.status !== 409) toast(e.message); }
    };
    if ($('os_pin')) $('os_pin').onclick = async () => {
      if (!(await KP.confirm('Nový osobní PIN', `Dosavadní PIN ${esc(o.jmeno)} přestane platit na všech telefonech (při jejich synchronizaci).`, 'Vydat nový PIN'))) return;
      try { const sms = !!($('os_sms') && $('os_sms').checked); const r = await C(`/osoba/${o.id}/pin`, { method: 'POST', body: { sms } }); await renderLide(); pinyOkno([{ ...o, pin: r.pin, sms: r.sms }]); } catch (e) { toast(e.message); }
    };
  });
}

function ctiCsv(t) {

  const spravuji = S.posk.filter((p) => p.aktivni && smiLidi(p.id));
  let ps = spravuji.find((p) => String(p.id) === S.lideFiltr) || spravuji.find((p) => p.id === S.ja.poskytovatelId) || spravuji[0];
  const kresli = () => {
    const role = radky.map((r) => roleZTextu(r.role, ps.typ));
    modal(`<h2>${zdroj === 'PECEDOMA' ? 'Načíst tým z PéčeDoma' : 'Načíst lidi ze souboru CSV'}</h2>
      <div class="frow"><div class="field"><label>Do pracoviště</label><select id="im_p">${spravuji.map((p) => `<option value="${p.id}" ${p.id === ps.id ? 'selected' : ''}>${esc(p.nazev)}</option>`).join('')}</select></div>
        <div class="field"><label>Tým pro ty, kdo ho nemají (volitelně)</label><input id="im_t" placeholder="např. Tým Zlín"></div></div>
      <div class="tblwrap" style="max-height:48vh;overflow:auto"><table class="tbl"><thead><tr><th><input type="checkbox" id="im_vse" checked></th><th>Jméno</th><th>Role na kartě</th><th>Tým</th><th>Telefon</th></tr></thead><tbody>
        ${radky.map((r, i) => `<tr><td><input type="checkbox" data-im="${i}" ${role[i] && !r.nacteno ? 'checked' : ''}></td><td><b>${esc(r.jmeno)}</b>${r.nacteno ? ' <span class="chip">už načten</span>' : ''}${r.role ? `<div class="lbl">${esc(r.role)}</div>` : ''}</td>
          <td><select data-imr="${i}"><option value="">—</option>${Object.entries(ROLE_OS).map(([k, n]) => `<option value="${k}" ${role[i] === k ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
          <td><input data-imt="${i}" value="${esc(r.tym || '')}" style="min-width:110px"></td><td class="mono" style="font-size:13px">${esc(r.telefon || '')}</td></tr>`).join('')}</tbody></table></div>
      ${S.smsLide ? '<label class="row"><input type="checkbox" id="im_sms"> novým lidem poslat osobní PIN SMS (kdo má telefon)</label>' : ''}
      <div class="quick"><button class="btn primary ulozit" id="im_ok">Načíst vybrané</button><button class="btn" data-close>Zrušit</button></div>
      <div class="note">${zdroj === 'PECEDOMA' ? 'Tým PéčeDoma = uživatelé portálu PéčeDoma této organizace. Správci a monitor bez další role nejsou předvybraní. ' : ''}Kdo už v pracovišti je (stejné jméno), jen se aktualizuje a PIN mu zůstane. Novým lidem se vydá osobní PIN – zobrazí se po načtení.</div>`, (m) => {
      m.querySelector('.box').style.maxWidth = '880px';
      $('im_p').onchange = () => { ps = spravuji.find((p) => p.id === Number($('im_p').value)); kresli(); };
      $('im_vse').onchange = () => document.querySelectorAll('[data-im]').forEach((c) => (c.checked = $('im_vse').checked));
      $('im_ok').onclick = async () => {
        const vyber = [...document.querySelectorAll('[data-im]:checked')].map((c) => Number(c.dataset.im));
        const vychozi = $('im_t').value.trim();
        const data = vyber.map((i) => ({ jmeno: radky[i].jmeno, role: document.querySelector(`[data-imr="${i}"]`).value, tym: document.querySelector(`[data-imt="${i}"]`).value.trim() || vychozi, telefon: radky[i].telefon || '', email: radky[i].email || '', externiId: radky[i].externiId || '' }));
        if (!data.length) return toast('Vyberte aspoň jednoho člověka');
        const bezRole = data.find((x) => !x.role); if (bezRole) return toast(`${bezRole.jmeno}: vyberte roli na kartě`);
        $('im_ok').disabled = true; $('im_ok').textContent = 'Načítám…';
        try { const r = await C('/lide/import', { method: 'POST', body: { poskytovatelId: ps.id, zdroj, radky: data, sms: !!($('im_sms') && $('im_sms').checked) } });
          closeModal(); toast(`Přidáno ${r.pridano}, aktualizováno ${r.aktualizovano}${r.chyby.length ? `, chyby ${r.chyby.length}` : ''}`); S.lideFiltr = String(ps.id); await renderLide(); pinyOkno(r.piny);
        } catch (e) { toast(e.message); $('im_ok').disabled = false; $('im_ok').textContent = 'Načíst vybrané'; }
      };
    });
  };
  kresli();
}

/* ---- u pacienta: kdo odemkne kartu (lidé z týmů pracovišť v týmu kolem pacienta) ---- */
const smiPriradit = (d, psId) => d.op.garant || d.op.lekar || (d.op.zapis && psId === S.ja.poskytovatelId);
/* týmy lidí u pacienta (0.10.0): tým se vybírá z agendy Lidé a týmy, u pacienta jde člena jen deaktivovat */
function tymyPanel(d) {
  const tymy = d.tymyLidi || [], nabidka = (d.tymyNabidka || []).filter((t) => smiPriradit(d, t.poskytovatelId));
  const skupina = (t) => { const akt = t.clenove.filter((c) => c.aktivni).length, smi = d.op.aktivni && smiPriradit(d, t.poskytovatelId);
    return `<section class="lkskup acc"><div class="lkskup-h"><span>${esc(t.nazev)} · ${esc(t.poskytovatel)}</span><span class="row" style="gap:6px;text-transform:none;letter-spacing:0"><span class="chip">${akt} / ${t.clenove.length}</span>${t.prirazenVzdy ? '<span class="chip ok" title="tým je u každé karty automaticky – nejde odebrat, jen deaktivovat členy (Lidé a týmy → Přiřadit vždy)">přiřazen vždy</span>' : smi ? `<button class="btn sm" data-tlodeb="${t.tymId}">Odebrat tým</button>` : ''}</span></div>
      ${t.clenove.length ? `<table class="tbl"><tbody>${t.clenove.map((c) => `<tr style="${c.aktivni ? '' : 'opacity:.6'}"><td><b>${esc(c.jmeno)}</b><div class="lbl">${esc(ROLE_OS[c.role] || c.role)}${c.poskytovatel ? ' · ' + esc(c.poskytovatel) : ''}${c.maPin ? '' : ' · <span style="color:var(--warn)">nemá PIN</span>'}</div></td>
        <td><span class="chip ${c.aktivni ? 'ok' : ''}">${c.aktivni ? 'aktivní' : 'deaktivován u pacienta'}</span></td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ozpin="${c.osobaId}" title="Ukáže platný osobní PIN tohoto člověka (zapíše se do logu přístupů)">Zobrazit PIN</button> ${smi ? `<button class="btn sm" data-tlcl="${t.tymId}|${c.osobaId}|${c.aktivni ? 0 : 1}">${c.aktivni ? 'Deaktivovat' : 'Aktivovat'}</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="lkskup-p">tým zatím nemá členy – doplňte je v agendě Lidé a týmy</div>'}</section>`; };
  return `<div class="panel"><div class="panel-h"><h2>Týmy u pacienta</h2><span class="chip ${tymy.length ? 'ok' : 'warn'}">${tymy.length}</span></div>
    ${tymy.map(skupina).join('') || '<div class="note" style="margin:12px 14px">Zatím žádný tým. Vyberte tým z agendy Lidé a týmy – jeho členové odemknou kartu svým osobním PINem.</div>'}
    ${d.op.aktivni && nabidka.length ? `<div class="form" style="padding:12px 14px"><div class="field"><label>Přidat tým (z agendy Lidé a týmy)</label><select id="tl_sel">${nabidka.map((t) => `<option value="${t.id}">${esc(t.nazev)} · ${esc(t.poskytovatel)} (${t.clenu} ${t.clenu === 1 ? 'člen' : t.clenu < 5 ? 'členové' : 'členů'})${(t.mimoTym || []).length ? ' – do týmu kolem pacienta se přidá: ' + esc(t.mimoTym.join(', ')) : ''}</option>`).join('')}</select></div><button class="btn primary" id="tl_ok">Přidat tým</button></div>` : ''}
    <div class="note">Týmy definuje garant v agendě <b>Lidé a týmy</b> (mohou v nich být i lidé jiných pracovišť – sestra domova, praktik). Tady tým vyberete; kdo z něj u tohoto pacienta kartu odemykat nemá, toho <b>deaktivujete</b>. Kdo do týmu přibude, dostane přístup sám. Telefon změny převezme při nejbližší synchronizaci.</div></div>`;
}
function lidePanel(d) {
  const zTymu = (d.tymyLidi || []).flatMap((t) => t.clenove.filter((c) => c.aktivni).map((c) => ({ ...c, tym: t.nazev, poskytovatel: t.poskytovatel })));
  const jednotlive = (d.lide || []).filter((o) => !o.tymId);
  // 0.11.32: Zobrazit PIN přímo tady (stejná akce jako v Lidé a týmy – PIN ukáže pracoviště člověka nebo správce, zapíše se do logu)
  const radek = (o, akce) => `<tr><td><b>${esc(o.jmeno)}</b><div class="lbl">${esc(ROLE_OS[o.role] || o.role)} · ${esc(o.tym || o.poskytovatel)}${o.maPin ? '' : ' · <span style="color:var(--warn)">nemá PIN</span>'}</div></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ozpin="${o.osobaId}" title="Ukáže platný osobní PIN tohoto člověka (zapíše se do logu přístupů)">Zobrazit PIN</button>${akce ? ' ' + akce : ''}</td></tr>`;
  return `<div class="panel"><div class="panel-h"><h2>Lidé, kteří odemknou kartu</h2><span class="chip ${zTymu.length + jednotlive.length ? 'ok' : 'warn'}">${zTymu.length + jednotlive.length}</span></div>
    ${zTymu.length || jednotlive.length ? `<div class="tblwrap"><table class="tbl"><tbody>${zTymu.map((o) => radek(o, '')).join('')}
      ${jednotlive.length ? `<tr><td colspan="2" style="background:var(--surface-2);font-weight:600;font-size:13px">Přiřazení jednotlivě (před zavedením týmů)</td></tr>${jednotlive.map((o) => radek(o, smiPriradit(d, o.poskytovatelId) ? `<button class="btn sm" data-lodeb="${o.osobaId}">Odebrat</button>` : '')).join('')}` : ''}</tbody></table></div>` : '<div class="note" style="margin:12px 14px">Zatím nikdo. Přidejte tým v záložce Tým a garance.</div>'}
    <div class="note">Lidé se přiřazují po týmech v záložce <b>Tým a garance → Týmy u pacienta</b>; lidi samotné spravuje agenda Lidé a týmy.</div></div>`;
}

  const { audit, ai } = await C('/audit');
  $('sbody').innerHTML = `<div class="grid2 l"><div class="panel"><div class="panel-h"><h2>Log přístupů</h2>${hledatHTML('audit', 'Hledat v logu…')}</div><div class="tblwrap"><table class="tbl"><tbody>${audit.map((a) => `<tr><td class="mono" style="font-size:12px;white-space:nowrap">${esc(a.cas)}</td><td>${esc(a.kdo || '')}</td><td class="mono">${esc(a.pacient || '')}</td><td>${esc(a.akce)}${a.detail ? `<div class="lbl">${esc(a.detail)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel" style="align-self:start"><div class="panel-h"><h2>Dotazy na AI (bez obsahu)</h2></div><div class="tblwrap"><table class="tbl"><tbody>${ai.map((a) => `<tr><td class="mono" style="font-size:12px">${esc(a.cas)}</td><td>${esc(a.ucel)}<div class="lbl">${a.delka} znaků · ${a.nahrad} údajů anonymizováno${a.model ? ' · ' + esc(a.model) : ''}</div></td><td><span class="chip ${a.vysledek === 'BLOK' ? 'crit' : 'ok'}">${esc(a.vysledek || '')}</span></td></tr>`).join('') || '<tr><td class="muted">Zatím žádné.</td></tr>'}</tbody></table></div></div></div>`;
  bindHledani('audit', '#sbody .panel:first-child tbody tr');
}
async function spravaNast() {
  $('sbody').innerHTML = `<div class="panel" style="max-width:560px"><div class="form" style="padding:14px">
    <div class="field"><label>Název sítě (hlavička aplikace)</label><input id="ns_n" value="${esc(S.nazevSite || '')}"></div>
    <div class="field"><label>Výchozí interval revize plánu (měsíce)</label><input id="ns_i" type="number" min="1" max="12" value="${esc(S.interval || 3)}"></div>
    <div class="field"><label>Odkaz pro přihlášení uživatelů</label><div class="secret" style="font-size:13px;letter-spacing:0">${esc(location.origin)}/centrala/?t=${esc(S.tenant)}</div></div>
    <button class="btn primary ulozit" id="ns_ok">Uložit</button></div></div>
    ${(() => { const pd = S.pecedoma || {}; return `<div class="panel" style="max-width:560px"><div class="panel-h"><h2>Propojení s PéčeDoma</h2>${pd.nastaveno ? '<span class="chip ok">nastaveno</span>' : '<span class="chip warn">nenastaveno</span>'}</div><div class="form" style="padding:14px">
    <div class="field"><label>Odkaz na portál PéčeDoma vaší organizace</label><input id="pd_o" value="${esc(pd.odkaz || '')}" placeholder="https://web-pecedoma.netlify.app/?iv=…&data=…&tag=…"><span class="hint">Ukazuje se u pacienta (záložka Detail pacienta) – otevře PéčeDoma, kde je klient.</span></div>
    <div class="field"><label>Portál organizace</label><select id="pd_p"><option value=""${pd.portal === 'plus' ? '' : ' selected'}>PéčeDoma (Centrum pro léčbu bolesti)</option><option value="plus"${pd.portal === 'plus' ? ' selected' : ''}>PéčeDoma Plus (organizace se stejným tenantem)</option></select><span class="hint">PéčeDoma Plus: Karta volá aplikaci pecedomaplus-karta a posílá tenant této organizace – klienti, léky, chat a záznamy z Mého průkazu jsou z dat organizace v PéčeDoma Plus.</span></div>
    <div class="field"><label>Server PéčeDoma (jhn-apps)</label><input id="pd_a" value="${esc(pd.api || pd.apiVychozi || '')}"></div>
    <div class="field"><label>Token aplikace PéčeDoma${pd.tokenNastaven ? ' (vyplněn – nechte prázdné, nebo zadejte nový)' : ''}</label><input id="pd_t" type="password" autocomplete="off" placeholder="${pd.tokenNastaven ? '••••••••' : 'FAMICURA_REPORTY_TOKEN z nastavení serveru PéčeDoma'}"><span class="hint">Stejný token, kterým portál PéčeDoma volá svůj server. Do prohlížeče se zpět neposílá.</span></div>
    <label class="lbl" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pd_s" ${pd.sync ? 'checked' : ''}> Synchronizovat automaticky (léky a nejbližší návštěva propojených pacientů, každých 30 minut)</label>
    ${pd.partnerKlic ? '' : '<div class="banner warn">Na serveru chybí KP_PARTNER_KLIC – spusťte nasazení deploy/vps-deploy.sh.</div>'}
    <button class="btn primary ulozit" id="pd_ok">Uložit propojení</button>
    <div class="note">Co se přebírá z PéčeDoma: při založení pacienta údaje, diagnózy, léky, funkční stav a kontakty (výběr klienta v průvodci Nový pacient); u propojeného pacienta pak průběžně <b>aktivní léky</b> a <b>nejbližší plánovaná návštěva</b> (kalendář FK). Plán péče se tím nemění – léky lékař převezme do nové verze plánu v záložce Plán péče.</div></div></div>`; })()}`;
  $('ns_ok').onclick = async () => { try { await C('/nastaveni', { method: 'POST', body: { nazevSite: $('ns_n').value, intervalRevize: $('ns_i').value } }); S.nazevSite = $('ns_n').value; S.interval = Number($('ns_i').value); hlavicka(); toast('Uloženo'); } catch (e) { toast(e.message); } };
  $('pd_ok').onclick = async () => {
    try {
      await C('/nastaveni', { method: 'POST', body: { pdOdkaz: $('pd_o').value, pdPortal: $('pd_p').value, pdApi: $('pd_a').value, pdToken: $('pd_t').value, pdSync: $('pd_s').checked } });
      const d = await C('/ja'); S.pecedoma = d.pecedoma || {}; toast('Propojení uloženo'); spravaNast();
    } catch (e) { toast(e.message); }
  };
}

render();
</script>
</body>
</html>
