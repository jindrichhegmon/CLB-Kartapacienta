try { var _v = localStorage.getItem('kp_vzhled'); if (_v === 'tmava') document.documentElement.setAttribute('data-theme', 'dark'); else if (_v && _v !== 'modra' && /^[a-z]+$/.test(_v)) { document.documentElement.setAttribute('data-theme', 'light'); document.documentElement.setAttribute('data-skin', _v); } } catch (e) {}</script>

<script>
/*
 * Karta pacienta na mobilu – šifrovaná offline kopie průkazu.
 *  - data v IndexedDB, zašifrovaná AES-GCM klíčem, který z prohlížeče nejde vyexportovat
 *  - krizová karta bez přihlášení (ZZS), pečující PINem, lékař kódem z centrální aplikace (obojí ověřeno offline)
 *  - zápisy bez signálu čekají ve frontě, odešlou se při nejbližším připojení; plán jen ze serveru
 */
const APP_VERZE = 'karta-0.9.3';
const { esc, toast, modal, closeModal, fmtD, fmtDT, CILE } = KP;
const $ = (id) => document.getElementById(id);
let D = null;                 // { tenant, token, tajemstvi, zarizeniId, balik, fronta[], posledniSync, parovano }
let U = { role: null, jmeno: '', posledni: 0 };   // odemčení (jen v paměti)
let instalace = null;   // Android/Chrome: nabídka „Přidat na plochu“ (beforeinstallprompt); iPhone má v Safari vlastní návod
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); instalace = e; const b = $('p_inst'); if (b) b.style.display = ''; });
let tab = 'karta', syncBezi = false, chybaSync = '';
const TAB_NAZ = { karta: 'Karta', plan: 'Plán', denik: 'Deník', zhorseni: 'Zhoršení', kontakty: 'Kontakty', udaje: 'Tým' };
KP.napoveda.nastav({ aplikace: 'karta', auth: () => (D ? { token: D.token, typ: 'Device' } : null), kapitola: () => (D ? 14 : 13),
  obrazovka: () => (!D ? 'Spárování telefonu' : !U.role ? 'Zamčená krizová karta' : `${TAB_NAZ[tab] || tab} (odemčeno jako ${U.role})`) });

/* ---------------- šifrované úložiště ---------------- */
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => { const r = indexedDB.open('kp-karta', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this.db;
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async clear() { const db = await this.open(); return new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = () => res(); }); },
};
let pametOnly = false;
async function klic() {
  let k = await IDB.get('klic');
  if (!k) { k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); await IDB.set('klic', k); }
  return k;
}
async function uloz() {
  if (pametOnly || !D) return;
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await klic(), new TextEncoder().encode(JSON.stringify(D)));
    await IDB.set('data', { iv, ct });
  } catch (e) { pametOnly = true; toast('Úložiště telefonu není dostupné – data jsou jen do zavření'); }
}
async function nacti() {
  try { const r = await IDB.get('data'); if (!r) return null; const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: r.iv }, await klic(), r.ct); return JSON.parse(new TextDecoder().decode(pt)); }
  catch (e) { pametOnly = !window.indexedDB; return null; }
}
async function vymaz() { try { await IDB.clear(); } catch { /* */ } D = null; U = { role: null }; }

/* ---------------- ověření PIN a kódu lékaře (offline) ---------------- */
const hex2buf = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
const buf2hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
async function overPin(pin) {
  for (const p of (D.balik.piny || [])) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hex2buf(p.salt), iterations: p.iterace }, k, 256);
    if (buf2hex(bits) === p.hash) return p;
  }
  return null;
}
/* kód lékaře = kód dne: HMAC-SHA256(tajemství telefonu, "kod-dne:RRRR-MM-DD") → 6 číslic; stejný výpočet jako server (src/crypto.js kodDne).
   Celý den stejný – lékař ho najde v centrální aplikaci i v PéčeDoma; kolem půlnoci platí i kód předchozího dne. */
async function kodDne(datum) {
  const k = await crypto.subtle.importKey('raw', hex2buf(D.tajemstvi), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode('kod-dne:' + datum)));
  return String((((h[0] & 127) << 24) | (h[1] << 16) | (h[2] << 8) | h[3]) % 1000000).padStart(6, '0');
}
const datumLokalni = (posunDni = 0) => { const d = new Date(); d.setDate(d.getDate() + posunDni); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
async function overKodLekare(kod) {
  if (!D.tajemstvi) return false;
  for (const d of [0, -1]) if (await kodDne(datumLokalni(d)) === kod) return true;
  return false;
}

/* ---------------- synchronizace ---------------- */
async function sync({ tichy = true } = {}) {
  if (!D || !D.token || syncBezi) return;
  if (!navigator.onLine) { chybaSync = 'bez připojení'; kresli(); return; }
  syncBezi = true; kresliSyncBar();
  try {
    let baterie = null; try { if (navigator.getBattery) baterie = Math.round((await navigator.getBattery()).level * 100); } catch { /* */ }
    const r = await KP.api('/api/d/sync', { method: 'POST', token: D.token, typ: 'Device', body: { fronta: D.fronta, verzePlanu: D.balik && D.balik.plan && D.balik.plan.verze, baterie, verzeAplikace: APP_VERZE } });
    if (r.prikaz === 'smazat') { await vymaz(); kresli(); modal('<h2>Průkaz byl z telefonu odstraněn</h2><p>Telefon byl v centrální aplikaci zablokován nebo průkaz uzavřen. Data v telefonu byla vymazána.</p><div class="quick"><button class="btn" data-close>Rozumím</button></div>'); return; }
    const hotovo = new Set([...(r.potvrzeno || []), ...(r.odmitnuto || [])]);
    const novaVerze = r.balik.plan && D.balik.plan && r.balik.plan.verze !== D.balik.plan.verze;
    D.fronta = D.fronta.filter((e) => !hotovo.has(e.uuid));
    D.balik = r.balik; D.posledniSync = new Date().toISOString(); chybaSync = '';
    await uloz();
    if (!tichy) toast('Synchronizováno');
    else if (novaVerze) toast('Plán péče byl aktualizován');
    if ((r.odmitnuto || []).length) toast(`${r.odmitnuto.length} zápis(ů) server nepřijal`);
  } catch (e) {
    chybaSync = e.status === 401 ? 'telefon není spárovaný' : 'server nedostupný';
    if (e.status === 401) { await vymaz(); }
  } finally { syncBezi = false; kresli(); }
}
function pridejZapis(typ, text, role, autor) {
  const e = { uuid: KP.uuid(), typ, text, role, autor, cas: KP.casLokalni(), overeno: role !== 'zzs', cekaNaOdeslani: true };
  D.fronta.push(e);
  uloz(); kresli(); sync();
}

/* ---------------- zamykání ---------------- */
const ZAMEK_MS = 2 * 60 * 1000;
['pointerdown', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, () => { if (U.role) U.posledni = Date.now(); }, { passive: true }));
setInterval(() => { if (U.role && Date.now() - U.posledni > ZAMEK_MS) { zamkni(); toast('Průkaz se zamkl'); } }, 10000);
function zamkni() { U = { role: null }; tab = 'karta'; closeModal(); kresli(); }

/* ---------------- vykreslení ---------------- */
const ROLE_NAZ = { lekar: 'lékař', sestra: 'sestra DPS', rodina: 'rodina', hospic: 'hospic', pl: 'praktický lékař', zzs: 'ZZS' };
/* co která role na kartě smí (jako v demu); typy zápisů odpovídají serveru (src/routes/device.js POVOLENE), zhoršení zapisuje průvodce */
const ROLE_KARTA = {
  lekar: { nazev: 'Lékař', c: 'var(--accent)', popis: 'Vidíte celý záznam a zapisujete do deníku včetně návštěv lékaře. Plán péče (cíl, limitace, léky) měníte v centrální aplikaci – telefon ho jen zobrazuje.', typy: ['Návštěva lékaře', 'Změna stavu', 'Podán SOS lék', 'Návštěva hospice', 'Telefonát'] },
  pl: { nazev: 'Praktický lékař', c: 'var(--accent-ink)', popis: 'Vidíte celý záznam a zapisujete do deníku včetně návštěv lékaře. Plán péče měníte v centrální aplikaci.', typy: ['Návštěva lékaře', 'Změna stavu', 'Podán SOS lék', 'Telefonát'] },
  hospic: { nazev: 'Hospic', c: 'var(--violet)', popis: 'Vidíte celý záznam, zapisujete do deníku a jste prvním kontaktem při zhoršení. Plán péče mění lékař.', typy: ['Návštěva hospice', 'Změna stavu', 'Podán SOS lék', 'Návštěva lékaře', 'Telefonát'] },
  sestra: { nazev: 'Sestra DPS', c: 'var(--ok)', popis: 'Vidíte celý záznam, zapisujete stav a podané SOS léky, při zhoršení vyplníte průvodce. Plán péče měnit nemůžete.', typy: ['Změna stavu', 'Podán SOS lék', 'Návštěva lékaře', 'Telefonát', 'Pozorování rodiny'] },
  rodina: { nazev: 'Rodina', c: 'var(--warn)', popis: 'Vidíte celý záznam a můžete připsat do deníku, co pozorujete a jaký SOS lék jste podali. Při zhoršení vám pomůže průvodce.', typy: ['Pozorování rodiny', 'Podán SOS lék', 'Změna stavu', 'Telefonát'] },
};
function stariSync() { if (!D || !D.posledniSync) return Infinity; return Date.now() - new Date(D.posledniSync).getTime(); }
function textStari() {
  const ms = stariSync(); if (ms === Infinity) return 'nikdy';
  const m = Math.round(ms / 60000); if (m < 1) return 'právě teď'; if (m < 60) return `před ${m} min`;
  const h = Math.round(m / 60); if (h < 48) return `před ${h} h`; return `před ${Math.round(h / 24)} dny`;
}
function kresliSyncBar() {
  const el = $('syncbar'); if (!el || !D) return;
  const stare = stariSync() > 24 * 3600e3;
  el.innerHTML = `<span class="dot ${chybaSync ? 'warn' : stare ? 'crit' : 'ok'}"></span><span>${syncBezi ? 'synchronizuji…' : `aktualizováno ${textStari()}${chybaSync ? ' · ' + esc(chybaSync) : ''}`}${D.fronta.length ? ` · ${D.fronta.length} čeká na odeslání` : ''}</span><button class="btn ghost right" id="btnSync" aria-label="Synchronizovat">${KP.ICON.sync}</button>`;
  $('btnSync').onclick = () => sync({ tichy: false });
}
function hlavicka() {
  if (!D) { $('top').innerHTML = `<img src="/icons/icon.svg" width="40" height="40" style="border-radius:12px" alt=""><div class="ttl"><h1>Karta pacienta</h1><div class="meta">telefon u lůžka</div></div>${KP.tlacitkaHlavicky({ vzhled: false })}<span class="verbadge">${APP_VERZE.replace('karta-', 'v')}</span>`; return; }
  const p = D.balik.pacient;
  $('top').innerHTML = `${tab !== 'karta' && U.role ? `<button class="back" id="btnBack" aria-label="Zpět">${KP.ICON.back}</button>` : '<img src="/icons/icon.svg" width="40" height="40" style="border-radius:12px" alt="">'}
    <div class="ttl"><h1>${esc(p.prijmeni)} ${esc(p.jmeno)}${p.rok ? ', ' + esc(p.rok) : ''}</h1><div class="meta">${esc(p.kod)} · ${esc(p.pobyt || '')}${D.telefon ? ' · telefon ' + esc(D.telefon) : ''}</div></div>
    ${KP.tlacitkaHlavicky({ vzhled: false })}${U.role ? `<button class="rolebtn" id="btnZamek" style="--c:var(--ok)"><span class="dot"></span>${esc(ROLE_NAZ[U.role] || U.role)} · zamknout</button>` : `<span class="rolebtn" style="--c:var(--crit)">${KP.ICON.zamek}</span>`}`;
  if ($('btnBack')) $('btnBack').onclick = () => { tab = 'karta'; kresli(); };
  if ($('btnZamek')) $('btnZamek').onclick = zamkni;
}
function kresli() {
  hlavicka();
  if (!D) return kresliParovani();
  const b = D.balik;
  const denik = [...(b.denik || []), ...D.fronta.filter((e) => !(b.denik || []).some((x) => x.uuid === e.uuid))];
  const bb = { ...b, denik };
  const stare = stariSync() > 24 * 3600e3;
  const zh = KP.aktivniZhorseni(denik);
  let html = `<div class="syncbar" id="syncbar"></div>${stare ? `<div class="banner crit">Data jsou starší než 24 h (${esc(textStari())}). Připojte telefon k síti – mohou chybět změny plánu.</div>` : ''}`;
  if (b.pacient.stav === 'UZAVRENY') html += '<div class="banner warn">Průkaz byl uzavřen.</div>';
  if (!U.role) {
    html += `<div class="lockbar">${KP.ICON.zamek} Zamčeno – krizová karta</div>
      ${KP.kartaHTML(bb, { tlacitka: '<button class="btn primary" id="unRodina">Přístup rodina</button><button class="btn primary" id="unCarer">Přístup tým</button><button class="btn" id="unDoc">Lékař bez PINu</button>' })}
      <div class="note" style="margin-top:-4px"><b>Přístup rodina</b> – PIN, který rodině vydal garant. <b>Přístup tým</b> – osobní PIN: sestra domova, hospic, praktický lékař, lékař. <b>Lékař bez PINu</b> – kód lékaře pro dnešní den (z centrální aplikace nebo z PéčeDoma). <b>Záchranná služba</b> – krizovou kartu vidí bez odemykání, zápis výjezdu je níže.</div>
      <div class="panel"><div class="panel-h"><h2>Záchranná služba – zápis výjezdu</h2></div><div class="form" style="padding:14px">
        <div class="field"><label>Výsledek zásahu</label><select id="zzs_v"><option>ošetřen, ponechán na místě</option><option>konzultováno s lékařem plánu, bez transportu</option><option>transport do nemocnice</option><option>konstatováno úmrtí</option></select></div>
        <div class="field"><label>Vaše jméno a posádka *</label><input id="zzs_p" placeholder="např. Jan Novák, RZP Zlín 12" autocomplete="name"></div>
        <div class="field"><label>Poznámka (volitelně)</label><input id="zzs_n" placeholder="co bylo provedeno, podané léky…"></div>
        <button class="btn primary" id="btnZZS">Zapsat výjezd do deníku</button>
        <div class="note">Záchranná služba nepotřebuje PIN – krizovou kartu vidí bez přihlášení. Jméno se zapisuje jen k výjezdu. Hospic a lékař plánu zápis uvidí v deníku (označený jako neověřený).</div></div></div>`;
  } else {
    const tabs = [['karta', 'Karta'], ['dg', 'Diagnóza'], ['plan', 'Plán'], ['leky', 'Léky'], ['denik', 'Deník'], ['zhorseni', 'Zhoršení'], ['kontakty', 'Kontakty'], ['udaje', 'Tým']];
    const badge = (id) => (id === 'zhorseni' && zh ? '<span class="bdg">!</span>' : id === 'denik' && D.fronta.length ? `<span class="bdg">${D.fronta.length}</span>` : id === 'plan' && (!b.plan || KP.prosly(b.plan.platnostDo)) ? '<span class="bdg">!</span>' : '');
    html += `<div class="tiles">${tabs.map(([id, n]) => `<button class="tile ${tab === id ? 'on' : ''}" data-tab="${id}">${KP.ICON[id] || KP.ICON.udaje}<span>${n}</span>${badge(id)}</button>`).join('')}</div>`;
    const rk = ROLE_KARTA[U.role];
    if ((tab === 'karta' || tab === 'dg') && rk) html += `<div class="lbl" style="padding:2px 6px;border-left:4px solid ${rk.c}"><b>${esc(U.jmeno || '')}</b> · ${esc(rk.nazev)}</div><div class="note"><b>${esc(rk.nazev)}:</b> ${esc(rk.popis)}</div>`;
    html += ({ karta: () => KP.kartaHTML(bb) + (zh ? '<div class="banner crit">Probíhá zhoršení stavu.<button class="btn sm" id="btnStab">Stav stabilizován</button></div>' : '') + navstevaHTML(b) + `<div class="panel"><div class="panel-h"><h2>Diagnózy</h2></div><div class="rolehelp" style="color:var(--fg)">${esc((b.plan && b.plan.data.dg) || '—')}</div></div>`,
      dg: () => dgHTML(b), leky: () => lekyHTML(b), plan: () => planHTML(b), denik: () => denikHTML(denik), zhorseni: () => zhorseniHTML(b, zh), kontakty: () => kontaktyHTML(b), udaje: () => tymHTML(b) })[tab]();
  }
  html += `<div class="footer">Karta pacienta ${APP_VERZE.replace('karta-', 'v')} · šifrovaná kopie, plán vede garant v centrální aplikaci</div>`;
  $('work').innerHTML = html;
  KP.sbalVysvetlivky($('work'), { pred: '.footer' });
  kresliSyncBar();
  bind();
  if (tab === 'karta') nactiNahledChatu();
}
/* z PéčeDoma (propojený pacient): nejbližší plánovaná návštěva a aktivní léky – jen k zobrazení, plán péče je ze serveru */
/* chat PéčeDoma: po odemknutí může rodina i tým u pacienta napsat týmu PéčeDoma (zprávy jdou přes server Karty) */
function navstevaHTML(b) {
  const pd = b.pecedoma; if (!pd || !pd.chat || !U.role || U.role === 'zzs') return '';
  return `<div class="panel"><div class="panel-h"><h2>PéčeDoma</h2><span class="chip acc">chat</span></div><div style="padding:12px 14px"><div id="pdNahled">${D.zpravy ? KP.chatNahled(D.zpravy, 'OD_PACIENTA') : '<div class="muted" style="font-size:13px;padding:0 0 6px">Načítám zprávy…</div>'}</div><div class="quick"><button class="btn primary" id="pdChat">💬 ${D.zpravy && D.zpravy.length ? 'Všechny zprávy a odpověď' : 'Napsat týmu PéčeDoma'}</button></div></div></div><div class="note"><b>Chat PéčeDoma:</b> zprávu uvidí tým PéčeDoma (sestry, lékař) v portálu u klienta a odpoví sem; stejné vlákno vidí klient ve své aplikaci PéčeDoma.</div>`;
}
/* poslední zprávy rovnou v panelu (po odemknutí); načtení na pozadí nejvýš jednou za 5 minut, cache v telefonu */
let zpravyBezi = false;
async function nactiNahledChatu() {
  if (!D || !D.token || !U.role || !navigator.onLine || zpravyBezi || !$('pdNahled')) return;
  if (D.zpravyCas && Date.now() - D.zpravyCas < 5 * 60e3) return;
  zpravyBezi = true;
  const kdo = [ROLE_NAZ[U.role] || U.role || '', U.jmeno || ''].filter(Boolean).join(' ');
  try { const r = await KP.api('/api/d/pecedoma/zpravy?kdo=' + encodeURIComponent(kdo), { token: D.token, typ: 'Device' }); ulozZpravy(r.zpravy); }
  catch (e) { const el = $('pdNahled'); if (el && !D.zpravy) el.innerHTML = `<div class="muted" style="font-size:13px;padding:0 0 6px">${esc(e.message)}</div>`; }
  zpravyBezi = false;
}
function ulozZpravy(zpravy) {
  D.zpravy = (zpravy || []).slice(-20); D.zpravyCas = Date.now(); uloz();
  const el = $('pdNahled'); if (el) el.innerHTML = KP.chatNahled(D.zpravy, 'OD_PACIENTA');
  const b = $('pdChat'); if (b) b.textContent = '💬 ' + (D.zpravy.length ? 'Všechny zprávy a odpověď' : 'Napsat týmu PéčeDoma');
}
function chatPd() {
  if (!navigator.onLine) return toast('Chat potřebuje připojení k internetu');

  const hlidej = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { if (e.status === 401 || e.status === 403) setTimeout(() => sync(), 400); throw e; } };

const hezkeCislo = (t) => { const d = String(t || '').replace(/\D/g, ''); return d.length === 12 ? `+${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6, 9)} ${d.slice(9)}` : d ? '+' + d : ''; };
async function predvyplnTelefon(predvyplnit, popisTlacitka) {
  const dosad = (tel, zprava) => { const t = $('p_tel'), i = $('p_info'), b = $('p_ok'); if (t && !t.value) t.value = tel; if (i) i.textContent = zprava; if (b) { b.textContent = popisTlacitka; setTimeout(() => b.focus(), 50); } };
  if (predvyplnit.telefon) return dosad(hezkeCislo(predvyplnit.telefon), `Kód načten. Číslo telefonu ${hezkeCislo(predvyplnit.telefon)} je předvyplněné – stačí potvrdit.`);
  try {
    const r = await KP.api(`/api/d/parovaci-info?tenant=${encodeURIComponent(String(predvyplnit.tenant || '').toUpperCase())}&kod=${encodeURIComponent(String(predvyplnit.kod || '').toUpperCase())}`);
    const t = $('p_tel'), i = $('p_info'), b = $('p_ok');
    if (r.telefon && t && !t.value) { t.value = r.telefon; if (i) i.textContent = `Kód načten. Číslo telefonu ${r.telefon} je předvyplněné – stačí potvrdit.`; if (b) b.textContent = popisTlacitka; setTimeout(() => b && b.focus(), 50); }
    else if (i) i.textContent = 'Kód načten – zadejte číslo tohoto telefonu.';
  } catch (e) { const i = $('p_info'); if (i) { i.textContent = e.status === 404 ? e.message : 'Kód načten – zadejte číslo tohoto telefonu (' + (e.message || 'číslo se nepodařilo zjistit') + ').'; if (e.status === 404) i.className = 'banner warn'; } }
}
/* iPhone/iPad v Safari (ne z plochy): aplikace přidaná na plochu má oddělené úložiště, takže párovat až v ní */
function jeIosProhlizec() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return ios && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches;
}
/* čtečka QR kódu z centrální aplikace (odkaz …/karta/#p=TENANT.KOD) – fotoaparát přímo v aplikaci, i v té na ploše */
function nactiJsQr() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, chyba) => { const sc = document.createElement('script'); sc.src = '/shared/jsqr.min.js'; sc.onload = ok; sc.onerror = () => chyba(new Error('Čtečku QR kódu se nepodařilo načíst – zkontrolujte připojení')); document.head.appendChild(sc); });
}
async function nactiQr() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Tento prohlížeč nepouští k fotoaparátu – opište kódy ručně');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) { return toast(e.name === 'NotAllowedError' ? 'Přístup k fotoaparátu je zakázaný – povolte ho v nastavení telefonu, nebo opište kódy ručně' : 'Fotoaparát se nepodařilo spustit'); }
  const stop = () => stream.getTracks().forEach((t) => t.stop());
  modal(`<h2>Načíst QR kód</h2><p class="muted" style="margin:0">Namiřte fotoaparát na QR kód v okně „Spárovat telefon“ v centrální aplikaci.</p>
    <video id="qr_v" playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:1;object-fit:cover"></video>
    <div class="quick"><button class="btn" id="qr_zpet">Zrušit</button></div>`, (m) => { m.querySelector('#qr_zpet').onclick = () => { stop(); closeModal(); }; });
  const v = $('qr_v'); v.srcObject = stream;
  try { await v.play(); } catch { /* */ }
  const det = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  if (!det) { try { await nactiJsQr(); } catch (e) { stop(); closeModal(); return toast(e.message); } }
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const krok = async () => {
    if (!document.body.contains(v)) return stop();   // okno zavřené (i klepnutím vedle)
    let text = '';
    if (v.readyState >= 2 && v.videoWidth) {
      try {
        if (det) { const r = await det.detect(v); text = r[0] ? r[0].rawValue : ''; }
        else {
          const w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth);
          cv.width = w; cv.height = h; ctx.drawImage(v, 0, 0, w, h);
          const r = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); text = r ? r.data : '';
        }
      } catch { /* další snímek */ }
    }
    const h = text.match(/p=([A-Z0-9]{16})\.([A-Z0-9]{8})(?:\.T(\d{9,15}))?/i);
    if (h) { stop(); closeModal(); if (navigator.vibrate) navigator.vibrate(80); kresliParovani({ tenant: h[1].toUpperCase(), kod: h[2].toUpperCase(), telefon: h[3] ? '+' + h[3] : '' }); return; }
    if (text) toast('To není QR kód karty pacienta');
    setTimeout(krok, 250);
  };
  krok();
}
async function parovat(tenant, kod, telefon) {
  tenant = String(tenant || '').toUpperCase().trim(); kod = String(kod || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!String(telefon || '').replace(/\D/g, '')) return toast('Zadejte číslo tohoto telefonu');
  try {
    const r = await KP.api('/api/d/parovat', { method: 'POST', body: { tenant, kod, telefon } });
    D = { tenant, token: r.token, tajemstvi: r.tajemstvi, zarizeniId: r.zarizeniId, telefon: r.telefon, balik: r.balik, fronta: [], posledniSync: new Date().toISOString(), parovano: new Date().toISOString() };
    await uloz(); history.replaceState(null, '', location.pathname); U = { role: null }; tab = 'karta'; kresli(); toast('Průkaz nahrán do telefonu');
  } catch (e) { toast(e.message); }
}

/* ---------------- start ---------------- */
(async function start() {
  D = await nacti();
  const h = location.hash.match(/p=([A-Z0-9]{16})\.([A-Z0-9]{8})(?:\.T(\d{9,15}))?/i);
  if (h && !D) { kresli(); kresliParovani({ tenant: h[1].toUpperCase(), kod: h[2].toUpperCase(), telefon: h[3] ? '+' + h[3] : '' }); }   // odkaz z SMS / QR předvyplní kódy, telefon potvrdí své číslo
  else if (h && D) { history.replaceState(null, '', location.pathname); kresli(); modal('<h2>Telefon už má průkaz</h2><p>Tento telefon už je spárován. Pokud má převzít jiný průkaz, nejdřív ho v centrální aplikaci zablokujte (data se smažou) a pak kód naskenujte znovu.</p><div class="quick"><button class="btn" data-close>Rozumím</button></div>'); }
  else kresli();
  if (D) sync();
  addEventListener('online', () => sync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 5 * 60 * 1000);
  setInterval(kresliSyncBar, 30000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/karta/sw.js', { scope: '/karta/' }).catch(() => {});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { /* */ }
})();
</script>
