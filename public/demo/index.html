<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Paliativní průkaz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Průkaz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d6fd6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Mobile-only layout: one column, sticky top bar, bottom tab bar, bottom sheets. Clinical palette, colour only where it carries meaning. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d3d9e2; --fg:#1b2130; --muted:#5e6878;
  --accent:#1d6fd6; --accent-soft:#e3eefc; --accent-ink:#124a95;
  --crit:#d13a2e; --crit-soft:#fbe7e5; --warn:#d98a0b; --warn-soft:#fff3dc; --ok:#1f9a5a; --ok-soft:#e3f5ea; --violet:#5b3fb5; --violet-soft:#ece7fa;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 10px 30px rgba(20,35,70,.10); --nav:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a1f28; --surface-2:#232a35; --line:#323b49; --fg:#e8ecf2; --muted:#9aa5b5;
  --accent:#5a9cf0; --accent-soft:#1c2d47; --accent-ink:#bcd6fb;
  --crit:#ef6a5e; --crit-soft:#3a1f1d; --warn:#f0a93a; --warn-soft:#3a2d14; --ok:#49c47f; --ok-soft:#173327; --violet:#9b86e6; --violet-soft:#2a2342;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a1f28; --surface-2:#232a35; --line:#323b49; --fg:#e8ecf2; --muted:#9aa5b5;
  --accent:#5a9cf0; --accent-soft:#1c2d47; --accent-ink:#bcd6fb;
  --crit:#ef6a5e; --crit-soft:#3a1f1d; --warn:#f0a93a; --warn-soft:#3a2d14; --ok:#49c47f; --ok-soft:#173327; --violet:#9b86e6; --violet-soft:#2a2342;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;min-height:56px}
.top .back{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.top .ttl{min-width:0;flex:1}
.top .ttl h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rolebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex:none;min-height:40px}
.rolebtn .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.verbadge{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 6px;flex:none}
/* content */
.content{flex:1;padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;min-width:0}
.content.nonav{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rolehelp{padding:12px 14px;font-size:13.5px;color:var(--muted)}
.rolehelp b{color:var(--fg)}
/* patient list */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plist li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:68px}
.plist li:active{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.plist .n{font-weight:700;font-size:15.5px}
.plist .s{font-size:12.5px;color:var(--muted)}
.plist .flag{margin-left:auto;flex:none}
.plist .chev{color:var(--muted);flex:none}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:44px}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.crit{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);min-height:36px;padding:6px 10px}
.btn.sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.actions{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.actions::-webkit-scrollbar{display:none}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
@media (min-width:520px){.fab{right:calc(50% - 240px + 16px)}}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav)}
.bnav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;padding:0}
.bnav button.on{color:var(--accent)}
.bnav button:disabled{opacity:.35}
.bnav svg{width:22px;height:22px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--muted);font-weight:600;font-size:11.5px;min-height:66px;position:relative}
.tile svg{width:24px;height:24px}
.tile.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tile .bdg{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.tile .bdg.n{background:var(--surface-2);color:var(--muted)}
.tile.on .bdg.n{background:rgba(255,255,255,.25);color:#fff}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:grid;gap:10px;border:1px solid var(--line)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:16px}
.rolelist{display:grid;gap:8px}
.role{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;min-height:56px}
.role .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.role .rn{font-weight:700}
.role .rd{font-size:12.5px;color:var(--muted)}
.role.on{background:var(--accent-soft);border-color:var(--accent)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.vio{background:var(--violet-soft);color:var(--violet)}
/* crisis card */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.card .hdr{background:linear-gradient(135deg,var(--accent),#4aa3f0);color:#fff;padding:16px 18px 14px}
.card .hdr .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.05em;font-weight:700}
.card .hdr .valid{background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;font-weight:500;letter-spacing:0}
.card .hdr .valid.exp{background:#fff;color:var(--crit)}
.card .hdr .name{font-size:21px;font-weight:700;margin-top:6px}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:9px}
.sec{border-radius:14px;padding:11px 13px 12px 15px;border:1.25px solid;position:relative}
.sec::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:3px;background:var(--c)}
.sec h3{font-size:11.5px;letter-spacing:.05em;font-weight:700;color:var(--c);margin-bottom:5px}
.sec.red{--c:var(--crit);background:var(--crit-soft);border-color:var(--crit)}
.sec.amber{--c:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.sec.blue{--c:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.sec.violet{--c:var(--violet);background:var(--violet-soft);border-color:var(--violet)}
.lbl{font-size:11.5px;color:var(--muted);margin-top:6px}
.val{font-size:15px}
.pill{display:inline-block;padding:6px 16px;border:2px solid var(--crit);background:var(--crit-soft);color:var(--crit);border-radius:10px;font-weight:800;font-size:16px;margin:2px 0 4px}
.pill.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.callrow{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px}
.callrow .num{font-family:var(--mono);font-weight:500;color:var(--accent-ink);white-space:nowrap;font-size:14px}
.callrow.first{background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:8px 10px;font-weight:700}
.card .foot{display:flex;gap:10px;padding:4px 10px 14px}
.card .foot .btn{flex:1}
.note{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--fg)}
/* forms */
.form{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--surface);width:100%;min-width:0;font-size:16px;min-height:46px}
.field textarea{min-height:140px;resize:vertical;font-family:var(--mono);font-size:13px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13.5px;min-height:38px}
.checks label:has(input:checked){background:var(--crit-soft);border-color:var(--crit);color:var(--crit);font-weight:600}
.checks input{accent-color:var(--crit);width:16px;height:16px}
.locked{opacity:.6;pointer-events:none}
/* diary */
.diary{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.diary li{display:grid;gap:4px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.diary .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.diary .who{font-size:12.5px;color:var(--muted)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
/* segments */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:40px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* wizard */
.wzbar{display:grid;gap:6px}
.wzbar .ttl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.wzbar .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.wzbar .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.wzfoot{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wzfoot .in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.wzfoot .btn{flex:1}
.scanbox{border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer;background:var(--surface)}
.scanbox:active{border-color:var(--accent);background:var(--accent-soft)}
.scanbox .ico{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.srcopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srcopts .btn{padding:10px 6px;font-size:13px}
.srcopts .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ai{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.ai h3{font-size:15px;display:flex;align-items:center;gap:8px}
.ai .spark{width:24px;height:24px;border-radius:8px;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.prog{display:grid;gap:8px}
.prog div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.prog .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.prog .st.run{border-color:var(--violet);border-top-color:transparent;animation:spin .8s linear infinite}
.prog .st.ok{border-color:var(--ok);background:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.prog .st.run{animation:none}}
.ex{display:grid;gap:8px}
.ex .item{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ex .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ex .q{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px}
.missing li{margin:4px 0}
.thumb{max-width:140px;border-radius:10px;border:1px solid var(--line)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;border:1px solid var(--line)}
pre.out{background:var(--surface-2);border-radius:10px;padding:12px;white-space:pre-wrap;font-family:var(--mono);font-size:12px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:30;box-shadow:var(--shadow);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.banner{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;font-weight:600;font-size:13.5px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner .btn{margin-left:auto}
.footer{text-align:center;color:var(--muted);font-size:11.5px;padding:4px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{ body{background:#fff} .top,.bnav,.actions,.banner,.note,.panel,.lockbar,.footer,.fab,#modal,#toast{display:none!important} .content{padding:0} .card{box-shadow:none;border-color:#999;max-width:100%} }
body.printing .card{box-shadow:none}
.lockbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13.5px;color:var(--muted)}
</style>

<div class="app">
  <header class="top" id="top"></header>
  <main class="content" id="work"></main>
</div>
<nav class="bnav" id="bnav" hidden><div class="in" id="bnavin"></div></nav>
<div id="modal"></div>
<div id="toast" hidden class="toast"></div>

<script>
// ---------- demo data ----------
const ROLES = [
  {id:'lekar', name:'Lékař', c:'var(--accent)', help:'<b>Lékař paliativního týmu / hospice / PL.</b> Zakládá průkaz, stanovuje cíl péče a limitace, provádí revizi a pořizuje výpis. Jediná role, která mění plán péče.'},
  {id:'sestra', name:'Sestra DPS', c:'var(--ok)', help:'<b>Sestra domova pro seniory.</b> Čte celý záznam, zapisuje do deníku stav a podané SOS léky, při zhoršení vyplní průvodce. Plán péče měnit nemůže.'},
  {id:'hospic', name:'Hospic', c:'var(--violet)', help:'<b>Mobilní hospic.</b> Čte celý záznam, zapisuje do deníku, je prvním kontaktem při zhoršení.'},
  {id:'pl', name:'Prakt. lékař', c:'var(--accent-ink)', help:'<b>Praktický lékař.</b> Čte celý záznam, upravuje medikaci, reviduje plán péče u klientů domovů. Stejná oprávnění jako lékař plánu.'},
  {id:'rodina', name:'Rodina', c:'var(--warn)', help:'<b>Rodina / pečující osoba.</b> Vidí celý záznam, může připsat pozorování do deníku a doplnit telefon.'},
  {id:'zzs', name:'ZZS', c:'var(--crit)', help:'<b>Záchranná služba.</b> Bez přihlášení vidí pouze krizovou kartu. Může jen potvrdit výjezd a jeho výsledek.'},
];

      const flag = p.zhorseni?'<span class="chip crit">zhoršení</span>':expired(p)?'<span class="chip warn">revize</span>':(d<=14?`<span class="chip warn">revize za ${d} d</span>`:'<span class="chip ok">platný</span>');
      return `<li data-id="${p.id}" tabindex="0"><span class="avatar">${esc(ini)}</span><div style="min-width:0"><div class="n">${esc(p.jmeno)}</div><div class="s">${p.rok} · ${esc(p.pobyt)}</div></div><span class="flag">${flag}</span><span class="chev">${ICON.chev}</span></li>`; };
  return `<div class="panel"><div class="rolehelp" id="rolehelp">${ROLES.find(r=>r.id===S.role).help}</div></div>
    ${S.patients.length>3?`<input id="q" placeholder="Hledat pacienta…" value="${esc(S.q||'')}" style="border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);font-size:16px;width:100%">`:''}
    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px">${S.role==='zzs'?'Zařízení u pacienta':'Pacienti s průkazem'} <span class="chip">${activeCount()} / ${MAX_PATIENTS}</span></h2>
    <ul class="plist" id="plist">${list.map(row).join('')||'<li style="color:var(--muted);cursor:default">žádný pacient</li>'}</ul>
    ${isDoc()&&activeCount()>=MAX_PATIENTS?'<div class="banner warn">Zařízení má plný počet pacientů (10). Nového lze založit po ukončení péče u některého z nich.</div>':''}
    ${S.archiv.length?`<h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px">Archiv (péče ukončena)</h2><ul class="plist" id="alist">${S.archiv.map(a=>`<li data-aid="${a.id}" tabindex="0" style="opacity:.75"><span class="avatar" style="background:var(--surface-2);color:var(--muted)">${esc(a.jmeno.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><div style="min-width:0"><div class="n">${esc(a.jmeno)}</div><div class="s">${a.rok} · ukončeno ${esc(a.ukonceno)}</div></div><span class="chev">${ICON.chev}</span></li>`).join('')}</ul>`:''}
    ${S.role==='zzs'?'<div class="note">Posádka ZZS bere zařízení u pacienta do ruky. Vyberte pacienta, zobrazí se jen zamčená krizová karta.</div>':''}
    <div class="footer">Paliativní průkaz · lokální verze · jména a údaje demo pacientů jsou smyšlené · AI rozbor běží jen v zařízení · ${APP_VERSION}</div>
    ${isDoc()?`<button class="fab" id="btnNew" ${canAdd()?'':'disabled style="opacity:.5"'}>+ Nový pacient</button>`:''}`;
}

function bindSettings(){
  const q=id=>document.getElementById(id);
  q('btnSaveSettings').onclick=()=>{ document.querySelectorAll('[data-user]').forEach(i=>{ S.users[i.dataset.user]=i.value.trim()||DEFAULT_USERS[i.dataset.user]; }); S.settings={...S.settings, prac:q('s_prac').value.trim(), tel:q('s_tel').value.trim(), hospic:q('s_hospic').value.trim(), hospictel:q('s_hospictel').value.trim(), interval:+q('s_int').value}; save(); toast('Nastavení uloženo'); render(); };
  q('btnExport').onclick=()=>{ const txt=exportJSON(); modal(`<h2>Záloha dat</h2><pre class="out" id="vtxt" style="max-height:50vh;overflow:auto">${esc(txt)}</pre><div class="quick"><button class="btn primary" id="mCopy">Zkopírovat</button><button class="btn" id="mX">Zavřít</button></div>`,()=>{ q('mCopy').onclick=()=>copyText(txt,'vtxt'); }); };
  q('btnDownload').onclick=()=>{ try{ const blob=new Blob([exportJSON()],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`paliativni-prukaz-zaloha-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Stahuji zálohu (pokud to prohlížeč dovolí)'); }catch(e){ toast('Stažení není dostupné, použijte Zobrazit zálohu'); } };
  q('btnImport').onclick=()=>{ try{ const o=JSON.parse(q('s_import').value); if(!o||!Array.isArray(o.patients)) throw 0; if(o.patients.length>MAX_PATIENTS) throw 1; S.patients=o.patients; S.archiv=o.archiv||[]; S.users=o.users||S.users; S.settings=o.settings||S.settings; S.patients.forEach(migrate); S.pid=S.patients[0]?.id; save(); toast('Data načtena ze zálohy'); S.view='list'; render(); }catch(e){ toast(e===1?'Záloha má víc než 10 pacientů':'Neplatný JSON zálohy'); } };
  q('btnResetDemo').onclick=()=>modal(`<h2>Obnovit demo pacienty</h2><p>Nahradí všechny pacienty třemi ukázkovými. Archiv zůstane.</p><div class="quick"><button class="btn primary" id="mOk">Obnovit</button><button class="btn" id="mX">Zpět</button></div>`,()=>{ q('mOk').onclick=()=>{ S.patients=seedPatients(); S.patients.forEach(migrate); S.pid='p1'; closeModal(); save(); toast('Demo pacienti obnoveni'); S.view='list'; render(); }; });
  q('btnWipe').onclick=()=>modal(`<h2>Smazat všechna data</h2><p>Smaže pacienty, archiv i nastavení z tohoto zařízení. Nelze vrátit.</p><div class="quick"><button class="btn crit" id="mOk">Smazat vše</button><button class="btn" id="mX">Zpět</button></div>`,()=>{ q('mOk').onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} S.patients=[]; S.archiv=[]; S.users={...DEFAULT_USERS}; S.settings={}; S.pid=null; closeModal(); save(); toast('Zařízení vymazáno'); S.view='list'; render(); }; });
}
function copyText(txt,elId){ navigator.clipboard?.writeText(txt).then(()=>toast('Zkopírováno')).catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById(elId)); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Text označen, zkopírujte Ctrl/Cmd+C'); }); }

// --- Krizová karta
function kartaHTML(p){
  const first = p.kontakty.find(k=>/hospic/i.test(k.jmeno)) || p.kontakty.find(k=>k.role==='pecuje');
  const rozh = p.kontakty.find(k=>k.role==='rozhoduje');
  const last = p.zhorseni ? {t:p.zhorseni.t, kdo:p.zhorseni.kdo, txt:p.zhorseni.souhrn} : p.denik[p.denik.length-1];
  const kpr = p.limity.includes('KPR');
  return `<div class="card">
    <div class="hdr"><div class="row"><span>KRIZOVÝ PLÁN PÉČE</span><span class="valid ${expired(p)?'exp':''}">${expired(p)?'ČEKÁ NA REVIZI':'platí do '+fmtD(p.platnost)}</span></div><div class="name">${esc(p.jmeno)}, ${p.rok}</div></div>
    <div class="body">
      <section class="sec red"><h3>LIMITACE PÉČE</h3>
        <div class="pill ${kpr?'':'ok'}">KPR: ${kpr?'NE':'ANO'}</div>
        ${p.limity.filter(l=>l!=='KPR').length?`<div class="val">Dále ne: ${esc(p.limity.filter(l=>l!=='KPR').join(', '))}</div>`:''}
        <div class="lbl">Cíl péče</div><div class="val">${esc(GOALS[p.cil])}</div>
        <div class="lbl">Doklad</div><div class="val">${p.doklad.dvp?`dříve vyslovené přání z ${fmtD(p.doklad.datum)}`:'<span class="chip warn">bez dříve vysloveného přání</span> rozhodnutí lékaře'}</div>
        <div class="lbl" style="margin-top:2px">${esc(p.doklad.dvp? 'originál: '+p.doklad.original : 'zápis: '+p.doklad.zprava)}</div>
      </section>
      <section class="sec amber"><h3>ALERGIE A SOS LÉKY</h3>
        <div class="val"><b>Alergie:</b> ${esc(p.alergie)}</div>
        <div class="lbl">SOS léky</div>${p.sos.map(s=>`<div class="val">${esc(s)}</div>`).join('')}
      </section>
      <section class="sec blue"><h3>KOHO VOLAT</h3>
        ${first?`<div class="callrow first"><span>Nejdřív: ${esc(first.jmeno.replace(/ \(24\/7\)/,''))}</span><span class="num">${esc(first.tel)}</span></div>`:''}
        <div class="callrow"><span><span class="lbl" style="margin:0">Lékař plánu</span><br>${esc(p.lekar.jmeno)}</span><span class="num">${esc(p.lekar.tel)}</span></div>
        ${rozh?`<div class="callrow"><span><span class="lbl" style="margin:0">Rozhoduje</span><br>${esc(rozh.jmeno)}</span><span class="num">${esc(rozh.tel)}</span></div>`:''}
      </section>
      ${last?`<section class="sec violet"><h3>${p.zhorseni?'AKTUÁLNÍ ZHORŠENÍ':'POSLEDNÍ ZÁPIS'} · ${esc(last.t)} · ${esc(last.kdo)}</h3><div class="val">${esc(last.txt)}</div></section>`:''}
    </div>
    ${S.role==='zzs'||p.id==='x'?`<div class="foot"><button class="btn" id="unlockCarer" ${p.id==='x'?'disabled':''}>Jsem pečující</button><button class="btn primary" id="unlockDoc" ${p.id==='x'?'disabled':''}>Jsem lékař</button></div>`:''}
  </div>`;
}

  const types=S.role==='rodina'?['Pozorování rodiny','Podán SOS lék','Změna stavu','Telefonát']:['Změna stavu','Podán SOS lék','Návštěva lékaře','Návštěva hospice','Telefonát','Pozorování rodiny'];

    <div><ul class="diary">${[...p.denik].reverse().map(e=>`<li><div class="when">${esc(e.t)} · <span class="who">${esc(e.kdo)} · ${roleName(e.role)}</span></div><div><span class="chip ${e.typ==='Podán SOS lék'?'warn':e.typ==='Zhoršení stavu'||e.typ==='Výjezd ZZS'?'crit':e.typ==='Založení'||e.typ==='Revize'||e.typ==='Ukončení'?'acc':e.typ==='Úprava údajů'?'vio':''}">${esc(e.typ)}</span><div style="margin-top:4px">${esc(e.txt)}</div></div></li>`).join('')}</ul></div>
    <div class="panel"><div class="panel-h"><h2>Nový zápis</h2>${isCarer()?'':'<span class="chip">ZZS nezapisuje</span>'}</div>
      <div class="form ${isCarer()?'':'locked'}" style="padding:14px">
        <div class="field"><label>Typ</label><div class="quick" id="qtypes">${types.map((t,i)=>`<button class="btn sm ${i===0?'on':''}" data-t="${t}" style="${i===0?'background:var(--accent-soft);border-color:var(--accent)':''}">${t}</button>`).join('')}</div></div>
        <div class="field"><label>Text</label><textarea id="d_txt" style="font-family:var(--font)" placeholder="Co se děje, co bylo provedeno…"></textarea></div>
        <button class="btn primary" id="btnAddD">Připsat do deníku jako ${esc(actorName())}</button>
        <div class="note">Zápisy nelze mazat ani měnit, jen doplňovat. Každý nese jméno, roli, datum a čas.</div>
      </div></div></div>`;
}
// --- Zhoršení stavu
function renderZhorseni(p){
  if(!isCarer()) return '<div class="note">Průvodce vyplňuje pečující osoba, ZZS výsledek vidí na krizové kartě.</div>';
  const z=p.zhorseni;
  return `<div style="display:grid;gap:12px">
    <div class="panel"><div class="panel-h"><h2>Průvodce: co se děje</h2></div>
      <div class="form" style="padding:14px">
        <div class="field"><label>1. Co pozoruji</label><div class="checks" id="z_sym">${['dušnost','bolest','neklid / zmatenost','horečka','nepřijímá tekutiny','pád','porucha vědomí','krvácení'].map(s=>`<label><input type="checkbox" value="${s}">${s}</label>`).join('')}</div><input id="z_pozn" placeholder="doplnění vlastními slovy" style="margin-top:6px"></div>
        <div class="field"><label>2. Co jsem už udělal(a)</label><div class="checks" id="z_akce">${['podán SOS lék','poloha / kyslík','zklidnění, přítomnost','změřeny funkce'].map(s=>`<label><input type="checkbox" value="${s}">${s}</label>`).join('')}</div></div>
        <div class="field"><label>3. Komu jsem volal(a)</label><div class="checks" id="z_vol">${['hospic','lékař plánu','praktický lékař','rodina / zástupce','155'].map(s=>`<label><input type="checkbox" value="${s}">${s}</label>`).join('')}</div></div>
        <button class="btn crit" id="btnZ">Zapsat zhoršení a zobrazit na kartě</button>
      </div></div>
    <div style="display:grid;gap:12px">
      <div class="note"><b>Podle plánu volat nejdřív:</b> ${esc((p.kontakty.find(k=>/hospic/i.test(k.jmeno))||p.kontakty[0]).jmeno)} · ${esc((p.kontakty.find(k=>/hospic/i.test(k.jmeno))||p.kontakty[0]).tel)}<br>SOS léky k dispozici: ${p.sos.map(s=>esc(s.split(' při')[0])).join('; ')}</div>
      ${z?`<div class="panel"><div class="panel-h"><h2>Shrnutí pro ZZS (oddíly 8–9 formuláře)</h2><span class="chip crit">aktivní</span></div><div style="padding:12px 14px"><div class="val">${esc(z.souhrn)}</div><div class="lbl">${esc(z.t)} · ${esc(z.kdo)}</div><button class="btn sm" id="btnKonecZhorseni" style="margin-top:8px">Stav stabilizován – ukončit</button></div></div>`:'<div class="note">Zatím žádné aktivní zhoršení. Po zapsání se shrnutí zobrazí fialově na krizové kartě a uloží do deníku.</div>'}
    </div></div>`;
}
// --- Kontakty
function renderKontakty(p){
  const groups=[['rozhoduje','Rozhoduje (zástupce, opatrovník)','crit'],['informovat','Informovat','acc'],['pecuje','Pečuje (hospic, lékaři, nemocnice)','ok']];
  return `<div style="display:grid;gap:12px"><div style="display:grid;gap:12px">${groups.map(([g,n,c])=>`<div class="panel"><div class="panel-h"><h2>${n}</h2><span class="chip ${c}">${p.kontakty.filter(k=>k.role===g).length}</span></div><div class="tblwrap"><table class="tbl"><tbody>${p.kontakty.map((k,i)=>({k,i})).filter(x=>x.k.role===g).map(({k,i})=>`<tr><td><b>${esc(k.jmeno)}</b>${k.pozn?`<div class="lbl">${esc(k.pozn)}</div>`:''}</td><td style="font-family:var(--mono);white-space:nowrap">${esc(k.tel)}</td><td style="white-space:nowrap">${(isDoc()||(isCarer()&&k.role!=='rozhoduje'))?`<button class="btn sm" data-kedit="${i}" aria-label="Upravit">✎</button> <button class="btn sm" data-kdel="${i}" aria-label="Smazat">×</button>`:''}</td></tr>`).join('')||'<tr><td style="color:var(--muted)">nikdo</td></tr>'}</tbody></table></div></div>`).join('')}</div>
    <div class="panel"><div class="panel-h"><h2>Přidat kontakt</h2></div><div class="form ${isCarer()?'':'locked'}" style="padding:14px">
      <div class="field"><label>Jméno a vztah</label><input id="k_j" placeholder="např. Anna Nová, vnučka"></div>
      <div class="frow"><div class="field"><label>Telefon</label><input id="k_t" placeholder="7xx xxx xxx"></div><div class="field"><label>Role</label><select id="k_r">${isDoc()?'<option value="rozhoduje">rozhoduje</option>':''}<option value="informovat">informovat</option><option value="pecuje">pečuje</option></select></div></div>
      <div class="field"><label>Poznámka (např. určená osoba, volat jako první)</label><input id="k_p"></div>
      <button class="btn primary" id="btnAddK">Přidat</button>
      <div class="note">Roli „rozhoduje“ přiděluje pouze lékař na základě dokladu (určená osoba, opatrovník, předběžné prohlášení).</div></div></div></div>`;
}
// --- Dokumenty a správa
function renderDok(p){
  return `<div style="display:grid;gap:12px">
    <div class="panel"><div class="panel-h"><h2>Dokumenty v průkazu</h2></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Dokument</th><th>Stav</th></tr></thead><tbody>
      <tr><td>Lékařská zpráva s cílem péče</td><td><span class="chip ok">kopie</span> ${esc(p.doklad.zprava)}</td></tr>
      <tr><td>Dříve vyslovené přání</td><td>${p.doklad.dvp?`<span class="chip ok">kopie</span> originál: ${esc(p.doklad.original)}`:'<span class="chip warn">chybí</span> doporučeno sepsat'}</td></tr>
      <tr><td>Tištěná krizová karta</td><td><span class="chip ok">v obalu zařízení</span> verze ${fmtD(p.platnost)}</td></tr>
      <tr><td>Informace pacientovi o vedení průkazu</td><td>${p.souhlas?`<span class="chip ok">podepsáno</span> ${esc(p.souhlas)}`:(isDoc()?'<button class="btn sm" id="btnSouhlas">Potvrdit podpis</button>':'<span class="chip warn">nepotvrzeno</span>')}</td></tr></tbody></table></div></div>
    <div style="display:grid;gap:12px">
      <div class="panel"><div class="panel-h"><h2>Deník přístupů</h2></div><div class="tblwrap"><table class="tbl"><tbody>${p.pristupy.slice(0,30).map(a=>`<tr><td style="font-family:var(--mono);white-space:nowrap;font-size:12px">${esc(a.t)}</td><td>${esc(a.kdo)}</td><td>${esc(a.co)}</td></tr>`).join('')||'<tr><td style="color:var(--muted)">zatím nic</td></tr>'}</tbody></table></div></div>
      ${isDoc()?`<div class="panel"><div class="panel-h"><h2>Správa (jen lékař)</h2></div><div style="padding:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="btnVypis3">Pořídit výpis do dokumentace</button><button class="btn" id="btnUkoncit">Ukončit péči (archivovat)</button></div></div>`:''}
    </div></div>`;
}

// ---------- tab bindings ----------
function bindTab(p){
  const q=id=>document.getElementById(id);
  const rev=()=>modal(`<h2>Revize plánu péče</h2><p>Potvrzuji, že jsem plán péče pacienta <b>${esc(p.jmeno)}</b> prošel a platí beze změny. Platnost prodloužit o:</p><div class="seg" id="revint">${[1,3,6].map(m=>`<button data-m="${m}" class="${m==(S.settings.interval||3)?'on':''}">${m} měs.</button>`).join('')}</div><div class="field"><label>Poznámka k revizi (volitelně)</label><input id="rev_p"></div><div class="quick"><button class="btn primary" id="mOk">Potvrdit revizi</button><button class="btn" id="mX">Zpět</button></div>`,()=>{ let m=S.settings.interval||3; document.querySelectorAll('#revint button').forEach(b=>b.onclick=()=>{m=+b.dataset.m; document.querySelectorAll('#revint button').forEach(x=>x.classList.toggle('on',x===b));}); document.getElementById('mOk').onclick=()=>{ const d=new Date(); d.setMonth(d.getMonth()+m); p.platnost=d.toISOString().slice(0,10); const pozn=document.getElementById('rev_p').value.trim(); p.lekar={jmeno:actorName(),tel:S.settings.tel||p.lekar.tel,prac:S.settings.prac||p.lekar.prac}; p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Revize',txt:`Plán péče revidován, platnost prodloužena do ${fmtD(p.platnost)}.${pozn?' '+pozn:''}`}); log(p,'revize plánu'); closeModal(); save(); toast('Revize potvrzena'); render(); }; });
  if(q('unlockCarer')) q('unlockCarer').onclick=()=>unlockSheet('carer');
  if(q('unlockDoc')) q('unlockDoc').onclick=()=>unlockSheet('doc');
  if(q('btnPrint')) q('btnPrint').onclick=()=>{ document.body.classList.add('printing'); const done=()=>{ document.body.classList.remove('printing'); window.removeEventListener('afterprint',done); }; window.addEventListener('afterprint',done); try{ window.print(); }catch(e){} setTimeout(done,1500); log(p,'tisk krizové karty'); save(); };
  if(q('btnSouhlas')) q('btnSouhlas').onclick=()=>{ p.souhlas=now().slice(0,10)+' · '+actorName(); p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Založení',txt:'Pacient / zástupce podepsal informaci o vedení průkazu.'}); save(); toast('Podpis potvrzen'); render(); };
  if(q('btnZZS')) q('btnZZS').onclick=()=>{ const v=q('zzs_v').value, pz=q('zzs_p').value.trim(); p.denik.push({t:now(),kdo:actorName(),role:'zzs',typ:'Výjezd ZZS',txt:`Výjezd ZZS: ${v}.${pz?' '+pz:''}`}); log(p,'výjezd ZZS zapsán'); if(/transport|úmrtí/.test(v)) p.zhorseni=null; save(); toast('Výjezd zapsán'); render(); };
  if(q('btnSaveUdaje')) q('btnSaveUdaje').onclick=()=>{ const j=q('u_jmeno').value.trim(), r=q('u_rok').value; if(!j||!r) return toast('Jméno a rok narození jsou povinné'); p.jmeno=j; p.rok=+r; p.pohlavi=q('u_poh').value; p.pobyt=q('u_pobyt').value.trim(); p.dg=q('u_dg').value.trim(); p.medikace=q('u_med').value.split('\n').map(x=>x.trim()).filter(Boolean); p.lekar={jmeno:q('u_lj').value.trim(),tel:q('u_lt').value.trim(),prac:q('u_lp').value.trim()}; p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Úprava údajů',txt:'Upravena identifikace, diagnózy nebo medikace.'}); log(p,'úprava údajů'); save(); toast('Údaje uloženy'); render(); };
  document.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=()=>{ const k=p.kontakty[+b.dataset.kdel]; modal(`<h2>Odebrat kontakt</h2><p><b>${esc(k.jmeno)}</b> · ${esc(k.tel)}</p><div class="quick"><button class="btn crit" id="mOk">Odebrat</button><button class="btn" id="mX">Zpět</button></div>`,()=>{ q('mOk').onclick=()=>{ p.kontakty.splice(+b.dataset.kdel,1); p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Úprava údajů',txt:`Odebrán kontakt ${k.jmeno}.`}); log(p,'odebrán kontakt'); closeModal(); save(); render(); }; }); });
  document.querySelectorAll('[data-kedit]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.kedit, k=p.kontakty[i]; modal(`<h2>Upravit kontakt</h2><div class="form"><div class="field"><label>Jméno a vztah</label><input id="e_j" value="${esc(k.jmeno)}"></div><div class="field"><label>Telefon</label><input id="e_t" value="${esc(k.tel)}"></div><div class="field"><label>Role</label><select id="e_r">${['rozhoduje','informovat','pecuje'].filter(r=>isDoc()||r!=='rozhoduje').map(r=>`<option value="${r}" ${k.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Poznámka</label><input id="e_p" value="${esc(k.pozn||'')}"></div><div class="quick"><button class="btn primary" id="mOk">Uložit</button><button class="btn" id="mX">Zpět</button></div></div>`,()=>{ q('mOk').onclick=()=>{ const j=q('e_j').value.trim(), t=q('e_t').value.trim(); if(!j||!t) return toast('Vyplňte jméno i telefon'); Object.assign(k,{jmeno:j,tel:t,role:q('e_r').value,pozn:q('e_p').value.trim()}); log(p,'upraven kontakt'); closeModal(); save(); toast('Kontakt upraven'); render(); }; }); });
  ['btnRevize','btnRevize2'].forEach(i=>{ if(q(i)) q(i).onclick=rev; });
  ['btnVypis','btnVypis3'].forEach(i=>{ if(q(i)) q(i).onclick=()=>showVypis(p); });
  if(q('btnKonecZhorseni')) q('btnKonecZhorseni').onclick=()=>{ p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Změna stavu',txt:'Stav stabilizován, zhoršení ukončeno.'}); p.zhorseni=null; save(); toast('Zhoršení ukončeno'); render(); };
  if(q('btnSavePlan')) q('btnSavePlan').onclick=()=>{
    p.cil=q('f_cil').value; p.limity=[...document.querySelectorAll('input[name=lim]:checked')].map(i=>i.value);
    p.doklad.dvp=q('f_dvp').value==='1'; p.doklad.datum=q('f_dvpd').value; if(p.doklad.dvp) p.doklad.original=q('f_orig').value; else p.doklad.zprava=q('f_orig').value;
    p.funkce=q('f_fun').value; p.alergie=q('f_al').value; p.platnost=q('f_plat').value||p.platnost; p.sos=q('f_sos').value.split('\n').map(s=>s.trim()).filter(Boolean);
    p.lekar={jmeno:actorName(),tel:S.settings.tel||p.lekar.tel,prac:S.settings.prac||p.lekar.prac}; p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Revize',txt:'Plán péče upraven lékařem ('+actorName()+').'}); log(p,'úprava plánu péče'); save(); toast('Plán uložen'); render(); };
  if(q('qtypes')){ let typ='Změna stavu'; q('qtypes').querySelectorAll('button').forEach(b=>b.onclick=()=>{typ=b.dataset.t; q('qtypes').querySelectorAll('button').forEach(x=>x.style=''); b.style='background:var(--accent-soft);border-color:var(--accent)';});
    q('btnAddD').onclick=()=>{ const t=q('d_txt').value.trim(); if(!t) return toast('Napište text zápisu'); p.denik.push({t:now(),kdo:actorName(),role:S.role,typ,txt:t}); log(p,'zápis do deníku'); save(); toast('Zapsáno'); render(); }; }
  if(q('btnZ')) q('btnZ').onclick=()=>{
    const pick=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(i=>i.value);
    const sym=pick('z_sym'), akce=pick('z_akce'), vol=pick('z_vol'), pozn=q('z_pozn').value.trim();
    if(!sym.length&&!pozn) return toast('Vyberte, co pozorujete');
    const souhrn=`Pozorováno: ${[...sym,pozn].filter(Boolean).join(', ')}. Provedeno: ${akce.join(', ')||'nic'}. Voláno: ${vol.join(', ')||'zatím nikdo'}.`;
    p.zhorseni={t:now(),kdo:actorName(),souhrn}; p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Zhoršení stavu',txt:souhrn}); log(p,'zápis zhoršení stavu'); save(); S.tab='karta'; toast('Zhoršení zapsáno, karta aktualizována'); render(); };
  if(q('btnAddK')) q('btnAddK').onclick=()=>{ const j=q('k_j').value.trim(), t=q('k_t').value.trim(); if(!j||!t) return toast('Vyplňte jméno i telefon'); p.kontakty.push({role:q('k_r').value,jmeno:j,tel:t,pozn:q('k_p').value.trim()}); p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Úprava údajů',txt:`Přidán kontakt ${j} (${q('k_r').value}).`}); log(p,'přidán kontakt'); save(); toast('Kontakt přidán'); render(); };
  if(q('btnUkoncit')) q('btnUkoncit').onclick=()=>modal(`<h2>Ukončit péči</h2><p>Průkaz pacienta <b>${esc(p.jmeno)}</b> se uzavře: pořídí se výpis do dokumentace, záznam se přesune do archivu (jen ke čtení) a uvolní se místo pro dalšího pacienta.</p><div class="field"><label>Důvod ukončení</label><select id="uk_d"><option>úmrtí</option><option>předání jinému poskytovateli</option><option>hospitalizace, průkaz ukončen</option><option>na přání pacienta / zástupce</option><option>jiný</option></select></div><div class="quick"><button class="btn crit" id="mOk">Ukončit a archivovat</button><button class="btn" id="mX">Zpět</button></div>`,()=>{ document.getElementById('mOk').onclick=()=>{ const d=document.getElementById('uk_d').value; p.denik.push({t:now(),kdo:actorName(),role:S.role,typ:'Ukončení',txt:'Péče ukončena: '+d+'. Pořízen výpis do dokumentace.'}); log(p,'ukončení péče, výpis'); S.archiv.unshift({id:p.id,jmeno:p.jmeno,rok:p.rok,ukonceno:now(),kdo:actorName(),duvod:d,vypis:vypisText(p)}); if(S.archiv.length>10) S.archiv.length=10; S.patients=S.patients.filter(x=>x.id!==p.id); S.pid=S.patients[0]?.id; S.view='list'; closeModal(); save(); toast('Péče ukončena, záznam v archivu'); render(); }; });
}
function vypisText(p){
  return `VÝPIS Z KRIZOVÉHO PLÁNU PÉČE – ${p.jmeno}, ${p.rok}\nPořídil: ${actorName()}, ${now()}\n\nCíl péče: ${GOALS[p.cil]}\nLimitace: ${p.limity.join(', ')}\nDoklad: ${p.doklad.dvp?'dříve vyslovené přání z '+fmtD(p.doklad.datum)+' (originál: '+p.doklad.original+')':'rozhodnutí lékaře – '+p.doklad.zprava}\nLékař plánu: ${p.lekar.jmeno}, ${p.lekar.prac}\nPlatnost plánu do: ${fmtD(p.platnost)}\nAlergie: ${p.alergie}\nFunkční stav: ${p.funkce}\nSOS medikace:\n${p.sos.map(s=>' - '+s).join('\n')}\n\nKONTAKTY:\n${p.kontakty.map(k=>` - ${k.role}: ${k.jmeno} ${k.tel}${k.pozn?' ('+k.pozn+')':''}`).join('\n')}\n\nDENÍK:\n${p.denik.map(e=>`${e.t} ${e.kdo} [${e.typ}]: ${e.txt}`).join('\n')}\n\nDENÍK PŘÍSTUPŮ:\n${p.pristupy.map(a=>`${a.t} ${a.kdo}: ${a.co}`).join('\n')}`;
}
function showVypis(p){
  log(p,'pořízení výpisu'); save();
  const txt=vypisText(p);
  modal(`<h2>Výpis do zdravotnické dokumentace</h2><pre class="out" id="vtxt">${esc(txt)}</pre><div class="quick"><button class="btn primary" id="mCopy">Zkopírovat</button><button class="btn" id="mX">Zavřít</button></div><div class="note">Pořízení výpisu je zaznamenáno v deníku přístupů. V ostrém provozu se výpis předá do dokumentace poskytovatele (PDF / export).</div>`,()=>{ document.getElementById('mCopy').onclick=()=>copyText(txt,'vtxt'); });
}
function modal(html, bind, sheet){ const m=document.getElementById('modal'); m.innerHTML=`<div class="modal"><div class="box">${sheet?'':'<div class="grab"></div>'}${html}</div></div>`; const x=document.getElementById('mX'); if(x) x.onclick=closeModal; m.querySelector('.modal').onclick=e=>{ if(e.target.classList.contains('modal')) closeModal(); }; if(bind) bind(); }
function closeModal(){ document.getElementById('modal').innerHTML=''; }

// ---------- wizard: nový pacient ----------
function newWizard(){ return {step:1, src:'demo', text:DEMO_REPORT, file:null, thumb:null, ai:null, running:false,
  d:{jmeno:'',rok:'',pohlavi:'muž',pobyt:'',dg:'',cil:'symptom',limity:['KPR'],dvp:false,dvpd:'',orig:'',zprava:'',funkce:'',alergie:'',sos:[],medikace:[],platnost:'',kontakty:[]}}; }
function renderWizard(){
  const w=S.wizard; const steps=['Identifikace','Propouštěcí zpráva','AI rozbor','Cíl péče a limitace','Kontakty','Souhrn'];
  const head=`<div class="wzbar"><div class="ttl"><span>${steps[w.step-1]}</span><span>${w.step} / 6</span></div><div class="bar"><i style="width:${w.step/6*100}%"></i></div></div>`;
  let body='';

function renderAI(w){

  }
  const a=w.ai; const conf=c=>`<span class="chip ${c==='vysoká'?'ok':c==='střední'?'warn':'crit'}">${c}</span>`;
  const item=(k,v,q,c)=>`<div class="item"><div class="k">${k} ${conf(c)}</div><div>${v||'<span style="color:var(--muted)">nenalezeno</span>'}</div>${q?`<div class="q">„${esc(q)}“</div>`:''}</div>`;

      ${item('Diagnózy', esc(a.dg), a.q.dg, a.dg?'vysoká':'nízká')}
      ${item('Alergie', esc(a.alergie), a.q.alergie, a.alergie?'vysoká':'střední')}
      ${item('Pravidelná medikace', a.medikace.map(esc).join('<br>'), a.q.medikace, a.medikace.length?'vysoká':'nízká')}
      ${item('SOS medikace', a.sos.map(esc).join('<br>'), a.q.sos, a.sos.length?'vysoká':'nízká')}
      ${item('Funkční stav', esc(a.funkce), a.q.funkce, a.funkce?'střední':'nízká')}
      ${item('Cíl péče (návrh)', esc(GOALS[a.cil]), a.q.cil, a.q.cil?'střední':'nízká')}
      ${item('Limitace (návrh)', a.limity.map(esc).join(', '), a.q.limity, a.q.limity?'střední':'nízká')}
      ${item('Kontakt rodiny', a.kontakty.map(k=>esc(k.jmeno+' · '+k.tel)).join('<br>'), a.q.kontakty, a.kontakty.length?'vysoká':'nízká')}
    </div></div>
    <div style="display:grid;gap:12px">
      <div class="panel"><div class="panel-h"><h2>Co ve zprávě chybí nebo je třeba dořešit</h2></div><ul class="missing" style="padding:10px 14px 10px 30px;margin:0">${a.missing.map(m=>`<li>${esc(m)}</li>`).join('')||'<li>nic zásadního</li>'}</ul></div>
      <div class="note">Rozbor je návrh. V dalším kroku lékař každou položku potvrdí nebo opraví; do průkazu se zapíše až potvrzená verze se jménem lékaře.</div>
</div><div class="wzfoot"><div class="in"><button class="btn" id="wzBack">Zpět</button><button class="btn primary" id="wzNext">Převzít do plánu péče</button></div></div>`;
}
// simple local "AI": heuristic extraction; in production this is an LLM call
function analyze(text){
  const t=text||''; const lines=t.split('\n').map(l=>l.trim());
  const sect=(names)=>{ const i=lines.findIndex(l=>names.some(n=>l.toLowerCase().startsWith(n))); if(i<0) return []; const out=[]; for(let j=i+1;j<lines.length;j++){ if(!lines[j]) break; if(/^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][^:]{2,40}:/.test(lines[j])) break; out.push(lines[j]); } return out; };
  const find=re=>{ const m=t.match(re); return m?m[0]:''; };
  const a={q:{}};
  const pm=t.match(/Pacient:\s*([^,\n]+),\s*nar\.\s*(\d{4})/i); a.jmeno=pm?pm[1].trim():''; a.rok=pm?pm[2]:''; a.q.jmeno=pm?pm[0]:'';
  const pb=t.match(/Propuštěn[ao]? do:\s*([^\n]+)/i); a.pobyt=pb?pb[1].trim():'';
  const dgl=sect(['diagnózy','diagnozy','dg.']); a.dg=dgl.map(l=>l.replace(/^[A-Z]\d{2}(\.\d)?\s*/,'')).join('; '); a.q.dg=dgl[0]||'';
  const al=t.match(/Alergie:\s*([^\n]+)/i); a.alergie=al?al[1].trim():''; a.q.alergie=al?al[0]:'';
  a.medikace=sect(['medikace při propuštění','medikace','terapie']); a.q.medikace=a.medikace[0]||'';
  const sos=t.match(/SOS medikace:\s*([^\n]+)/i); a.sos=sos?sos[1].split(/,\s*(?=[a-záčďéěíňóřšťúůýž]+\s\d)/i).map(s=>s.trim()):[]; a.q.sos=sos?sos[0]:'';
  const fs=t.match(/Funkční stav:\s*([^\n]+)/i); a.funkce=fs?fs[1].trim():''; a.q.funkce=fs?fs[0]:'';
  const cilS=find(/[^.\n]*(nepřeje|resuscit|ventilátor|cíl[eů]? péče|paliativ|symptomatick)[^.\n]*\./i); a.q.cil=cilS; a.q.limity=cilS;
  a.limity=[]; if(/resuscit|KPR|DNR/i.test(t)) a.limity.push('KPR'); if(/ventil/i.test(t)) a.limity.push('Umělá plicní ventilace'); if(/hospitalizaci jen|bez hospitalizac|další hospitalizac/i.test(t)) a.limity.push('Hospitalizace');
  a.cil = /symptomatick|komfort|paliativní péč/i.test(t) ? 'symptom' : (a.limity.length?'limited':'full');
  const kon=[...t.matchAll(/(syn|dcera|manžel(?:ka)?|opatrovník)\s+([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][^,\n]+?),\s*tel\.?\s*([\d ]{9,})/gi)].map(m=>({jmeno:`${m[2].trim()}, ${m[1].toLowerCase()}`,tel:m[3].trim(),role:'informovat'})); a.kontakty=kon; a.q.kontakty=kon.length?t.match(/Kontakt rodina:[^\n]*/i)?.[0]||'':'';
  a.missing=[];
  if(/nebylo sepsáno|není sepsáno/i.test(t)||!/dříve vyslovené přání/i.test(t)) a.missing.push('Dříve vyslovené přání není sepsáno. Bez něj je limitace pro ZZS jen informací; doporučeno sepsat s úředně ověřeným podpisem.');
  if(!/opatrovník|určená osoba|zástupn/i.test(t)) a.missing.push('Ve zprávě není určena osoba pro zástupné rozhodování (§ 33). Kontakt syna je zatím jen „informovat“.');
  if(!a.funkce) a.missing.push('Chybí popis obvyklého funkčního stavu.');
  if(!a.sos.length) a.missing.push('Chybí SOS medikace.');
  if(/kyslík/i.test(t)) a.missing.push('Pacient je na domácím kyslíku, ověřit zajištění koncentrátoru v DPS.');
  if(!cilS) a.missing.push('Zpráva neobsahuje zápis o rozhovoru o cílech péče; cíl je nutné stanovit a zapsat.');
  return a;
}
function runAI(){
  const w=S.wizard; w.running=true; w.prog=0; w.ai=null; w.step=3; render();
  const tick=()=>{ w.prog++; if(w.prog<7){ render(); setTimeout(tick, 420+Math.random()*300); } else { w.ai=analyze(w.src==='scan'?DEMO_REPORT:w.text); w.running=false; render(); } };
  setTimeout(tick,500);
}
